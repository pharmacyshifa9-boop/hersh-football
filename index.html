<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#06110d;
 --card:#0d2118;
 --card2:#123020;
 --green:#25e889;
 --text:#f5fff9;
 --muted:#91aaa0;
 --line:#1d3b2d;
}

body{
 font-family:Arial,"Noto Sans Arabic",sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

header{
 background:linear-gradient(135deg,#0b2418,#06110d);
 padding:25px 15px;
 text-align:center;
 border-bottom:1px solid var(--line);
}

.logo{
 font-size:30px;
 font-weight:900;
 color:var(--green);
}

.subtitle{
 color:var(--muted);
 margin-top:7px;
 font-size:13px;
}

.container{
 max-width:950px;
 margin:auto;
 padding:15px;
}

.nav{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 margin-bottom:18px;
}

.nav button{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 padding:12px 4px;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
}

.nav button.active{
 background:var(--green);
 color:#031109;
}

.section{
 display:none;
}

.section.active{
 display:block;
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
}

.section-title h1{
 font-size:20px;
}

.refresh{
 border:0;
 background:var(--green);
 color:#031109;
 padding:9px 13px;
 border-radius:11px;
 font-weight:bold;
}

.status{
 background:var(--card);
 border:1px solid var(--line);
 padding:12px;
 border-radius:14px;
 margin-bottom:13px;
 text-align:center;
 color:var(--muted);
}

.empty{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:30px 15px;
 text-align:center;
 color:var(--muted);
}

.error{
 color:#ff6666;
}


/* MATCH / RESULT */

.match{
 background:linear-gradient(145deg,var(--card),#091a12);
 border:1px solid var(--line);
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.match-league{
 text-align:center;
 color:var(--green);
 font-weight:bold;
 font-size:13px;
 margin-bottom:12px;
}

.match-teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:8px;
}

.match-team{
 background:var(--card2);
 border-radius:14px;
 min-height:105px;
 padding:10px 5px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.match-team img{
 width:45px;
 height:45px;
 object-fit:contain;
 margin-bottom:7px;
}

.team-name{
 font-size:12px;
 font-weight:bold;
}

.score{
 color:var(--green);
 font-size:23px;
 font-weight:900;
 white-space:nowrap;
}

.match-time{
 color:var(--muted);
 text-align:center;
 font-size:11px;
 margin-top:10px;
}


/* TRANSFERS */

.transfer{
 background:linear-gradient(145deg,var(--card),#091a12);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
}

.player{
 color:var(--green);
 font-size:19px;
 font-weight:900;
 margin-bottom:13px;
}

.transfer-teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:7px;
}

.transfer-team{
 background:var(--card2);
 border-radius:14px;
 min-height:90px;
 padding:10px 5px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.transfer-team img{
 width:40px;
 height:40px;
 object-fit:contain;
 margin-bottom:6px;
}

.arrow{
 color:var(--green);
 font-size:25px;
 font-weight:bold;
}

.transfer-info{
 display:flex;
 justify-content:space-between;
 margin-top:12px;
 padding-top:10px;
 border-top:1px solid var(--line);
}

.date{
 color:var(--muted);
 font-size:12px;
}

.type{
 color:var(--green);
 background:rgba(37,232,137,.12);
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
}


/* STANDINGS */

.league-card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 margin-bottom:18px;
}

.league-header{
 background:var(--card2);
 padding:14px;
 display:flex;
 align-items:center;
 gap:9px;
 color:var(--green);
 font-size:17px;
 font-weight:900;
}

.league-logo{
 width:34px;
 height:34px;
 object-fit:contain;
}

.table-scroll{
 overflow-x:auto;
}

.standings-table{
 width:100%;
 min-width:570px;
 border-collapse:collapse;
}

.standings-table th{
 color:var(--muted);
 font-size:11px;
 padding:11px 5px;
 border-bottom:1px solid var(--line);
}

.standings-table td{
 padding:10px 5px;
 text-align:center;
 font-size:12px;
 border-bottom:1px solid var(--line);
}

.rank{
 color:var(--green);
 font-weight:900;
}

.club{
 text-align:right!important;
 font-weight:bold;
 white-space:nowrap;
}

.club img{
 width:28px;
 height:28px;
 object-fit:contain;
 vertical-align:middle;
 margin-left:6px;
}

.points{
 color:var(--green);
 font-weight:900;
 font-size:14px!important;
}

footer{
 text-align:center;
 color:var(--muted);
 padding:30px 15px;
 font-size:12px;
}

@media(max-width:500px){

 .logo{
  font-size:27px;
 }

 .nav button{
  font-size:10px;
 }

 .team-name{
  font-size:10px;
 }

 .score{
  font-size:20px;
 }

}

</style>
</head>


<body>


<header>

 <div class="logo">
  Hersh Football ⚽
 </div>

 <div class="subtitle">
  نوێترین یاری، ئەنجام، گواستنەوە و خشتەکانی لیگ
 </div>

</header>


<main class="container">


<div class="nav">

 <button class="active"
 onclick="showSection('matches',this)">
 ⚽ یارییەکان
 </button>

 <button
 onclick="showSection('results',this)">
 🏁 ئەنجامەکان
 </button>

 <button
 onclick="showSection('transfers',this)">
 🔄 گواستنەوە
 </button>

 <button
 onclick="showSection('standings',this)">
 🏆 خشتە
 </button>

</div>


<!-- MATCHES -->

<section id="matchesSection" class="section active">

 <div class="section-title">

  <h1>⚽ یارییەکان</h1>

  <button class="refresh"
  onclick="loadMatches()">
   🔄
  </button>

 </div>

 <div id="matchStatus" class="status">
  ⏳ چاوەڕێی داتا...
 </div>

 <div id="matches"></div>

</section>


<!-- RESULTS -->

<section id="resultsSection" class="section">

 <div class="section-title">

  <h1>🏁 ئەنجامەکان</h1>

  <button class="refresh"
  onclick="loadResults()">
   🔄
  </button>

 </div>

 <div id="resultStatus" class="status">
  ⏳ چاوەڕێی داتا...
 </div>

 <div id="results"></div>

</section>


<!-- TRANSFERS -->

<section id="transfersSection" class="section">

 <div class="section-title">

  <h1>🔄 گواستنەوەکان</h1>

  <button class="refresh"
  onclick="loadTransfers()">
   🔄
  </button>

 </div>

 <div id="transferStatus" class="status">
  ⏳ چاوەڕێی داتا...
 </div>

 <div id="transfers"></div>

</section>


<!-- STANDINGS -->

<section id="standingsSection" class="section">

 <div class="section-title">

  <h1>🏆 خشتەکانی لیگ</h1>

  <button class="refresh"
  onclick="loadStandings()">
   🔄
  </button>

 </div>

 <div id="standingsStatus" class="status">
  ⏳ چاوەڕێی داتا...
 </div>

 <div id="standings"></div>

</section>


</main>


<footer>
 Hersh Football ⚽
 <br>
 Kurdish Football App
</footer>


<script>


/* =========================
   HELPER
========================= */

function escapeHTML(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================
   NAVIGATION
========================= */

function showSection(name,button){

 document.querySelectorAll(".nav button")
 .forEach(function(btn){
  btn.classList.remove("active");
 });

 button.classList.add("active");

 document.querySelectorAll(".section")
 .forEach(function(section){
  section.classList.remove("active");
 });

 document
 .getElementById(name+"Section")
 .classList.add("active");

}


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches(){

 const status =
 document.getElementById("matchStatus");

 const box =
 document.getElementById("matches");

 status.textContent =
 "⏳ یارییەکان دەخوێندرێنەوە...";

 box.innerHTML="";


 try{

  const response =
  await fetch(
   "matches.json?t="+Date.now()
  );

  if(!response.ok)
   throw new Error("matches.json");

  const json =
  await response.json();

  const matches =
  Array.isArray(json.matches)
  ? json.matches
  : [];


  if(!matches.length){

   status.textContent =
   "هیچ یارییەک نییە";

   box.innerHTML=`
    <div class="empty">
     ⚽ هیچ یارییەک بەردەست نییە
    </div>
   `;

   return;
  }


  status.textContent =
  "✅ "+matches.length+" یاری";


  matches.forEach(function(item){

   const fixture =
   item.fixture || {};

   const league =
   item.league || {};

   /*
    گرنگ:
    داتای تۆ:
    item.home
    item.away
    item.goals
   */

   const home =
   item.home || {};

   const away =
   item.away || {};

   const goals =
   item.goals || {};


   const homeName =
   home.name || "";

   const awayName =
   away.name || "";


   const card =
   document.createElement("div");

   card.className="match";


   card.innerHTML=`

    <div class="match-league">

     🏆
     ${escapeHTML(
      league.name || ""
     )}

    </div>


    <div class="match-teams">


     <div class="match-team">

      ${
       home.logo
       ?
       `
       <img
        src="${escapeHTML(home.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(homeName)}

      </div>

     </div>


     <div class="score">

      ${
       goals.home !== null &&
       goals.home !== undefined
       ?
       escapeHTML(goals.home)
       :
       "-"
      }

      -

      ${
       goals.away !== null &&
       goals.away !== undefined
       ?
       escapeHTML(goals.away)
       :
       "-"
      }

     </div>


     <div class="match-team">

      ${
       away.logo
       ?
       `
       <img
        src="${escapeHTML(away.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(awayName)}

      </div>

     </div>


    </div>


    <div class="match-time">

     ${escapeHTML(
      fixture.status?.long ||
      fixture.status?.short ||
      ""
     )}

    </div>

   `;


   box.appendChild(card);

  });


 }catch(error){

  console.error(error);

  status.innerHTML=`
   <span class="error">
    ❌ کێشە لە matches.json
   </span>
  `;

 }

}


/* =========================
   LOAD RESULTS
========================= */

async function loadResults(){

 const status =
 document.getElementById("resultStatus");

 const box =
 document.getElementById("results");

 status.textContent =
 "⏳ ئەنجامەکان دەخوێندرێنەوە...";

 box.innerHTML="";


 try{

  const response =
  await fetch(
   "matches.json?t="+Date.now()
  );

  if(!response.ok)
   throw new Error("matches.json");

  const json =
  await response.json();

  const matches =
  Array.isArray(json.matches)
  ? json.matches
  : [];


  const results =
  matches.filter(function(item){

   const s =
   item?.fixture?.status?.short;

   return(
    s==="FT" ||
    s==="AET" ||
    s==="PEN"
   );

  });


  if(!results.length){

   status.textContent =
   "هیچ ئەنجامێکی تەواو نییە";

   box.innerHTML=`
    <div class="empty">
     🏁 هیچ ئەنجامێکی تەواو نییە
    </div>
   `;

   return;
  }


  status.textContent =
  "✅ "+results.length+" ئەنجام";


  results.forEach(function(item){

   const fixture =
   item.fixture || {};

   const league =
   item.league || {};

   /*
    ئەمە گرنگترین بەشە:

    ناوی یانەکان لە item.home
    و item.away ـە.

    نەک teams.home
    نەک teams.away
   */

   const home =
   item.home || {};

   const away =
   item.away || {};

   const goals =
   item.goals || {};


   const homeName =
   home.name || "";

   const awayName =
   away.name || "";


   const homeGoals =
   goals.home ?? 0;

   const awayGoals =
   goals.away ?? 0;


   const card =
   document.createElement("div");

   card.className="match";


   card.innerHTML=`

    <div class="match-league">

     🏆
     ${escapeHTML(
      league.name || ""
     )}

    </div>


    <div class="match-teams">


     <div class="match-team">

      ${
       home.logo
       ?
       `
       <img
        src="${escapeHTML(home.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(homeName)}

      </div>

     </div>


     <div class="score">

      ${escapeHTML(homeGoals)}
      -
      ${escapeHTML(awayGoals)}

     </div>


     <div class="match-team">

      ${
       away.logo
       ?
       `
       <img
        src="${escapeHTML(away.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(awayName)}

      </div>

     </div>


    </div>


    <div class="match-time">

     🏁
     ${escapeHTML(
      fixture.status?.long ||
      fixture.status?.short ||
      "FT"
     )}

    </div>

   `;


   box.appendChild(card);

  });


 }catch(error){

  console.error(error);

  status.innerHTML=`
   <span class="error">
    ❌ کێشە لە matches.json
   </span>
  `;

 }

}


/* =========================
   LOAD TRANSFERS
========================= */

async function loadTransfers(){

 const status =
 document.getElementById("transferStatus");

 const box =
 document.getElementById("transfers");

 status.textContent =
 "⏳ گواستنەوەکان دەخوێندرێنەوە...";

 box.innerHTML="";


 try{

  const response =
  await fetch(
   "transfers.json?t="+Date.now()
  );

  if(!response.ok)
   throw new Error("transfers.json");

  const json =
  await response.json();


  const data =
  Array.isArray(json)
  ? json
  :
  Array.isArray(json.transfers)
  ? json.transfers
  : [];


  if(!data.length){

   status.textContent =
   "هیچ گواستنەوەیەک نییە";

   box.innerHTML=`
    <div class="empty">
     🔄 هیچ گواستنەوەیەک نییە
    </div>
   `;

   return;
  }


  status.textContent =
  "✅ "+data.length+" گواستنەوە";


  data.forEach(function(item){

   const player =
   item.player || {};

   const teams =
   item.teams || {};

   const inTeam =
   teams.in || {};

   const outTeam =
   teams.out || {};


   const card =
   document.createElement("div");

   card.className="transfer";


   card.innerHTML=`

    <div class="player">

     ⚽
     ${escapeHTML(
      player.name || "یاریزان"
     )}

    </div>


    <div class="transfer-teams">


     <div class="transfer-team">

      ${
       outTeam.logo
       ?
       `
       <img
        src="${escapeHTML(outTeam.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(
        outTeam.name || ""
       )}

      </div>

     </div>


     <div class="arrow">
      →
     </div>


     <div class="transfer-team">

      ${
       inTeam.logo
       ?
       `
       <img
        src="${escapeHTML(inTeam.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">

       ${escapeHTML(
        inTeam.name || ""
       )}

      </div>

     </div>


    </div>


    <div class="transfer-info">

     <div class="date">

      📅
      ${escapeHTML(
       item.date || ""
      )}

     </div>


     <div class="type">

      ${escapeHTML(
       item.type || "Transfer"
      )}

     </div>

    </div>

   `;


   box.appendChild(card);

  });


 }catch(error){

  console.error(error);

  status.innerHTML=`
   <span class="error">
    ❌ کێشە لە transfers.json
   </span>
  `;

 }

}


/* =========================
   LOAD STANDINGS
========================= */

async function loadStandings(){

 const status =
 document.getElementById("standingsStatus");

 const box =
 document.getElementById("standings");

 status.textContent =
 "⏳ خشتەکان دەخوێندرێنەوە...";

 box.innerHTML="";


 try{

  const response =
  await fetch(
   "standings.json?t="+Date.now()
  );

  if(!response.ok)
   throw new Error("standings.json");

  const json =
  await response.json();

  const leagues =
  json.leagues || {};

  const names =
  Object.keys(leagues);


  if(!names.length){

   status.textContent =
   "هیچ لیگێک نییە";

   box.innerHTML=`
    <div class="empty">
     🏆 هیچ خشتەیەک نییە
    </div>
   `;

   return;
  }


  status.textContent =
  "✅ "+names.length+" لیگ";


  names.forEach(function(name){

   const league =
   leagues[name] || {};

   const rows =
   Array.isArray(league.standings)
   ? league.standings
   : [];


   const card =
   document.createElement("div");

   card.className="league-card";


   let html=`

    <div class="league-header">

     ${
      league.logo
      ?
      `
      <img
       class="league-logo"
       src="${escapeHTML(league.logo)}"
       onerror="this.style.display='none'"
      >
      `
      :
      "🏆"
     }

     ${escapeHTML(name)}

    </div>


    <div class="table-scroll">

     <table class="standings-table">

      <thead>

       <tr>

        <th>#</th>
        <th>یانە</th>
        <th>یاری</th>
        <th>بردنەوە</th>
        <th>مساوی</th>
        <th>دۆڕان</th>
        <th>خاڵ</th>

       </tr>

      </thead>

      <tbody>

   `;


   rows.forEach(function(row){

    const team =
    row.team || {};

    const all =
    row.all || {};


    html+=`

     <tr>

      <td class="rank">

       ${escapeHTML(
        row.rank ?? "-"
       )}

      </td>


      <td class="club">

       ${
        team.logo
        ?
        `
        <img
         src="${escapeHTML(team.logo)}"
         alt=""
         onerror="this.style.display='none'"
        >
        `
        :
        ""
       }

       ${escapeHTML(
        team.name || ""
       )}

      </td>


      <td>

       ${escapeHTML(
        all.played ?? "-"
       )}

      </td>


      <td>

       ${escapeHTML(
        all.win ?? "-"
       )}

      </td>


      <td>

       ${escapeHTML(
        all.draw ?? "-"
       )}

      </td>


      <td>

       ${escapeHTML(
        all.lose ?? "-"
       )}

      </td>


      <td class="points">

       ${escapeHTML(
        row.points ?? "-"
       )}

      </td>

     </tr>

    `;

   });


   html+=`

      </tbody>

     </table>

    </div>

   `;


   card.innerHTML =
   html;

   box.appendChild(card);

  });


 }catch(error){

  console.error(error);

  status.innerHTML=`
   <span class="error">
    ❌ کێشە لە standings.json
   </span>
  `;

 }

}


/* =========================
   START
========================= */

loadMatches();
loadResults();
loadTransfers();
loadStandings();

</script>

</body>
</html>
