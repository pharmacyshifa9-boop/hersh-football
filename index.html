<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06110d;
  --card:#0d2118;
  --card2:#123020;
  --green:#25e889;
  --text:#f5fff9;
  --muted:#91aaa0;
  --line:#1d3b2d;
  --red:#ff6b6b;
}

body{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#0b2418,#06110d);
  padding:25px 18px;
  border-bottom:1px solid var(--line);
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:900;
  color:var(--green);
}

.subtitle{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.back{
  display:block;
  margin:12px auto;
  max-width:850px;
  padding:12px;
  text-align:center;
  background:var(--green);
  color:#031109;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:15px;
}

.section{
  margin-bottom:28px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.title h1{
  font-size:21px;
}

.refresh{
  border:0;
  background:var(--green);
  color:#031109;
  font-weight:bold;
  padding:10px 14px;
  border-radius:12px;
}

.status{
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  border-radius:14px;
  margin-bottom:14px;
  color:var(--muted);
  text-align:center;
}

/* =========================
   MATCHES
========================= */

.match{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.league{
  text-align:center;
  color:var(--green);
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.match-team{
  background:var(--card2);
  border-radius:14px;
  padding:12px 6px;
  min-height:100px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.match-team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.match-team-name{
  font-size:12px;
  font-weight:bold;
}

.score{
  color:var(--green);
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.match-time{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

.live{
  color:var(--red);
  font-size:12px;
}

/* =========================
   TRANSFERS
========================= */

.transfer{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.player{
  color:var(--green);
  font-size:19px;
  font-weight:900;
  margin-bottom:12px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.team{
  background:var(--card2);
  border-radius:14px;
  min-height:90px;
  padding:10px 5px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.team img{
  width:40px;
  height:40px;
  object-fit:contain;
  margin-bottom:6px;
}

.team-name{
  font-size:12px;
  font-weight:bold;
}

.arrow{
  color:var(--green);
  font-size:25px;
  font-weight:bold;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.date{
  color:var(--muted);
  font-size:12px;
}

.type{
  color:var(--green);
  background:rgba(37,232,137,.12);
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

/* =========================
   STANDINGS
========================= */

.standings{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
}

.standings-header{
  background:var(--card2);
  padding:15px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
}

th{
  color:var(--muted);
  font-size:11px;
  padding:11px 5px;
  border-bottom:1px solid var(--line);
}

td{
  padding:10px 5px;
  text-align:center;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

tr:last-child td{
  border-bottom:0;
}

.rank{
  color:var(--green);
  font-weight:900;
}

.club{
  text-align:right;
  font-weight:bold;
}

.club img{
  width:27px;
  height:27px;
  object-fit:contain;
  vertical-align:middle;
  margin-left:5px;
}

.points{
  color:var(--green);
  font-weight:900;
}

.empty{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px 15px;
  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:11px;
  }

  .title h1{
    font-size:18px;
  }

  .logo{
    font-size:27px;
  }

  .match-team-name,
  .team-name{
    font-size:10px;
  }

  .player{
    font-size:17px;
  }

}

</style>
</head>

<body>

<a href="home.html" class="back">
🏠 گەڕانەوە بۆ سەرەتا
</a>

<header>

  <div class="logo">
    Hersh Football ⚽
  </div>

  <div class="subtitle">
    نوێترین داتا و هەواڵی جیهانی تۆپی پێ
  </div>

</header>


<main class="container">


<!-- =========================
     TODAY MATCHES
========================= -->

<section class="section">

  <div class="title">

    <h1>
      ⚽ یارییەکانی ئەمڕۆ
    </h1>

    <button
      class="refresh"
      onclick="loadAll()">
      🔄 نوێکردنەوە
    </button>

  </div>

  <div
    class="status"
    id="matchStatus">
    ⏳ چاوەڕێی داتا...
  </div>

  <div id="matches"></div>

</section>


<!-- =========================
     TRANSFERS
========================= -->

<section class="section">

  <div class="title">

    <h1>
      🔄 گواستنەوەکان
    </h1>

  </div>

  <div
    class="status"
    id="transferStatus">
    ⏳ چاوەڕێی داتا...
  </div>

  <div id="transfers"></div>

</section>


<!-- =========================
     STANDINGS
========================= -->

<section class="section">

  <div class="title">

    <h1>
      🏆 خشتەی لیگ
    </h1>

  </div>

  <div
    class="status"
    id="standingsStatus">
    ⏳ خشتەکان بار دەکرێن...
  </div>

  <div id="standings"></div>

</section>


</main>


<footer>
Hersh Football ⚽ — Kurdish Football App
</footer>


<script>

/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MATCHES
========================= */

async function loadMatches(){

  const status =
    document.getElementById(
      "matchStatus"
    );

  const container =
    document.getElementById(
      "matches"
    );

  try{

    const response =
      await fetch(
        "matches.json?t=" +
        Date.now()
      );

    if(!response.ok){
      throw new Error(
        "matches.json not found"
      );
    }

    const json =
      await response.json();

    const matches =
      Array.isArray(json.matches)
      ? json.matches
      : [];

    if(matches.length === 0){

      status.textContent =
        "هیچ یارییەک نییە";

      container.innerHTML = `
        <div class="empty">
          ⚽ ئەمڕۆ هیچ یارییەک بەردەست نییە.
        </div>
      `;

      return;
    }

    status.textContent =
      "✅ " +
      matches.length +
      " یاری";

    container.innerHTML = "";

    matches.forEach(item => {

      const fixture =
        item.fixture || {};

      const league =
        item.league || {};

      const home =
        item.home || {};

      const away =
        item.away || {};

      const goals =
        item.goals || {};

      let time = "";

      if(fixture.date){

        try{

          time =
            new Date(
              fixture.date
            ).toLocaleTimeString(
              "ku-IQ",
              {
                hour:"2-digit",
                minute:"2-digit"
              }
            );

        }catch(e){}

      }

      const live =
        ["1H","2H","ET","P","LIVE"]
        .includes(
          fixture.status?.short
        );

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "match";

      card.innerHTML = `

        <div class="league">
          🏆 ${escapeHTML(
            league.name ||
            "Football"
          )}
        </div>

        <div class="match-teams">

          <div class="match-team">

            ${
              home.logo
              ?
              `<img
                src="${escapeHTML(home.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              ""
            }

            <div class="match-team-name">
              ${escapeHTML(
                home.name ||
                "Home"
              )}
            </div>

          </div>

          <div class="score">

            ${
              live
              ?
              `<span class="live">
                🔴 LIVE
              </span><br>`
              :
              ""
            }

            ${escapeHTML(
              goals.home ?? "-"
            )}
            -
            ${escapeHTML(
              goals.away ?? "-"
            )}

          </div>

          <div class="match-team">

            ${
              away.logo
              ?
              `<img
                src="${escapeHTML(away.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              ""
            }

            <div class="match-team-name">
              ${escapeHTML(
                away.name ||
                "Away"
              )}
            </div>

          </div>

        </div>

        <div class="match-time">
          🕐 ${escapeHTML(
            time ||
            "کات دیاری نەکراوە"
          )}
        </div>

      `;

      container.appendChild(
        card
      );

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ کێشە لە داتا";

    container.innerHTML = `
      <div class="empty">
        matches.json نەدۆزرایەوە.
      </div>
    `;

  }

}


/* =========================
   TRANSFERS
========================= */

      const outTeam =

      const card =
        document.createElement(

      card.className =

      card.innerHTML = `

              ?
              `<img
                src="${escapeHTML(outTeam.logo)}"

              :
              ""
            }

              ${escapeHTML(

                "تیمی نەزانراوە"
              )}
            </div>

          </div>

          <div class="arrow">
            →
          </div>

          <div class="team">

            ${
              inTeam.logo
              ?
              `<img
                src="${escapeHTML(inTeam.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              ""
            }

            <div class="team-name">
              ${escapeHTML(
                inTeam.name ||
                "تیمی نەزانراوە"
              )}
            </div>

          </div>

        </div>

        <div class="info">

          <div class="date">
            📅 ${escapeHTML(
              item.date ||
              "بێ‌ڕێکەوت"
            )}
          </div>

          <div class="type">
            ${escapeHTML(
              item.type ||
              "Transfer"
            )}
          </div>

        </div>

      `;

      container.appendChild
