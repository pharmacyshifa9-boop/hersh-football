<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06110d;
  --card:#0d2118;
  --card2:#123020;
  --green:#25e889;
  --green2:#12bd70;
  --text:#f5fff9;
  --muted:#91aaa0;
  --line:#1d3b2d;
  --red:#ff5b5b;
}

body{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:
    radial-gradient(circle at top,#103b25 0,#06110d 40%);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#0b2418,#06110d);
  padding:24px 15px;
  border-bottom:1px solid var(--line);
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:var(--green);
  font-size:30px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:18px;
}

.nav button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:11px 4px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.nav button.active{
  background:var(--green);
  color:#031109;
}

.section{
  margin-bottom:30px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.section-title h1{
  font-size:20px;
}

.refresh{
  border:0;
  background:var(--green);
  color:#031109;
  padding:9px 13px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.status{
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  border-radius:14px;
  margin-bottom:13px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* MATCH / RESULT */

.match{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.match-league{
  text-align:center;
  color:var(--green);
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:7px;
}

.match-team{
  background:var(--card2);
  border-radius:14px;
  min-height:100px;
  padding:10px 5px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.match-team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.team-name{
  font-size:12px;
  font-weight:bold;
}

.score{
  color:var(--green);
  font-size:21px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
}

.live{
  display:block;
  color:var(--red);
  font-size:11px;
  margin-bottom:4px;
}

.match-time{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

/* TRANSFERS */

.transfer{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.player{
  color:var(--green);
  font-size:19px;
  font-weight:900;
  margin-bottom:13px;
}

.transfer-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:7px;
}

.transfer-team{
  background:var(--card2);
  border-radius:14px;
  min-height:90px;
  padding:10px 5px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.transfer-team img{
  width:40px;
  height:40px;
  object-fit:contain;
  margin-bottom:6px;
}

.arrow{
  color:var(--green);
  font-size:25px;
  font-weight:bold;
}

.transfer-info{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.date{
  color:var(--muted);
  font-size:12px;
}

.type{
  color:var(--green);
  background:rgba(37,232,137,.12);
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

/* STANDINGS */

.league-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
}

.league-header{
  background:var(--card2);
  padding:14px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.league-logo{
  width:34px;
  height:34px;
  object-fit:contain;
}

.table-scroll{
  overflow-x:auto;
}

.standings-table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
}

.standings-table th{
  color:var(--muted);
  font-size:11px;
  padding:11px 5px;
  border-bottom:1px solid var(--line);
}

.standings-table td{
  padding:10px 5px;
  text-align:center;
  font-size:12px;
  border-bottom:1px solid var(--line);
}

.standings-table tr:last-child td{
  border-bottom:0;
}

.rank{
  color:var(--green);
  font-weight:900;
}

.club{
  text-align:right !important;
  font-weight:bold;
  white-space:nowrap;
}

.club img{
  width:28px;
  height:28px;
  object-fit:contain;
  vertical-align:middle;
  margin-left:6px;
}

.points{
  color:var(--green);
  font-weight:900;
  font-size:14px !important;
}

.empty{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  line-height:2;
}

.error{
  color:var(--red);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:11px;
  }

  .logo{
    font-size:27px;
  }

  .nav button{
    font-size:10px;
  }

  .section-title h1{
    font-size:18px;
  }

  .team-name{
    font-size:10px;
  }

}

</style>
</head>
