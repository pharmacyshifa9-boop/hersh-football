<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06110d;
  --card:#0d2118;
  --card2:#123020;
  --green:#25e889;
  --green2:#12bd70;
  --text:#f5fff9;
  --muted:#91aaa0;
  --line:#1d3b2d;
  --red:#ff6b6b;
  --yellow:#ffd166;
}

body{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#0b2418,#06110d);
  padding:25px 18px;
  border-bottom:1px solid var(--line);
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:900;
  color:var(--green);
}

.subtitle{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px;
}

.back{
  display:block;
  margin:12px auto;
  max-width:850px;
  padding:12px;
  text-align:center;
  background:var(--green);
  color:#031109;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
}

.section{
  margin-top:22px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.title h1{
  font-size:22px;
}

.refresh{
  border:0;
  background:var(--green);
  color:#031109;
  font-weight:bold;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
}

.status{
  background:var(--card);
  border:1px solid var(--line);
  padding:13px;
  border-radius:14px;
  margin-bottom:15px;
  color:var(--muted);
  text-align:center;
}

/* Transfers */

.transfer{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.player{
  font-size:20px;
  font-weight:900;
  color:var(--green);
  margin-bottom:13px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team{
  background:var(--card2);
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
  min-height:90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.team-name{
  font-size:13px;
  font-weight:bold;
}

.arrow{
  font-size:25px;
  color:var(--green);
  font-weight:bold;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  gap:10px;
}

.date{
  color:var(--muted);
  font-size:13px;
}

.type{
  padding:6px 10px;
  border-radius:20px;
  background:rgba(37,232,137,.12);
  color:var(--green);
  font-size:12px;
  font-weight:bold;
}

/* Matches */

.match{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:13px;
}

.league{
  color:var(--green);
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
  text-align:center;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.match-team{
  text-align:center;
  background:var(--card2);
  border-radius:14px;
  padding:12px 7px;
  min-height:100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.match-team img{
  width:45px;
  height:45px;
  object-fit:contain;
  margin-bottom:7px;
}

.match-team-name{
  font-size:13px;
  font-weight:bold;
}

.score{
  font-size:20px;
  font-weight:900;
  color:var(--green);
  text-align:center;
}

.match-time{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
}

.status-live{
  color:var(--red);
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
}

.loading{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px 15px;
  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  .title h1{
    font-size:19px;
  }

  .teams,
  .match-teams{
    gap:5px;
  }

  .team-name,
  .match-team-name{
    font-size:11px;
  }

  .player{
    font-size:18px;
  }

  .match-team img{
    width:38px;
    height:38px;
  }
}
</style>
</head>

<body>

<a href="home.html" class="back">
🏠 گەڕانەوە بۆ سەرەتا
</a>

<header>
  <div class="logo">
    Hersh Football ⚽
  </div>

  <div class="subtitle">
    نوێترین هەواڵ و گواستنەوەکانی یاریزانان
  </div>
</header>

<main class="container">

  <!-- MATCHES -->

  <section class="section">

    <div class="title">
      <h1>⚽ یارییەکانی ئەمڕۆ</h1>

      <button class="refresh" onclick="loadAll()">
        🔄 نوێکردنەوە
      </button>
    </div>

    <div class="status" id="matchStatus">
      ⏳ چاوەڕێی داتا دەکەین...
    </div>

    <div id="matches">
      <div class="loading">
        ⏳ یارییەکان بار دەکرێن...
      </div>
    </div>

  </section>


  <!-- TRANSFERS -->

  <section class="section">

    <div class="title">
      <h1>🔄 گواستنەوەی یاریزانان</h1>
    </div>

    <div class="status" id="transferStatus">
      ⏳ چاوەڕێی داتا دەکەین...
    </div>

    <div id="transfers">
      <div class="loading">
        ⏳ گواستنەوەکان بار دەکرێن...
      </div>
    </div>

  </section>

</main>

<footer>
  Hersh Football ⚽ — Kurdish Football App
</footer>


<script>

function escapeHTML(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   TRANSFERS
========================= */

async function loadTransfers(){

  const status =
    document.getElementById("transferStatus");

  const container =
    document.getElementById("transfers");

  status.textContent =
    "⏳ گواستنەوەکان نوێ دەکرێنەوە...";

  container.innerHTML =
    `<div class="loading">⏳ چاوەڕێ بکە...</div>`;

  try{

    const response =
      await fetch("transfers.json?t=" + Date.now());

    if(!response.ok){
      throw new Error("transfers.json not found");
    }

    const json =
      await response.json();

    let data =
      Array.isArray(json)
      ? json
      : Array.isArray(json.transfers)
      ? json.transfers
      : [];

    if(data.length === 0){

      container.innerHTML = `
        <div class="empty">
          هیچ گواستنەوەیەکی نوێ بەردەست نییە.
        </div>
      `;

      status.textContent =
        "هیچ گواستنەوەیەک نییە";

      return;
    }

    status.textContent =
      "✅ " + data.length +
      " گواستنەوە دۆزرایەوە";

    data.forEach(item => {

      const player =
        item.player || {};

      const inTeam =
        item.teams?.in || {};

      const outTeam =
        item.teams?.out || {};

      const card =
        document.createElement("div");

      card.className =
        "transfer";

      card.innerHTML = `

        <div class="player">
          ⚽ ${escapeHTML(
            player.name || "یاریزان"
          )}
        </div>

        <div class="teams">

          <div class="team">

            ${
              outTeam.logo
              ?
              `<img src="${escapeHTML(outTeam.logo)}"
                    alt=""
                    onerror="this.style.display='none'">`
              :
              ""
            }

            <div class="team-name">
              ${escapeHTML(
                outTeam.name ||
                "تیمی نەزانراوە"
              )}
            </div>

          </div>

          <div class="arrow">
            →
          </div>

          <div class="team">

            ${
              inTeam.logo
              ?
              `<img src="${escapeHTML(inTeam.logo)}"
                    alt=""
                    onerror="this.style.display='none'">`
              :
              ""
            }

            <div class="team-name">
              ${escapeHTML(
                inTeam.name ||
                "تیمی نەزانراوە"
              )}
            </div>

          </div>

        </div>

        <div class="info">

          <div class="date">
            📅 ${escapeHTML(
              item.date || "بێ‌ڕێکەوت"
            )}
          </div>

          <div class="type">
            ${escapeHTML(
              item.type || "Transfer"
            )}
          </div>

        </div>
      `;

      container.appendChild(card);

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ کێشە لە خوێندنەوەی گواستنەوەکان";

    container.innerHTML = `
      <div class="empty">
        تکایە دڵنیابە لە بوونی
        <b>transfers.json</b>
      </div>
    `;
  }
}


/* =========================
   MATCHES
========================= */

async function loadMatches(){

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matches");

  status.textContent =
    "⏳ یارییەکان نوێ دەکرێنەوە...";

  container.innerHTML =
    `<div class="loading">⏳ چاوەڕێ بکە...</div>`;

  try{

    const response =
      await fetch("matches.json?t=" + Date.now());

    if(!response.ok){
      throw new Error("matches.json not found");
    }

    const json =
      await response.json();

    const data =
      Array.isArray(json.matches)
      ? json.matches
      : [];

    if(data.length === 0){

      container.innerHTML = `
        <div class="empty">
          ئەمڕۆ هیچ یارییەک بەردەست نییە.
        </div>
      `;

      status.textContent =
        "هیچ یارییەک نییە";

      return;
    }

    status.textContent =
      "✅ " + data.length +
      " یاری دۆزرایەوە";

    data.forEach(item => {

      const league =
        item.league || {};

      const home =
        item.home || {};

      const away =
        item.away || {};

      const fixture =
        item.fixture || {};

      const goals =
        item.goals || {};

      const homeScore =
        goals.home ?? "-";

      const awayScore =
        goals.away ?? "-";

      let time = "";

      if(fixture.date){

        try{

          time =
            new Date(
              fixture.date
            ).toLocaleTimeString(
              "ku-IQ",
              {
                hour:"2-digit",
                minute:"2-digit"
              }
            );

        }catch(e){
          time = "";
        }
      }

      const statusShort =
        fixture.status?.short || "";

      const live =
        ["1H","2H","ET","P","LIVE"]
        .includes(statusShort);

      const card =
        document.createElement("div");

      card.className =
        "match";

      card.innerHTML = `

        <div class="league">
          🏆 ${escapeHTML(
            league.name ||
            "Football"
          )}
        </div>

        <div class="match-teams">

          <div class="match-team">

            ${
              home.logo
              ?
              `<img src="${escapeHTML(home.logo)}"
                    alt=""
                    onerror="this.style.display='none'">`
              :
              ""
            }

            <div class="match-team-name">
              ${escapeHTML(
                home.name ||
                "Home"
              )}
            </div>

          </div>

          <div class="score">

            ${
              live
              ?
              `<span class="status-live">
                 LIVE
               </span>
               <br>`
              :
              ""
            }

            ${escapeHTML(homeScore)}
            -
            ${escapeHTML(awayScore)}

          </div>

          <div class="match-team">

            ${
              away.logo
              ?
              `<img src="${escapeHTML(away.logo)}"
                    alt=""
                    onerror="this.style.display='none'">`
              :
              ""
            }

            <div class="match-team-name">
              ${escapeHTML(
                away.name ||
                "Away"
              )}
            </div>

          </div>

        </div>

        <div class="match-time">
          🕐 ${escapeHTML(
            time || "کات دیاری نەکراوە"
          )}
        </div>

      `;

      container.appendChild(card);

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ کێشە لە خوێندنەوەی یارییەکان";

    container.innerHTML = `
      <div class="empty">
        تکایە دڵنیابە لە بوونی
        <b>matches.json</b>
      </div>
    `;
  }
}


/* =========================
   LOAD EVERYTHING
========================= */

async function loadAll(){

  await Promise.all([
    loadMatches(),
    loadTransfers()
  ]);

}


/* START */

loadAll();

</script>

</body>
</html>
