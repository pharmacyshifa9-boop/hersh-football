<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06110d;
  --card:#0d2118;
  --card2:#123020;
  --green:#25e889;
  --green2:#12bd70;
  --text:#f5fff9;
  --muted:#91aaa0;
  --line:#1d3b2d;
  --red:#ff5b5b;
}

body{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:
    radial-gradient(circle at top,#103b25 0,#06110d 40%);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#0b2418,#06110d);
  padding:24px 15px;
  border-bottom:1px solid var(--line);
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:var(--green);
  font-size:30px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:18px;
}

.nav button{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:11px 4px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.nav button.active{
  background:var(--green);
  color:#031109;
}

.section{
  margin-bottom:30px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.section-title h1{
  font-size:20px;
}

.refresh{
  border:0;
  background:var(--green);
  color:#031109;
  padding:9px 13px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.status{
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  border-radius:14px;
  margin-bottom:13px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* MATCH / RESULT */

.match{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.match-league{
  text-align:center;
  color:var(--green);
  font-size:13px;
  font-weight:bold;
  margin-bottom:12px;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:7px;
}

.match-team{
  background:var(--card2);
  border-radius:14px;
  min-height:100px;
  padding:10px 5px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.match-team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.team-name{
  font-size:12px;
  font-weight:bold;
}

.score{
  color:var(--green);
  font-size:21px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
}

.live{
  display:block;
  color:var(--red);
  font-size:11px;
  margin-bottom:4px;
}

.match-time{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

/* TRANSFERS */

.transfer{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.player{
  color:var(--green);
  font-size:19px;
  font-weight:900;
  margin-bottom:13px;
}

.transfer-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:7px;
}

.transfer-team{
  background:var(--card2);
  border-radius:14px;
  min-height:90px;
  padding:10px 5px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.transfer-team img{
  width:40px;
  height:40px;
  object-fit:contain;
  margin-bottom:6px;
}

.arrow{
  color:var(--green);
  font-size:25px;
  font-weight:bold;
}

.transfer-info{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.date{
  color:var(--muted);
  font-size:12px;
}

.type{
  color:var(--green);
  background:rgba(37,232,137,.12);
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

/* STANDINGS */

.league-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
}

.league-header{
  background:var(--card2);
  padding:14px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.league-logo{
  width:34px;
  height:34px;
  object-fit:contain;
}

.table-scroll{
  overflow-x:auto;
}

.standings-table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
}

.standings-table th{
  color:var(--muted);
  font-size:11px;
  padding:11px 5px;
  border-bottom:1px solid var(--line);
}

.standings-table td{
  padding:10px 5px;
  text-align:center;
  font-size:12px;
  border-bottom:1px solid var(--line);
}

.standings-table tr:last-child td{
  border-bottom:0;
}

.rank{
  color:var(--green);
  font-weight:900;
}

.club{
  text-align:right !important;
  font-weight:bold;
  white-space:nowrap;
}

.club img{
  width:28px;
  height:28px;
  object-fit:contain;
  vertical-align:middle;
  margin-left:6px;
}

.points{
  color:var(--green);
  font-weight:900;
  font-size:14px !important;
}

.empty{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  line-height:2;
}

.error{
  color:var(--red);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:11px;
  }

  .logo{
    font-size:27px;
  }

  .nav button{
    font-size:10px;
  }

  .section-title h1{
    font-size:18px;
  }

  .team-name{
    font-size:10px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    Hersh Football ⚽
  </div>

  <div class="subtitle">
    نوێترین هەواڵ، ئەنجام و گواستنەوەکانی تۆپی پێ
  </div>

</header>

<main class="container">

<!-- NAV -->

<div class="nav">

  <button
    class="active"
    onclick="showSection('matches',this)">
    ⚽ یارییەکان
  </button>

  <button
    onclick="showSection('results',this)">
    🏁 ئەنجامەکان
  </button>

  <button
    onclick="showSection('transfers',this)">
    🔄 گواستنەوە
  </button>

  <button
    onclick="showSection('standings',this)">
    🏆 خشتە
  </button>

</div>

<!-- MATCHES -->

<section
  id="matchesSection"
  class="section">

  <div class="section-title">

    <h1>
      ⚽ یارییەکانی ئەمڕۆ
    </h1>

    <button
      class="refresh"
      onclick="loadMatches()">
      🔄
    </button>

  </div>

  <div
    id="matchStatus"
    class="status">
    ⏳ چاوەڕێی داتا...
  </div>

  <div id="matches"></div>

</section>

<!-- RESULTS -->

<section
  id="resultsSection"
  class="section"
  style="display:none">

  <div class="section-title">

    <h1>
      🏁 ئەنجامەکان
    </h1>

    <button
      class="refresh"
      onclick="loadResults()">
      🔄
    </button>

  </div>

  <div
    id="resultStatus"
    class="status">
    ⏳ ئەنجامەکان دەخوێندرێنەوە...
  </div>

  <div id="results"></div>

</section>

<!-- TRANSFERS -->

<section
  id="transfersSection"
  class="section"
  style="display:none">

  <div class="section-title">

    <h1>
      🔄 گواستنەوەکانی یاریزانان
    </h1>

    <button
      class="refresh"
      onclick="loadTransfers()">
      🔄
    </button>

  </div>

  <div
    id="transferStatus"
    class="status">
    ⏳ چاوەڕێی داتا...
  </div>

  <div id="transfers"></div>

</section>

<!-- STANDINGS -->

<section
  id="standingsSection"
  class="section"
  style="display:none">

  <div class="section-title">

    <h1>
      🏆 خشتەکانی لیگ
    </h1>

    <button
      class="refresh"
      onclick="loadStandings()">
      🔄
    </button>

  </div>

  <div
    id="standingsStatus"
    class="status">
    ⏳ خشتەکان دەخوێندرێنەوە...
  </div>

  <div id="standings"></div>

</section>

</main>

<footer>
  Hersh Football ⚽
  <br>
  Kurdish Football App
</footer>

<script>

/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   NAVIGATION
========================= */

function showSection(
  section,
  button
){

  document
    .querySelectorAll(".nav button")
    .forEach(
      btn =>
        btn.classList.remove("active")
    );

  button.classList.add("active");

  const sections = {

    matches:
      "matchesSection",

    results:
      "resultsSection",

    transfers:
      "transfersSection",

    standings:
      "standingsSection"

  };

  Object.values(sections)
    .forEach(id => {

      document
        .getElementById(id)
        .style.display = "none";

    });

  document
    .getElementById(
      sections[section]
    )
    .style.display = "block";

}


/* =========================
   MATCHES
========================= */

async function loadMatches(){

  const status =
    document.getElementById("matchStatus");

  const container =
    document.getElementById("matches");

  status.textContent =
    "⏳ داتا دەخوێندرێتەوە...";

  container.innerHTML = "";

  try{

    const response =
      await fetch(
        "matches.json?t=" +
        Date.now()
      );

    if(!response.ok)
      throw new Error();

    const json =
      await response.json();

    const matches =
      Array.isArray(json.matches)
      ? json.matches
      : [];

    if(!matches.length){

      status.textContent =
        "هیچ یارییەک نییە";

      container.innerHTML = `
        <div class="empty">
          ⚽ ئەمڕۆ یارییەک نییە.
        </div>
      `;

      return;
    }

    status.textContent =
      "✅ " +
      matches.length +
      " یاری";

    matches.forEach(item => {

      const fixture =
        item.fixture || {};

      const league =
        item.league || {};

      const home =
        item.home || {};

      const away =
        item.away || {};

      const goals =
        item.goals || {};

      const card =
        document.createElement("div");

      card.className = "match";

      card.innerHTML = `

        <div class="match-league">
          🏆 ${escapeHTML(
            league.name || "Football"
          )}
        </div>

        <div class="match-teams">

          <div class="match-team">

            ${
              home.logo
              ? `
                <img
                  src="${escapeHTML(home.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                home.name || "Home"
              )}
            </div>

          </div>

          <div class="score">

            ${escapeHTML(
              goals.home ?? "-"
            )}

            -

            ${escapeHTML(
              goals.away ?? "-"
            )}

          </div>

          <div class="match-team">

            ${
              away.logo
              ? `
                <img
                  src="${escapeHTML(away.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                away.name || "Away"
              )}
            </div>

          </div>

        </div>

      `;

      container.appendChild(card);

    });

  }catch(error){

    status.innerHTML =
      `<span class="error">
        ❌ کێشە لە matches.json
      </span>`;

  }

}


/* =========================
   RESULTS
========================= */

async function loadResults(){

  const status =
    document.getElementById(
      "resultStatus"
    );

  const container =
    document.getElementById(
      "results"
    );

  status.textContent =
    "⏳ ئەنجامەکان دەخوێندرێنەوە...";

  container.innerHTML = "";

  try{

    const response =
      await fetch(
        "matches.json?t=" +
        Date.now()
      );

    if(!response.ok)
      throw new Error();

    const json =
      await response.json();

    const matches =
      Array.isArray(json.matches)
      ? json.matches
      : [];

    const results =
      matches.filter(item => {

        const short =
          item.fixture?.status?.short;

        return (
          short === "FT" ||
          short === "AET" ||
          short === "PEN"
        );

      });

    if(!results.length){

      status.textContent =
        "هیچ ئەنجامێک نییە";

      container.innerHTML = `
        <div class="empty">
          🏁 هێشتا ئەنجامێک بەردەست نییە.
        </div>
      `;

      return;
    }

    status.textContent =
      "✅ " +
      results.length +
      " ئەنجام";

    results.forEach(item => {

      const league =
        item.league || {};

      const home =
        item.home || {};

      const away =
        item.away || {};

      const goals =
        item.goals || {};

      const card =
        document.createElement("div");

      card.className = "match";

      card.innerHTML = `

        <div class="match-league">

          🏆

          ${escapeHTML(
            league.name || "Football"
          )}

        </div>

        <div class="match-teams">

          <div class="match-team">

            ${
              home.logo
              ? `
                <img
                  src="${escapeHTML(home.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                home.name || "Home"
              )}
            </div>

          </div>

          <div class="score">

            ${escapeHTML(
              goals.home ?? "-"
            )}

            -

            ${escapeHTML(
              goals.away ?? "-"
            )}

          </div>

          <div class="match-team">

            ${
              away.logo
              ? `
                <img
                  src="${escapeHTML(away.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                away.name || "Away"
              )}
            </div>

          </div>

        </div>

      `;

      container.appendChild(card);

    });

  }catch(error){

    status.innerHTML =
      `<span class="error">
        ❌ کێشە لە matches.json
      </span>`;

  }

}


/* =========================
   TRANSFERS
========================= */

async function loadTransfers(){

  const status =
    document.getElementById(
      "transferStatus"
    );

  const container =
    document.getElementById(
      "transfers"
    );

  status.textContent =
    "⏳ گواستنەوەکان دەخوێندرێنەوە...";

  container.innerHTML = "";

  try{

    const response =
      await fetch(
        "transfers.json?t=" +
        Date.now()
      );

    if(!response.ok)
      throw new Error();

    const json =
      await response.json();

    const transfers =
      Array.isArray(json)
      ? json
      : Array.isArray(json.transfers)
        ? json.transfers
        : [];

    if(!transfers.length){

      status.textContent =
        "هیچ گواستنەوەیەک نییە";

      return;
    }

    status.textContent =
      "✅ " +
      transfers.length +
      " گواستنەوە";

    transfers.forEach(item => {

      const player =
        item.player || {};

      const teams =
        item.teams || {};

      const teamIn =
        teams.in || {};

      const teamOut =
        teams.out || {};

      const card =
        document.createElement("div");

      card.className = "transfer";

      card.innerHTML = `

        <div class="player">

          ⚽

          ${escapeHTML(
            player.name ||
            "یاریزان"
          )}

        </div>

        <div class="transfer-teams">

          <div class="transfer-team">

            ${
              teamOut.logo
              ? `
                <img
                  src="${escapeHTML(teamOut.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                teamOut.name ||
                "تیمی نەزانراوە"
              )}
            </div>

          </div>

          <div class="arrow">
            →
          </div>

          <div class="transfer-team">

            ${
              teamIn.logo
              ? `
                <img
                  src="${escapeHTML(teamIn.logo)}"
                  alt=""
                  onerror="this.style.display='none'"
                >
              `
              : ""
            }

            <div class="team-name">
              ${escapeHTML(
                teamIn.name ||
                "تیمی نەزانراوە"
              )}
            </div>

          </div>

        </div>

        <div class="transfer-info">

          <div class="date">
            📅 ${escapeHTML(
              item.date || ""
            )}
          </div>

          <div class="type">
            ${escapeHTML(
              item.type ||
              "Transfer"
            )}
          </div>

        </div>

      `;

      container.appendChild(card);

    });

  }catch(error){

    status.innerHTML =
      `<span class="error">
        ❌ کێشە لە transfers.json
      </span>`;

  }

}


/* =========================
   STANDINGS
========================= */

async function loadStandings(){

  const status =
    document.getElementById(
      "standingsStatus"
    );

  const container =
    document.getElementById(
      "standings"
    );

  status.textContent =
    "⏳ خشتەکان دەخوێندرێنەوە...";

  container.innerHTML = "";

  try{

    const response =
      await fetch(
        "standings.json?t=" +
        Date.now()
      );

    if(!response.ok)
      throw new Error();

    const json =
      await response.json();

    const leagues =
      json.leagues || {};

    const names =
      Object.keys(leagues);

    if(!names.length){

      status.textContent =
        "هیچ خشتەیەک نییە";

      return;
    }

    status.textContent =
      "✅ " +
      names.length +
      " لیگ";

    names.forEach(name => {

      const league =
        leagues[name] || {};

      const rows =
        Array.isArray(
          league.standings
        )
        ? league.standings
        : [];

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "league-card";

      let html = `

        <div class="league-header">

          ${
            league.logo
            ? `
              <img
                class="league-logo"
                src="${escapeHTML(
                  league.logo
                )}"
                alt=""
                onerror="this.style.display='none'"
              >
            `
            : "🏆"
          }

          ${escapeHTML(name)}

        </div>

        <div class="table-scroll">

          <table class="standings-table">

            <thead>

              <tr>

                <th>#</th>
                <th>تیم</th>
                <th>یاری</th>
                <th>برد</th>
                <th>مساوی</th>
                <th>دۆڕان</th>
                <th>خاڵ</th>

              </tr>

            </thead>

            <tbody>
      `;

      rows.forEach(row => {

        const team =
          row.team || {};

        const all =
          row.all || {};

        html += `

          <tr>

            <td class="rank">
              ${escapeHTML(
                row.rank ?? "-"
              )}
            </td>

            <td class="club">

              ${
                team.logo
                ? `
                  <img
                    src="${escapeHTML(
                      team.logo
                    )}"
                    alt=""
                    onerror="this.style.display='none'"
                  >
                `
                : ""
              }

              ${escapeHTML(
                team.name ||
                "تیم"
              )}

            </td>

            <td>
              ${escapeHTML(
                all.played ?? "-"
              )}
            </td>

            <td>
              ${escapeHTML(
                all.win ?? "-"
              )}
            </td>

            <td>
              ${escapeHTML(
                all.draw ?? "-"
              )}
            </td>

            <td>
              ${escapeHTML(
                all.lose ?? "-"
              )}
            </td>

            <td class="points">
              ${escapeHTML(
                row.points ?? "-"
              )}
            </td>

          </tr>

        `;

      });

      html += `

            </tbody>

          </table>

        </div>
      `;

      card.innerHTML = html;

      container.appendChild(card);

    });

  }catch(error){

    status.innerHTML =
      `<span class="error">
        ❌ کێشە لە standings.json
      </span>`;

  }

}


/* =========================
   START
