<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>Hersh Football ⚽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06110d;
  --card:#0d2118;
  --card2:#123020;
  --green:#25e889;
  --green2:#12bd70;
  --text:#f5fff9;
  --muted:#91aaa0;
  --line:#1d3b2d;
}

body{
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#0b2418,#06110d);
  padding:25px 18px;
  border-bottom:1px solid var(--line);
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:900;
  color:var(--green);
}

.subtitle{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.title h1{
  font-size:22px;
}

.refresh{
  border:0;
  background:var(--green);
  color:#031109;
  font-weight:bold;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
}

.status{
  background:var(--card);
  border:1px solid var(--line);
  padding:13px;
  border-radius:14px;
  margin-bottom:15px;
  color:var(--muted);
  text-align:center;
}

.transfer{
  background:linear-gradient(145deg,var(--card),#091a12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.player{
  font-size:20px;
  font-weight:900;
  color:var(--green);
  margin-bottom:13px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team{
  background:var(--card2);
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
  min-height:90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.team-name{
  font-size:13px;
  font-weight:bold;
}

.arrow{
  font-size:25px;
  color:var(--green);
  font-weight:bold;
}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  gap:10px;
}

.date{
  color:var(--muted);
  font-size:13px;
}

.type{
  padding:6px 10px;
  border-radius:20px;
  background:rgba(37,232,137,.12);
  color:var(--green);
  font-size:12px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px 15px;
  font-size:12px;
}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  .title h1{
    font-size:19px;
  }

  .teams{
    gap:5px;
  }

  .team-name{
    font-size:11px;
  }

  .player{
    font-size:18px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    Hersh Football ⚽
  </div>

  <div class="subtitle">
    نوێترین هەواڵ و گواستنەوەکانی یاریزانان
  </div>

</header>

<main class="container">

  <div class="title">

    <h1>
      🔄 گواستنەوەی یاریزانان
    </h1>

    <button class="refresh" onclick="loadTransfers()">
      نوێکردنەوە
    </button>

  </div>

  <div class="status" id="status">
    ⏳ چاوەڕێی داتا دەکەین...
  </div>

  <div id="transfers"></div>

</main>

<footer>
  Hersh Football ⚽ — Kurdish Football App
</footer>


<script>

async function loadTransfers(){

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("transfers");

  status.textContent =
    "⏳ داتا نوێ دەکرێتەوە...";

  container.innerHTML = "";

  try{

    const response =
      await fetch("transfers.json?t=" + Date.now());

    if(!response.ok){

      throw new Error(
        "transfers.json نەدۆزرایەوە"
      );

    }

    const json =
      await response.json();


    /*
      update.yml ـی نوێمان ئەم شێوەیەی دروست دەکات:

      {
        results: 3,
        transfers: [...]
      }

      ئەم بەشە داتا دەکاتە Array.
    */

    let data;

    if(Array.isArray(json)){

      data = json;

    }else if(
      json &&
      Array.isArray(json.transfers)
    ){

      data = json.transfers;

    }else{

      data = [];

    }


    if(data.length === 0){

      container.innerHTML = `
        <div class="empty">
          هیچ گواستنەوەیەکی نوێ بەردەست نییە.
        </div>
      `;

      status.textContent =
        "هیچ گواستنەوەیەک نییە";

      return;

    }


    status.textContent =
      "✅ " +
      data.length +
      " گواستنەوە دۆزرایەوە";


    data.forEach(item => {

      if(!item){
        return;
      }


      const player =
        item.player || {};


      const inTeam =
        item.in || {};


      const outTeam =
        item.out || {};


      const playerName =
        player.name ||
        "یاریزان";


      const date =
        item.date ||
        "بێ‌ڕێکەوت";


      const type =
        item.type ||
        "Transfer";


      const card =
        document.createElement("div");


      card.className =
        "transfer";


      card.innerHTML = `

        <div class="player">

          ⚽
          ${escapeHTML(playerName)}

        </div>


        <div class="teams">


          <div class="team">

            ${
              outTeam.logo
              ?
              `
              <img
                src="${escapeHTML(outTeam.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >
              `
              :
              ""
            }

            <div class="team-name">

              ${
                escapeHTML(
                  outTeam.name ||
                  "تیمی نەزانراوە"
                )
              }

            </div>

          </div>


          <div class="arrow">
            →
          </div>


          <div class="team">

            ${
              inTeam.logo
              ?
              `
              <img
                src="${escapeHTML(inTeam.logo)}"
                alt=""
                onerror="this.style.display='none'"
              >
              `
              :
              ""
            }

            <div class="team-name">

              ${
                escapeHTML(
                  inTeam.name ||
                  "تیمی نەزانراوە"
                )
              }

            </div>

          </div>


        </div>


        <div class="info">

          <div class="date">

            📅
            ${escapeHTML(date)}

          </div>


          <div class="type">

            ${escapeHTML(type)}

          </div>

        </div>

      `;


      container.appendChild(card);

    });


  }catch(error){

    console.error(error);


    status.textContent =
      "❌ کێشەیەک لە خوێندنەوەی داتا هەیە";


    container.innerHTML = `

      <div class="empty">

        تکایە دڵنیابە لەوەی

        <b>transfers.json</b>

        لە هەمان repository ـدایە.

      </div>

    `;

  }

}


function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadTransfers();

</script>

</body>
</html>
