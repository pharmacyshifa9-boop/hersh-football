<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#06110d">

<title>یارییەکان | Hersh Football ⚽</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#06110d;
 --card:#0d2118;
 --card2:#123020;
 --green:#25e889;
 --text:#f5fff9;
 --muted:#91aaa0;
 --line:#1d3b2d;
 --red:#ff5365;
 --yellow:#ffd166;
}

body{
 font-family:Arial,"Noto Sans Arabic",sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

header{
 background:linear-gradient(135deg,#0b2418,#06110d);
 padding:22px 15px;
 border-bottom:1px solid var(--line);
 text-align:center;
}

.logo{
 font-size:27px;
 font-weight:900;
 color:var(--green);
}

.subtitle{
 color:var(--muted);
 font-size:13px;
 margin-top:6px;
}

.container{
 max-width:850px;
 margin:auto;
 padding:15px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px;
}

.topbar h1{font-size:21px}

.home{
 background:var(--green);
 color:#031109;
 text-decoration:none;
 padding:9px 13px;
 border-radius:12px;
 font-weight:bold;
 font-size:13px;
}

.filters{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:8px;
 margin-bottom:12px;
}

.filter{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--muted);
 padding:9px 13px;
 border-radius:20px;
 white-space:nowrap;
 font-weight:bold;
}

.filter.active{
 background:var(--green);
 color:#031109;
}

.status{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:12px;
 text-align:center;
 color:var(--muted);
 margin-bottom:15px;
}

.section-title{
 font-size:15px;
 font-weight:bold;
 color:var(--green);
 margin:18px 0 10px;
}

.match{
 background:linear-gradient(145deg,var(--card),#091a12);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
}

.league{
 color:var(--green);
 font-size:12px;
 font-weight:bold;
 margin-bottom:12px;
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:8px;
}

.team{
 text-align:center;
 background:var(--card2);
 border-radius:14px;
 padding:12px 6px;
 min-height:105px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

.team img{
 width:44px;
 height:44px;
 object-fit:contain;
 margin-bottom:7px;
}

.team-name{
 font-weight:bold;
 font-size:13px;
}

.score{
 font-size:20px;
 font-weight:900;
 color:var(--green);
 white-space:nowrap;
}

.time{
 color:var(--yellow);
 font-size:13px;
 font-weight:bold;
 margin-top:12px;
 text-align:center;
}

.live{
 background:rgba(255,83,101,.15);
 color:var(--red);
 padding:7px 12px;
 border-radius:20px;
 font-size:11px;
 margin-top:10px;
 font-weight:bold;
 text-align:center;
}

.finished{
 color:var(--muted);
 font-size:11px;
 margin-top:10px;
 text-align:center;
}

.empty{
 text-align:center;
 padding:35px 15px;
 color:var(--muted);
}

.error{
 text-align:center;
 padding:25px 15px;
 color:var(--red);
 line-height:1.8;
}

footer{
 text-align:center;
 color:var(--muted);
 padding:25px;
 font-size:12px;
}

@media(max-width:500px){
 .topbar h1{font-size:18px}
 .team-name{font-size:11px}
 .score{font-size:17px}
 .team img{width:38px;height:38px}
}
</style>
</head>

<body>

<header>
 <div class="logo">Hersh Football ⚽</div>
 <div class="subtitle">یارییەکانی ئەمڕۆ</div>
</header>

<main class="container">

 <div class="topbar">
  <h1>⚽ یارییەکان</h1>

  <a href="home.html" class="home">
   🏠 سەرەتا
  </a>
 </div>

 <div class="filters">
  <button class="filter active" data-filter="all">هەموو</button>
  <button class="filter" data-filter="top">⭐ خولە گرنگەکان</button>
  <button class="filter" data-filter="live">🔴 LIVE</button>
  <button class="filter" data-filter="finished">🏁 تەواوبوو</button>
 </div>

 <div class="status" id="status">
  🔄 داتا بار دەکرێت...
 </div>

 <div id="matches"></div>

</main>

<footer>
 Hersh Football ⚽ — Kurdish Football App
</footer>

<script>

const JSON_URL =
"https://pharmacyshifa9-boop.github.io/hersh-football/matches.json";

let allMatches = [];
let currentFilter = "all";


/* خولە گرنگەکان */

const TOP_LEAGUES = [

 "Premier League",
 "La Liga",
 "Primera Division",
 "Serie A",
 "Bundesliga",
 "Ligue 1",
 "UEFA Champions League",
 "Champions League",
 "UEFA Europa League",
 "Europa League",
 "UEFA Conference League",
 "FA Cup",
 "Copa del Rey",
 "DFB Pokal",
 "Coupe de France"

];


function escapeHTML(value){

 return String(value ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function isTopLeague(name){

 const league =
 String(name || "").toLowerCase();

 return TOP_LEAGUES.some(item =>
   league.includes(item.toLowerCase())
 );

}


function getStatus(match){

 const short =
   match?.fixture?.status?.short || "";

 if([
   "1H","2H","HT","ET","BT","P","LIVE"
 ].includes(short)){

   return "live";

 }

 if([
   "FT","AET","PEN"
 ].includes(short)){

   return "finished";

 }

 return "upcoming";

}


function renderMatches(){

 const container =
   document.getElementById("matches");

 container.innerHTML = "";

 let filtered = allMatches.filter(match => {

   const state =
     getStatus(match);

   const league =
     match?.league?.name || "";

   if(currentFilter === "top")
     return isTopLeague(league);

   if(currentFilter === "live")
     return state === "live";

   if(currentFilter === "finished")
     return state === "finished";

   return true;

 });


 if(filtered.length === 0){

   container.innerHTML = `
    <div class="empty">
     📭 هیچ یارییەک لەم بەشەدا نییە.
    </div>
   `;

   return;

 }


 /* یارییە گرنگەکان لە سەرەوە */

 filtered.sort((a,b) => {

   const aTop =
     isTopLeague(a?.league?.name);

   const bTop =
     isTopLeague(b?.league?.name);

   if(aTop !== bTop)
     return bTop - aTop;

   const aLive =
     getStatus(a) === "live";

   const bLive =
     getStatus(b) === "live";

   if(aLive !== bLive)
     return bLive - aLive;

   return 0;

 });


 filtered.forEach(match => {

   const fixture =
     match.fixture || {};

   const league =
     match.league || {};

   const home =
     match.home || {};

   const away =
     match.away || {};

   const goals =
     match.goals || {};

   const state =
     getStatus(match);


   let score = "-";

   if(
     goals.home !== null &&
     goals.home !== undefined
   ){

     score =
       (goals.home ?? 0) +
       " - " +
       (goals.away ?? 0);

   }


   let time = "--:--";

if (fixture.date) {
  const d = new Date(fixture.date);

  if (!isNaN(d.getTime())) {
    time = d.toLocaleTimeString("ku-IQ", {
      timeZone: "Asia/Baghdad",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
  }
}


   let stateHTML = `
    <div class="time">
     🕐 ${escapeHTML(time)}
    </div>
   `;


   if(state === "live"){

     stateHTML = `
      <div class="live">
       🔴 LIVE
      </div>
     `;

   }


   if(state === "finished"){

     stateHTML = `
      <div class="finished">
       🏁 تەواوبوو
      </div>
     `;

   }


   const card =
     document.createElement("div");

   card.className = "match";


   card.innerHTML = `

    <div class="league">
     ${isTopLeague(league.name) ? "⭐" : "🏆"}
     ${escapeHTML(
       league.name ||
       "لیگی نەناسراو"
     )}
    </div>

    <div class="teams">

     <div class="team">

      ${
       home.logo
       ?
       `
       <img
        src="${escapeHTML(home.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">
       ${escapeHTML(
        home.name ||
        "تیمی نەناسراوە"
       )}
      </div>

     </div>

     <div class="score">
      ${escapeHTML(score)}
     </div>

     <div class="team">

      ${
       away.logo
       ?
       `
       <img
        src="${escapeHTML(away.logo)}"
        alt=""
        onerror="this.style.display='none'"
       >
       `
       :
       ""
      }

      <div class="team-name">
       ${escapeHTML(
        away.name ||
        "تیمی نەناسراوە"
       )}
      </div>

     </div>

    </div>

    ${stateHTML}

   `;


   container.appendChild(card);

 });

}


async function loadMatches(){

 const status =
   document.getElementById("status");

 try{

   const response =
     await fetch(
       JSON_URL + "?v=" + Date.now(),
       {
         cache:"no-store"
       }
     );

   if(!response.ok)
     throw new Error(
       "HTTP " + response.status
     );

   const data =
     await response.json();

   allMatches =
     Array.isArray(data.matches)
     ? data.matches
     : [];


   status.textContent =
     "✅ " +
     allMatches.length +
     " یاری دۆزرایەوە";


   renderMatches();

 }

 catch(error){

   console.error(error);

   status.textContent =
     "❌ کێشەیەک لە داتا هەیە";

   document.getElementById(
     "matches"
   ).innerHTML = `
    <div class="error">
     نەتوانرا داتای یارییەکان
     بخوێندرێتەوە.
     <br>
     ${escapeHTML(error.message)}
    </div>
   `;

 }

}


/* دوگمەکانی فلتەر */

document
 .querySelectorAll(".filter")
 .forEach(button => {

   button.addEventListener(
     "click",
     () => {

       document
        .querySelectorAll(".filter")
        .forEach(btn =>
          btn.classList.remove("active")
        );

       button.classList.add("active");

       currentFilter =
         button.dataset.filter;

       renderMatches();

     }
   );

 });


loadMatches();

</script>

</body>
</html>
