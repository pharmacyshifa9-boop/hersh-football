name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # GET TODAY
      # =========================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "================================"
          echo "TODAY: $TODAY"
          echo "================================"


      # =========================
      # GET MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))
          print("MATCH API RESPONSE:", len(data.get("response", [])))
          PY


      # =========================
      # CREATE MATCHES
      # =========================

      - name: Create matches.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          matches = []

          for item in response:

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in IMPORTANT_LEAGUES:
                  keep = True

              if home_id in IMPORTANT_TEAMS:
                  keep = True

              if away_id in IMPORTANT_TEAMS:
                  keep = True

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL MATCHES:", len(matches))
          PY


      # =========================
      # GET TODAY RESULTS
      # =========================

      - name: Get today's results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S RESULTS"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o results_raw.json

          if [ ! -s results_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > results_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("RESULT API ERRORS:", data.get("errors", []))
          print("RESULT API RESULTS:", data.get("results", 0))
          print("RESULT API RESPONSE:", len(data.get("response", [])))
          PY


      # =========================
      # CREATE RESULTS
      # =========================

      - name: Create results.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          results = []

          for item in response:

              fixture = item.get("fixture", {}) or {}
              status = fixture.get("status", {}) or {}

              status_short = status.get("short", "")

              if status_short not in {
                  "FT",
                  "AET",
                  "PEN"
              }:
                  continue

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in IMPORTANT_LEAGUES:
                  keep = True

              if home_id in IMPORTANT_TEAMS:
                  keep = True

              if away_id in IMPORTANT_TEAMS:
                  keep = True

              if not keep:
                  continue

              results.append({
                  "fixture": fixture,
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open("results.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL RESULTS:", len(results))
          PY


      # =========================
      # GET TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("TRANSFER API ERRORS:", data.get("errors", []))
          print("TRANSFER API RESULTS:", data.get("results", 0))
          print("TRANSFER API RESPONSE:", len(data.get("response", [])))
          PY


      # =========================
      # CREATE TRANSFERS
      # =========================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              505,
              489,
              496
          }

          transfers = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {}) or {}

                  team_in = teams.get("in", {}) or {}
                  team_out = teams.get("out", {}) or {}

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in strong_teams
                      and
                      out_id not in strong_teams
                  ):
                      continue

                  transfers.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL TRANSFERS:", len(transfers))
          PY


      # =========================
      # STANDINGS
      # =========================

      - name: Create standings.json
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING STANDINGS"
          echo "================================"

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse

          API_KEY = "${{ secrets.API_SPORTS_KEY }}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          output = {
              "updated": None,
              "leagues": {}
          }

          for name, league_id in leagues.items():

              url = (
                  "https://v3.football.api-sports.io/standings?"
                  + urllib.parse.urlencode({
                      "league": league_id,
                      "season": 2024
                  })
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.load(response)

                  errors = data.get("errors", {})

                  if errors:
                      print(name, "ERROR:", errors)
                      continue

                  response_data = data.get("response", [])

                  if not response_data:
                      print(name, "NO DATA")
                      continue

                  league = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if isinstance(standings, list) and standings:
                      standings = standings[0]

                  output["leagues"][name] = {
                      "logo": league.get("logo"),
                      "standings": standings
                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:
                  print(name, "ERROR:", str(e))

          from datetime import datetime, timezone

          output["updated"] = datetime.now(
              timezone.utc
          ).isoformat()

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(output["leagues"])
          )
          PY


      # =========================
      # FINAL CHECK
      # =========================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'
          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          with open("results.json", encoding="utf-8") as f:
              results = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers = json.load(f)

          with open("standings.json", encoding="utf-8") as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )

          print(
              "FINAL RESULTS:",
              len(results.get("matches", []))
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )
          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          echo "Changed files:"
          git status --short

          git diff --cached --quiet && \
            echo "No changes to commit" && \
            exit 0

          git commit -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
