name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  id-token: write

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "================================"
          echo "TODAY: $TODAY"
          echo "================================"


      # ==========================================
      # MATCHES
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))
          print("MATCH API RESPONSE:", len(data.get("response", [])))
          PY


      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          matches = []

          for item in response:

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL MATCHES:", len(matches))

          PY


      # ==========================================
      # RESULTS
      # ==========================================

      - name: Get today's results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TODAY'S RESULTS"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o results_raw.json

          if [ ! -s results_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > results_raw.json
          fi

          python3 - <<'PY'

          import json

          with open(
              "results_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "RESULT API ERRORS:",
              data.get("errors", [])
          )

          print(
              "RESULT API RESULTS:",
              data.get("results", 0)
          )

          print(
              "RESULT API RESPONSE:",
              len(data.get("response", []))
          )

          PY


      # ==========================================
      # CREATE RESULTS
      # ==========================================

      - name: Create results.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open(
              "results_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          response = data.get(
              "response",
              []
          )

          # ======================================
          # IMPORTANT LEAGUES
          # ======================================

          IMPORTANT_LEAGUES = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1",
              290: "Iraq Stars League",
              2: "UEFA Champions League",
              3: "UEFA Europa League"
          }

          results = []

          for item in response:

              league = item.get(
                  "league",
                  {}
              ) or {}

              league_id = league.get("id")

              # تەنها خولە دیاریکراوەکان
              if league_id not in IMPORTANT_LEAGUES:
                  continue

              # ======================================
              # CHECK WOMEN
              # ======================================

              league_name = str(
                  league.get(
                      "name",
                      ""
                  )
              ).lower()

              country_name = str(
                  league.get(
                      "country",
                      ""
                  )
              ).lower()

              women_words = [
                  "women",
                  "woman",
                  "female",
                  "feminine",
                  "feminin",
                  "women's",
                  "womens"
              ]

              is_women = any(
                  word in league_name
                  or word in country_name
                  for word in women_words
              )

              if is_women:
                  continue

              # ======================================
              # FIXTURE STATUS
              # ======================================

              fixture = item.get(
                  "fixture",
                  {}
              ) or {}

              status = fixture.get(
                  "status",
                  {}
              ) or {}

              status_short = str(
                  status.get(
                      "short",
                      ""
                  )
              ).upper()

              status_long = str(
                  status.get(
                      "long",
                      ""
                  )
              ).lower()

              # ======================================
              # FINISHED ONLY
              # ======================================

              finished = (
                  status_short in {
                      "FT",
                      "AET",
                      "PEN"
                  }
                  or
                  "finished" in status_long
              )

              if not finished:
                  continue

              # ======================================
              # TEAMS
              # ======================================

              teams = item.get(
                  "teams",
                  {}
              ) or {}

              home = teams.get(
                  "home",
                  {}
              ) or {}

              away = teams.get(
                  "away",
                  {}
              ) or {}

              # ======================================
              # GOALS
              # ======================================

              goals = item.get(
                  "goals",
                  {}
              ) or {}

              # ======================================
              # SAVE RESULT
              # ======================================

              results.append({

                  "fixture": fixture,

                  "league": league,

                  "home": home,

                  "away": away,

                  "goals": goals

              })

          # ======================================
          # OUTPUT
          # ======================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(results),

              "matches":
                  results

          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL RESULTS:",
              len(results)
          )

          print(
              "================================"
          )

          for item in results:

              league = item.get(
                  "league",
                  {}
              )

              home = item.get(
                  "home",
                  {}
              )

              away = item.get(
                  "away",
                  {}
              )

              goals = item.get(
                  "goals",
                  {}
              )

              print(
                  f"{league.get('name')} | "
                  f"{home.get('name')} "
                  f"{goals.get('home')} - "
                  f"{goals.get('away')} "
                  f"{away.get('name')}"
              )

          print(
              "================================"
          )

          PY


      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

          python3 - <<'PY'

          import json

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "TRANSFER API ERRORS:",
              data.get("errors", [])
          )

          print(
              "TRANSFER API RESULTS:",
              data.get("results", 0)
          )

          print(
              "TRANSFER API RESPONSE:",
              len(data.get("response", []))
          )

          PY


      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          today = datetime.now(
              timezone.utc
          ).date()

          start_date = (
              today -
              timedelta(days=30)
          )

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:

                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()

                  except:

                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  team_in = teams.get(
                      "in",
                      {}
                  ) or {}

                  team_out = teams.get(
                      "out",
                      {}
                  ) or {}

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get(
                          "type"
                      ),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          PY


      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING STANDINGS"
          echo "================================"

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          API_KEY = "${{ secrets.API_SPORTS_KEY }}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "leagues": {}
          }

          for name, league_id in leagues.items():

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": 2024
              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(
                          response
                      )

                  errors = api_data.get(
                      "errors",
                      {}
                  )

                  if errors:

                      print(
                          name,
                          "ERROR:",
                          errors
                      )

                      continue

                  api_response = api_data.get(
                      "response",
                      []
                  )

                  if not api_response:

                      print(
                          name,
                          "NO DATA"
                      )

                      continue

                  league = api_response[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and isinstance(
                          standings[0],
                          list
                      )
                  ):

                      standings = standings[0]

                  output["leagues"][name] = {

                      "logo": league.get(
                          "logo"
                      ),

                      "standings": standings

                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output["leagues"]
              )
          )

          PY


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches = json.load(f)

          with open(
              "results.json",
              encoding="utf-8"
          ) as f:

              results = json.load(f)

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:

              transfers = json.load(f)

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL TRANSFERS:",
              len(
                  transfers
              )
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY


      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          echo "Changed files:"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
