name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # GET TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS --retry 2 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Transfer API errors:", data.get("errors", []))
          print("Transfer API results:", data.get("results", 0))
          print("Transfer response:", len(data.get("response", [])))
          PY


      # =========================
      # CREATE TRANSFERS.JSON
      # =========================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=30)

          strong_teams = {
              529,  # Barcelona
              541,  # Real Madrid
              530,  # Atletico Madrid
              50,   # Manchester City
              33,   # Manchester United
              42,   # Arsenal
              49,   # Chelsea
              40,   # Liverpool
              157,  # Bayern Munich
              85,   # PSG
              505,  # Inter
              489,  # AC Milan
              496   # Juventus
          }

          filtered = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {}) or {}
                  team_out = teams.get("out", {}) or {}

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in strong_teams
                      and
                      out_id not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TRANSFERS:", len(filtered))

          PY


      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS --retry 2 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'

          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("API errors:", data.get("errors", []))
          print("API results:", data.get("results", 0))
          print("API response:", len(data.get("response", [])))

          PY


      # =========================
      # FILTER MATCHES
      # =========================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,   # Premier League
              140,  # La Liga
              135,  # Serie A
              78,   # Bundesliga
              61,   # Ligue 1
              2,    # Champions League
              3,    # Europa League
              290   # Iraq Stars League
          }

          IMPORTANT_TEAMS = {
              529,  # Barcelona
              541,  # Real Madrid
              530,  # Atletico Madrid
              50,   # Manchester City
              33,   # Manchester United
              42,   # Arsenal
              49,   # Chelsea
              40,   # Liverpool
              157,  # Bayern Munich
              85,   # PSG
              496,  # Juventus
              505,  # Inter
              489   # AC Milan
          }

          matches = []

          for item in response:

              league = item.get("league", {})
              teams = item.get("teams", {})

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("IMPORTANT MATCHES:", len(matches))

          PY


      # =========================
      # FINAL CHECK
      # =========================

      - name: Check final data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open("matches.json", encoding="utf-8") as f:
              matches_data = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers_data = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches_data.get("matches", []))
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers_data)
          )

          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json

          git status --short

          git commit \
            -m "Update football data" \
            || true

          git push
