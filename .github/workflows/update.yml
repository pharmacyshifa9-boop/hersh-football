name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "TODAY: $TODAY"

      # ==========================================
      # TODAY MATCHES
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))
          print("MATCH API RESPONSE:", len(data.get("response", [])))
          PY

      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          IMPORTANT_TEAMS = {
              529, 541, 530,
              50, 33, 42,
              49, 40, 157,
              85, 496, 505, 489
          }

          matches = []

          for item in data.get("response", []):

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              name = str(league.get("name", "")).lower()
              country = str(league.get("country", "")).lower()
              ltype = str(league.get("type", "")).lower()

              is_women = (
                  "women" in name
                  or "woman" in name
                  or "feminine" in name
                  or "female" in name
                  or "women" in ltype
              )

              if is_women:
                  continue

              # عێراق تەنها بە country=Iraq
              is_iraq = (
                  country == "iraq"
                  or "iraq stars league" in name
              )

              if (
                  league_id in IMPORTANT_LEAGUES
                  or is_iraq
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              ):

                  matches.append({
                      "fixture": item.get("fixture", {}),
                      "league": league,
                      "home": home,
                      "away": away,
                      "goals": item.get("goals", {}) or {}
                  })

          unique = {}

          for item in matches:
              fid = item.get("fixture", {}).get("id")
              if fid:
                  unique[fid] = item

          matches = list(unique.values())

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL MATCHES:", len(matches))
          PY

      # ==========================================
      # RESULTS
      #
      # Free plan:
      # تەنها بەروارە بەردەستەکان بەکاربهێنە
      # ==========================================

      - name: Get available results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING AVAILABLE RESULTS"
          echo "================================"

          rm -f results_raw.jsonl
          touch results_raw.jsonl

          # Free plan ـەکەت بەروارەکانی 28-30 دەدات
          for DATE in 2026-08-28 2026-08-29 2026-08-30
          do

            echo "Getting results for: $DATE"

            curl -sS \
              --retry 2 \
              --retry-delay 5 \
              --max-time 60 \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DATE" \
              >> results_raw.jsonl

            echo "" >> results_raw.jsonl

          done

      # ==========================================
      # CREATE RESULTS
      # ==========================================

      - name: Create results.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          results = []

          with open(
              "results_raw.jsonl",
              encoding="utf-8"
          ) as f:

              for line in f:

                  line = line.strip()

                  if not line:
                      continue

                  try:
                      data = json.loads(line)
                  except Exception:
                      continue

                  if data.get("errors"):
                      print(
                          "RESULT API ERROR:",
                          data.get("errors")
                      )

                  for item in data.get("response", []):

                      fixture = item.get(
                          "fixture",
                          {}
                      ) or {}

                      status = fixture.get(
                          "status",
                          {}
                      ) or {}

                      league = item.get(
                          "league",
                          {}
                      ) or {}

                      short = str(
                          status.get(
                              "short",
                              ""
                          )
                      ).upper()

                      long_status = str(
                          status.get(
                              "long",
                              ""
                          )
                      ).lower()

                      finished = (
                          short in {
                              "FT",
                              "AET",
                              "PEN"
                          }
                          or
                          "finished" in long_status
                      )

                      if not finished:
                          continue

                      name = str(
                          league.get(
                              "name",
                              ""
                          )
                      ).lower()

                      country = str(
                          league.get(
                              "country",
                              ""
                          )
                      ).lower()

                      ltype = str(
                          league.get(
                              "type",
                              ""
                          )
                      ).lower()

                      # ژنان لابە
                      is_women = (
                          "women" in name
                          or "woman" in name
                          or "feminine" in name
                          or "female" in name
                          or "women" in ltype
                      )

                      if is_women:
                          continue

                      league_id = league.get("id")

                      # عێراق تەنها ئەگەر API ـەکە country=Iraq بڵێت
                      is_iraq = (
                          country == "iraq"
                          or "iraq stars league" in name
                      )

                      if not (
                          league_id in IMPORTANT_LEAGUES
                          or is_iraq
                      ):
                          continue

                      teams = item.get(
                          "teams",
                          {}
                      ) or {}

                      results.append({
                          "fixture": fixture,
                          "league": league,
                          "home": teams.get(
                              "home",
                              {}
                          ) or {},
                          "away": teams.get(
                              "away",
                              {}
                          ) or {},
                          "goals": item.get(
                              "goals",
                              {}
                          ) or {}
                      })

          # دووبارەکان لابە
          unique = {}

          for item in results:

              fid = (
                  item
                  .get("fixture", {})
                  .get("id")
              )

              if fid:
                  unique[fid] = item

          results = list(unique.values())

          results.sort(
              key=lambda x:
              x.get(
                  "fixture",
                  {}
              ).get(
                  "timestamp",
                  0
              ),
              reverse=True
          )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FINAL RESULTS:", len(results))
          print("================================")

          # ==================================
          # IRAQ
          # ==================================

          iraq = []

          for item in results:

              league = item.get(
                  "league",
                  {}
              ) or {}

              name = str(
                  league.get(
                      "name",
                      ""
                  )
              ).lower()

              country = str(
                  league.get(
                      "country",
                      ""
                  )
              ).lower()

              if (
                  country == "iraq"
                  or "iraq stars league" in name
              ):
                  iraq.append(item)

          print(
              "IRAQ RESULTS:",
              len(iraq)
          )

          for item in iraq:

              league = item.get(
                  "league",
                  {}
              )

              home = item.get(
                  "home",
                  {}
              )

              away = item.get(
                  "away",
                  {}
              )

              goals = item.get(
                  "goals",
                  {}
              )

              print(
                  "IRAQ:",
                  league.get("name"),
                  "|",
                  home.get("name"),
                  goals.get("home"),
                  "-",
                  goals.get("away"),
                  away.get("name")
              )
          PY

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -sS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          today = datetime.now(
              timezone.utc
          ).date()

          start = today - timedelta(days=30)

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:
                      d = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except Exception:
                      continue

                  if not (
                      start <= d <= today
                  ):
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": teams.get(
                              "in",
                              {}
                          ) or {},
                          "out": teams.get(
                              "out",
                              {}
                          ) or {}
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )
          PY

      # ==========================================
      # STANDINGS
      #
      # تەنها ئەگەر standings.json نییە
      # یان کۆنتر لە 24 کاتژمێرە
      # ==========================================

      - name: Update standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'
          import os
          import time

          path = "standings.json"

          if os.path.exists(path):
              age = time.time() - os.path.getmtime(path)

              if age < 86400:
                  print(
                      "STANDINGS CACHE IS FRESH - SKIPPING API"
                  )
                  open(
                      "/tmp/SKIP_STANDINGS",
                      "w"
                  ).write("yes")
          PY

          if [ -f /tmp/SKIP_STANDINGS ]; then
            echo "Using existing standings.json"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          # ئەگەر standings ـی پێشوو هەبێت،
          # لە دەستیدان نەپارێزێت
          try:
              with open(
                  "standings.json",
                  encoding="utf-8"
              ) as f:
                  output = json.load(f)
          except Exception:
              output = {
                  "updated": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "leagues": {}
              }

          for name, league_id in leagues.items():

              print(
                  "Getting:",
                  name
              )

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": 2024
              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(
                          response
                      )

                  if api_data.get("errors"):

                      print(
                          name,
                          "API ERROR:",
                          api_data.get(
                              "errors"
                          )
                      )

                      continue

                  response_data = api_data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          name,
                          "NO DATA"
                      )
                      continue

                  league = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and isinstance(
                          standings[0],
                          list
                      )
                  ):
                      standings = standings[0]

                  output["leagues"][name] = {
                      "logo": league.get(
                          "logo"
                      ),
                      "standings": standings
                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          output["updated"] = datetime.now(
              timezone.utc
          ).isoformat()

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output.get(
                      "leagues",
                      {}
                  )
              )
          )
          PY

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'
          import json

          def read(path, default):
              try:
                  with open(
                      path,
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return default

          matches = read(
              "matches.json",
              {"matches": []}
          )

          results = read(
              "results.json",
              {"matches": []}
          )

          transfers = read(
              "transfers.json",
              []
          )

          standings = read(
              "standings.json",
              {"leagues": {}}
          )

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )
          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
