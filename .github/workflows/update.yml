name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          FROM_DATE=$(date -u -d "6 days ago" +"%Y-%m-%d")

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "FROM_DATE=$FROM_DATE" >> "$GITHUB_ENV"

          echo "================================"
          echo "TODAY: $TODAY"
          echo "FROM:  $FROM_DATE"
          echo "================================"


      # ==========================================
      # GET FOOTBALL DATA
      # ==========================================

      - name: Get fixtures - ONE REQUEST
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING FOOTBALL FIXTURES"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?from=$FROM_DATE&to=$TODAY" \
            -o fixtures_raw.json

          if [ ! -s fixtures_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > fixtures_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("fixtures_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("API ERRORS:", data.get("errors", []))
          print("API RESULTS:", data.get("results", 0))
          print("API RESPONSE:", len(data.get("response", [])))
          PY


      # ==========================================
      # IMPORTANT LEAGUES
      # ==========================================

      - name: Create matches and results
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          IMPORTANT_LEAGUES = {
              39,    # Premier League
              140,   # La Liga
              135,   # Serie A
              78,    # Bundesliga
              61,    # Ligue 1
              2,     # Champions League
              3,     # Europa League
              290    # Iraq Stars League
          }

          IMPORTANT_TEAMS = {
              529, 541, 530,
              50, 33, 42,
              49, 40, 157,
              85, 496, 505, 489
          }

          matches = []
          results = []

          with open("fixtures_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          for item in data.get("response", []):

              fixture = item.get("fixture", {}) or {}
              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              league_name = str(
                  league.get("name", "")
              ).lower()

              country = str(
                  league.get("country", "")
              ).lower()

              league_type = str(
                  league.get("type", "")
              ).lower()

              # ==================================
              # WOMEN FILTER
              # ==================================

              is_women = (
                  "women" in league_name
                  or "woman" in league_name
                  or "feminine" in league_name
                  or "feminin" in league_name
                  or "female" in league_name
                  or "women" in league_type
              )

              if is_women:
                  continue

              # ==================================
              # IRAQ DETECTION
              # ==================================

              is_iraq = (
                  league_id == 290
                  or "iraq" in league_name
                  or "iraq" in country
                  or "iraqi" in league_name
                  or "stars league" in league_name
              )

              # ==================================
              # IMPORTANT
              # ==================================

              is_important = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
                  or is_iraq
              )

              if not is_important:
                  continue

              # ==================================
              # MATCHES
              # ==================================

              status = fixture.get(
                  "status",
                  {}
              ) or {}

              short_status = str(
                  status.get("short", "")
              ).upper()

              finished = short_status in {
                  "FT",
                  "AET",
                  "PEN"
              }

              match_data = {
                  "fixture": fixture,
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get(
                      "goals",
                      {}
                  ) or {}
              }

              if not finished:
                  matches.append(match_data)

              # ==================================
              # RESULTS
              # ==================================

              if finished:
                  results.append(match_data)

          # ==================================
          # REMOVE DUPLICATES
          # ==================================

          def unique_items(items):

              unique = {}

              for item in items:

                  fixture_id = (
                      item
                      .get("fixture", {})
                      .get("id")
                  )

                  if fixture_id:
                      unique[fixture_id] = item

              return list(unique.values())

          matches = unique_items(matches)
          results = unique_items(results)

          # ==================================
          # SORT
          # ==================================

          matches.sort(
              key=lambda x:
              x.get("fixture", {}).get(
                  "timestamp",
                  0
              )
          )

          results.sort(
              key=lambda x:
              x.get("fixture", {}).get(
                  "timestamp",
                  0
              ),
              reverse=True
          )

          # ==================================
          # SAVE MATCHES
          # ==================================

          matches_output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "results": len(matches),

              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  matches_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==================================
          # SAVE RESULTS
          # ==================================

          results_output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "results": len(results),

              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==================================
          # IRAQ CHECK
          # ==================================

          iraq = []

          for item in results:

              league = item.get(
                  "league",
                  {}
              ) or {}

              league_id = league.get("id")

              name = str(
                  league.get("name", "")
              ).lower()

              country = str(
                  league.get("country", "")
              ).lower()

              if (
                  league_id == 290
                  or "iraq" in name
                  or "iraq" in country
                  or "iraqi" in name
                  or "stars league" in name
              ):
                  iraq.append(item)

          print("================================")
          print("FINAL MATCHES:", len(matches))
          print("FINAL RESULTS:", len(results))
          print("IRAQ RESULTS:", len(iraq))
          print("================================")

          PY


      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi


      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          today = datetime.now(
              timezone.utc
          ).date()

          start_date = (
              today -
              timedelta(days=30)
          )

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except Exception:
                      continue

                  if not (
                      start_date
                      <= transfer_date
                      <= today
                  ):
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get(
                          "type"
                      ),
                      "teams": {
                          "in": teams.get(
                              "in",
                              {}
                          ) or {},
                          "out": teams.get(
                              "out",
                              {}
                          ) or {}
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          PY


      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          API_KEY = "${{ secrets.API_SPORTS_KEY }}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "leagues": {}
          }

          for name, league_id in leagues.items():

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": 2024
              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(
                          response
                      )

                  if api_data.get("errors"):
                      print(
                          name,
                          "ERROR:",
                          api_data.get("errors")
                      )
                      continue

                  response_data = api_data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          name,
                          "NO DATA"
                      )
                      continue

                  league = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and isinstance(
                          standings[0],
                          list
                      )
                  ):
                      standings = standings[0]

                  output["leagues"][name] = {
                      "logo": league.get("logo"),
                      "standings": standings
                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output["leagues"]
              )
          )

          PY


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:
              matches = json.load(f)

          with open(
              "results.json",
              encoding="utf-8"
          ) as f:
              results = json.load(f)

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:
              transfers = json.load(f)

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY


      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
