name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "================================"
          echo "TODAY: $TODAY"
          echo "================================"


      # ==========================================
      # MATCHES - TODAY
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'

          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))
          print("MATCH API RESPONSE:", len(data.get("response", [])))

          PY


      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          matches = []

          for item in response:

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FINAL MATCHES:", len(matches))

          PY


      # ==========================================
      # RESULTS
      # 7 DAYS
      # ==========================================

      - name: Get results - last 7 days
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING RESULTS - LAST 7 DAYS"
          echo "================================"

          rm -f results_raw.jsonl

          for DAYS_AGO in 0 1 2 3 4 5 6 7
          do

            DATE=$(date -u -d "$DAYS_AGO days ago" +"%Y-%m-%d")

            echo "Getting results for: $DATE"

            curl -sS \
              --retry 2 \
              --retry-delay 3 \
              --max-time 60 \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DATE" \
              >> results_raw.jsonl

            echo "" >> results_raw.jsonl

          done


          if [ ! -s results_raw.jsonl ]; then

            echo '{"response":[],"results":0,"errors":[]}' \
              > results_raw.json

          else

            python3 - <<'PY'

            import json

            all_response = []
            all_errors = []

            with open(
                "results_raw.jsonl",
                encoding="utf-8"
            ) as f:

                for line in f:

                    line = line.strip()

                    if not line:
                        continue

                    try:

                        data = json.loads(line)

                        all_response.extend(
                            data.get("response", [])
                        )

                        errors = data.get("errors", [])

                        if errors:
                            all_errors.append(errors)

                    except Exception:
                        pass

            output = {
                "response": all_response,
                "results": len(all_response),
                "errors": all_errors
            }

            with open(
                "results_raw.json",
                "w",
                encoding="utf-8"
            ) as f:

                json.dump(
                    output,
                    f,
                    ensure_ascii=False
                )

            print(
                "RESULT API RESPONSE:",
                len(all_response)
            )

            print(
                "RESULT API ERRORS:",
                all_errors
            )

            PY

          fi


      # ==========================================
      # CREATE RESULTS
      # ==========================================

      - name: Create results.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open(
              "results_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          response = data.get(
              "response",
              []
          )

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          results = []

          seen = set()

          for item in response:

              fixture = item.get(
                  "fixture",
                  {}
              ) or {}

              fixture_id = fixture.get("id")

              if fixture_id in seen:
                  continue

              seen.add(fixture_id)

              status = fixture.get(
                  "status",
                  {}
              ) or {}

              status_short = str(
                  status.get(
                      "short",
                      ""
                  )
              ).upper()

              status_long = str(
                  status.get(
                      "long",
                      ""
                  )
              ).lower()

              # --------------------------------
              # FINISHED MATCH
              # --------------------------------

              finished = (
                  status_short in {
                      "FT",
                      "AET",
                      "PEN"
                  }
                  or
                  "finished" in status_long
              )

              if not finished:
                  continue


              # --------------------------------
              # LEAGUE
              # --------------------------------

              league = item.get(
                  "league",
                  {}
              ) or {}

              league_id = league.get("id")

              league_name = str(
                  league.get(
                      "name",
                      ""
                  )
              ).lower()


              # --------------------------------
              # TEAMS
              # --------------------------------

              teams = item.get(
                  "teams",
                  {}
              ) or {}

              home = teams.get(
                  "home",
                  {}
              ) or {}

              away = teams.get(
                  "away",
                  {}
              ) or {}

              home_id = home.get("id")
              away_id = away.get("id")


              # --------------------------------
              # WOMEN FILTER
              # --------------------------------

              is_women = any(
                  word in league_name
                  for word in [
                      "women",
                      "woman",
                      "feminine",
                      "feminin",
                      "female"
                  ]
              )

              if is_women:
                  continue


              # --------------------------------
              # IMPORTANT FILTER
              # --------------------------------

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or
                  home_id in IMPORTANT_TEAMS
                  or
                  away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue


              # --------------------------------
              # SAVE
              # --------------------------------

              results.append({

                  "fixture": fixture,

                  "league": league,

                  "home": home,

                  "away": away,

                  "goals": item.get(
                      "goals",
                      {}
                  ) or {}

              })


          # --------------------------------
          # SORT NEWEST FIRST
          # --------------------------------

          results.sort(
              key=lambda x:
              x.get("fixture", {}).get(
                  "date",
                  ""
              ),
              reverse=True
          )


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(results),

              "matches":
                  results

          }


          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "FINAL RESULTS:",
              len(results)
          )

          PY


      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi


      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          today = datetime.now(
              timezone.utc
          ).date()

          start_date = (
              today -
              timedelta(days=30)
          )

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:

                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()

                  except Exception:

                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  team_in = teams.get(
                      "in",
                      {}
                  ) or {}

                  team_out = teams.get(
                      "out",
                      {}
                  ) or {}

                  transfers.append({

                      "player": player,

                      "date": date_text,

                      "type": transfer.get(
                          "type"
                      ),

                      "teams": {

                          "in": team_in,

                          "out": team_out

                      }

                  })


          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          PY


      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          echo "================================"
          echo "GETTING STANDINGS"
          echo "================================"

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          import os

          API_KEY = os.environ.get(
              "API_KEY"
          )

          leagues = {

              "Premier League": 39,

              "La Liga": 140,

              "Serie A": 135,

              "Bundesliga": 78,

              "Ligue 1": 61

          }

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues": {}

          }

          for name, league_id in leagues.items():

              params = urllib.parse.urlencode({

                  "league": league_id,

                  "season": 2024

              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(

                  url,

                  headers={
                      "x-apisports-key": API_KEY
                  }

              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(
                          response
                      )

                  errors = api_data.get(
                      "errors",
                      {}
                  )

                  if errors:

                      print(
                          name,
                          "ERROR:",
                          errors
                      )

                      continue

                  api_response = api_data.get(
                      "response",
                      []
                  )

                  if not api_response:

                      print(
                          name,
                          "NO DATA"
                      )

                      continue

                  league = api_response[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and
                      isinstance(
                          standings[0],
                          list
                      )
                  ):

                      standings = standings[0]

                  output["leagues"][name] = {

                      "logo":
                          league.get(
                              "logo"
                          ),

                      "standings":
                          standings

                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )


          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output["leagues"]
              )
          )

          PY


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches = json.load(f)

          with open(
              "results.json",
              encoding="utf-8"
          ) as f:

              results = json.load(f)

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:

              transfers = json.load(f)

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY


      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          echo "Changed files:"

          git status --short

          if git diff --cached --quiet; then

            echo "No changes to commit"

            exit 0

          fi

          git commit \
            -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
