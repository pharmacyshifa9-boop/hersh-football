name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # VARIABLES
      # =========================

      - name: Set variables
        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "TODAY=$TODAY" >> $GITHUB_ENV

          echo "================================"
          echo "⚽ HERSH FOOTBALL"
          echo "DATE: $TODAY"
          echo "================================"


      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "GETTING TODAY'S MATCHES..."

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'

          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))

          PY


      # =========================
      # CREATE MATCHES
      # =========================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          matches = []

          for item in response:

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("MATCHES:", len(matches))

          PY


      # =========================
      # RESULTS
      # =========================

      - name: Get today's results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "GETTING TODAY'S RESULTS..."

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY
            -o results_raw.json

          if [ ! -s results_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > results_raw.json
          fi

          python3 - <<'PY'

          import json

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("RESULT API ERRORS:", data.get("errors", []))
          print("RESULT API RESULTS:", data.get("results", 0))

          PY


      # =========================
      # CREATE RESULTS.JSON
      # =========================

      - name: Create results.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          results = []

          for item in response:

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              )

              if not keep:
                  continue

              results.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("RESULTS:", len(results))

          PY


      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "GETTING TRANSFERS..."

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi


      # =========================
      # CREATE TRANSFERS
      # =========================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              505,
              489,
              496
          }

          filtered = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if not (
                      start_date <= transfer_date <= today
                  ):
                      continue

                  teams = transfer.get("teams", {}) or {}

                  team_in = teams.get("in", {}) or {}
                  team_out = teams.get("out", {}) or {}

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in strong_teams
                      and
                      out_id not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TRANSFERS:", len(filtered))

          PY


      # =========================
      # STANDINGS
      # =========================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "GETTING STANDINGS..."

          python3 - <<'PY'

          import requests
          import json
          import os
          import time

          API_KEY = os.environ["API_KEY"]

          leagues = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1"
          }

          result = {}

          headers = {
              "x-apisports-key": API_KEY
          }

          for league_id, league_name in leagues.items():

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings"
              )

              params = {
                  "league": league_id,
                  "season": 2024
              }

              try:

                  r = requests.get(
                      url,
                      headers=headers,
                      params=params,
                      timeout=30
                  )

                  data = r.json()

                  print(
                      league_name,
                      "ERROR:",
                      data.get("errors", {})
                  )

                  response = data.get(
                      "response",
                      []
                  )

                  if response:

                      league = response[0].get(
                          "league",
                          {}
                      )

                      standings = (
                          league.get(
                              "standings",
                              []
                          )
                      )

                      rows = []

                      if standings:

                          if isinstance(
                              standings[0],
                              list
                          ):
                              rows = standings[0]
                          else:
                              rows = standings

                      result[league_name] = {
                          "logo": league.get(
                              "logo"
                          ),
                          "standings": rows
                      }

                      print(
                          league_name,
                          "ROWS:",
                          len(rows)
                      )

                  else:

                      print(
                          league_name,
                          "NO DATA"
                      )

              except Exception as e:

                  print(
                      league_name,
                      "ERROR:",
                      str(e)
                  )

              time.sleep(1)

          output = {
              "updated": (
                  __import__(
                      "datetime"
                  ).datetime.now(
                      __import__(
                          "datetime"
                      ).timezone.utc
                  ).isoformat()
              ),
              "leagues": result
          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(result)
          )

          PY


      # =========================
      # FINAL CHECK
      # =========================

      - name: Final check
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          with open("results.json", encoding="utf-8") as f:
              results = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers = json.load(f)

          with open("standings.json", encoding="utf-8") as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )

          print(
              "FINAL RESULTS:",
              len(results.get("matches", []))
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )

          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          git status --short

          git commit \
            -m "Update football data" \
            || echo "No changes to commit"

          git pull --rebase origin main

          git push origin HEAD:main
