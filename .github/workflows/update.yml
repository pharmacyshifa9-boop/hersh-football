name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "TODAY: $TODAY"

      # ==========================================
      # TODAY'S MATCHES
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 3 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("MATCH API ERRORS:", data.get("errors", []))
          print("MATCH API RESULTS:", data.get("results", 0))
          print("MATCH API RESPONSE:", len(data.get("response", [])))
          PY

      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          IMPORTANT_LEAGUES = {
              39,    # Premier League
              140,   # La Liga
              135,   # Serie A
              78,    # Bundesliga
              61,    # Ligue 1
              2,     # Champions League
              3,     # Europa League
              290    # Iraq Stars League
          }

          IMPORTANT_TEAMS = {
              529, 541, 530,
              50, 33, 42,
              49, 40, 157,
              85, 496, 505, 489
          }

          matches = []

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          for item in data.get("response", []):

              league = item.get("league", {}) or {}
              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              league_name = str(league.get("name", "")).lower()
              country = str(league.get("country", "")).lower()

              is_women = (
                  "women" in league_name
                  or "woman" in league_name
                  or "feminine" in league_name
                  or "female" in league_name
              )

              if is_women:
                  continue

              is_important = (
                  league_id in IMPORTANT_LEAGUES
                  or home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
                  or "iraq" in league_name
                  or "iraq" in country
                  or "iraqi" in league_name
              )

              if not is_important:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {}) or {}
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("FINAL MATCHES:", len(matches))
          PY

      # ==========================================
      # RESULTS
      #
      # IMPORTANT:
      # Free API plan only allows available dates.
      # We use TODAY only, not 7 days.
      # ==========================================

      - name: Get today's results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S RESULTS"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 3 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o results_raw.json

          if [ ! -s results_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > results_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("RESULT API ERRORS:", data.get("errors", []))
          print("RESULT API RESULTS:", data.get("results", 0))
          print("RESULT API RESPONSE:", len(data.get("response", [])))
          PY

      # ==========================================
      # CREATE RESULTS
      # ==========================================

      - name: Create results.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          results = []

          with open("results_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("RESULT API ERROR:", data.get("errors"))

          for item in data.get("response", []):

              fixture = item.get("fixture", {}) or {}
              status = fixture.get("status", {}) or {}
              league = item.get("league", {}) or {}

              short_status = str(
                  status.get("short", "")
              ).upper()

              long_status = str(
                  status.get("long", "")
              ).lower()

              finished = (
                  short_status in {"FT", "AET", "PEN"}
                  or "finished" in long_status
              )

              if not finished:
                  continue

              league_id = league.get("id")

              league_name = str(
                  league.get("name", "")
              ).lower()

              country = str(
                  league.get("country", "")
              ).lower()

              # ==================================
              # WOMEN FILTER
              # ==================================

              is_women = (
                  "women" in league_name
                  or "woman" in league_name
                  or "feminine" in league_name
                  or "female" in league_name
                  or "women" in str(
                      league.get("type", "")
                  ).lower()
              )

              if is_women:
                  continue

              # ==================================
              # IRAQ
              # ==================================

              is_iraq = (
                  league_id == 290
                  or "iraq" in league_name
                  or "iraq" in country
                  or "iraqi" in league_name
                  or "stars league" in league_name
              )

              # ==================================
              # IMPORTANT LEAGUES
              # ==================================

              if (
                  league_id not in IMPORTANT_LEAGUES
                  and not is_iraq
              ):
                  continue

              teams = item.get("teams", {}) or {}

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              results.append({
                  "fixture": fixture,
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {}) or {}
              })

          # ==================================
          # REMOVE DUPLICATES
          # ==================================

          unique = {}

          for item in results:

              fixture_id = (
                  item.get("fixture", {}).get("id")
              )

              if fixture_id:
                  unique[fixture_id] = item

          results = list(unique.values())

          # ==================================
          # SORT
          # ==================================

          results.sort(
              key=lambda x:
              x.get("fixture", {}).get(
                  "timestamp",
                  0
              ),
              reverse=True
          )

          # ==================================
          # SAVE
          # ==================================

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FINAL RESULTS:", len(results))
          print("================================")

          iraq = []

          for item in results:

              league = item.get(
                  "league",
                  {}
              ) or {}

              league_id = league.get("id")

              name = str(
                  league.get("name", "")
              ).lower()

              country = str(
                  league.get("country", "")
              ).lower()

              if (
                  league_id == 290
                  or "iraq" in name
                  or "iraq" in country
                  or "iraqi" in name
              ):
                  iraq.append(item)

          print("IRAQ RESULTS:", len(iraq))

          for item in iraq:

              league = item.get("league", {})
              home = item.get("home", {})
              away = item.get("away", {})
              goals = item.get("goals", {})

              print(
                  "IRAQ:",
                  league.get("name"),
                  "|",
                  home.get("name"),
                  goals.get("home"),
                  "-",
                  goals.get("away"),
                  away.get("name")
              )
          PY

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 3 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

      - name: Create transfers.json
        run: |

          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          today = datetime.now(
              timezone.utc
          ).date()

          start_date = (
              today -
              timedelta(days=30)
          )

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except Exception:
                      continue

                  if not (
                      start_date
                      <= transfer_date
                      <= today
                  ):
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": teams.get("in", {}) or {},
                          "out": teams.get("out", {}) or {}
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )
          PY

      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          API_KEY = "${{ secrets.API_SPORTS_KEY }}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "leagues": {}
          }

          for name, league_id in leagues.items():

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": 2024
              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(response)

                  if api_data.get("errors"):
                      print(
                          name,
                          "ERROR:",
                          api_data.get("errors")
                      )
                      continue

                  response_data = api_data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          name,
                          "NO DATA"
                      )
                      continue

                  league = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and isinstance(
                          standings[0],
                          list
                      )
                  ):
                      standings = standings[0]

                  output["leagues"][name] = {
                      "logo": league.get("logo"),
                      "standings": standings
                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output["leagues"]
              )
          )
          PY

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'
          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          with open("results.json", encoding="utf-8") as f:
              results = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers = json.load(f)

          with open("standings.json", encoding="utf-8") as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )

          print(
              "FINAL RESULTS:",
              len(results.get("matches", []))
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )
          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
