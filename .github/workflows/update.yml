name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > transfers_raw.json
          fi

          python3 - <<'PY'
          import json

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Transfer API errors:", data.get("errors", []))
          print("Transfer API results:", data.get("results", 0))
          print("Transfer response:", len(data.get("response", [])))
          PY


      # =========================
      # CREATE TRANSFERS.JSON
      # =========================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              505,
              489,
              496
          }

          filtered = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {}) or {}
                  team_out = teams.get("out", {}) or {}

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in strong_teams
                      and
                      out_id not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TRANSFERS:", len(filtered))

          PY


      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":[]}' > matches_raw.json
          fi

          python3 - <<'PY'

          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("API errors:", data.get("errors", []))
          print("API results:", data.get("results", 0))
          print("API response:", len(data.get("response", [])))

          PY


      # =========================
      # CREATE MATCHES.JSON
      # =========================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          matches = []

          for item in response:

              league = item.get("league", {})
              teams = item.get("teams", {})

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in IMPORTANT_LEAGUES:
                  keep = True

              if home_id in IMPORTANT_TEAMS:
                  keep = True

              if away_id in IMPORTANT_TEAMS:
                  keep = True

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("IMPORTANT MATCHES:", len(matches))

          PY


      # =========================
      # CREATE RESULTS.JSON
      # =========================

      - name: Create results.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3,
              290
          }

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          results = []

          for item in response:

              fixture = item.get("fixture", {})
              league = item.get("league", {})
              teams = item.get("teams", {})

              home = teams.get("home", {}) or {}
              away = teams.get("away", {}) or {}

              status = fixture.get("status", {}) or {}

              status_short = status.get("short")

              if status_short not in {
                  "FT",
                  "AET",
                  "PEN"
              }:
                  continue

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in IMPORTANT_LEAGUES:
                  keep = True

              if home_id in IMPORTANT_TEAMS:
                  keep = True

              if away_id in IMPORTANT_TEAMS:
                  keep = True

              if not keep:
                  continue

              results.append({
                  "fixture": fixture,
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("RESULTS:", len(results))

          PY


      # =========================
      # STANDINGS
      # =========================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING STANDINGS"
          echo "================================"

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.parse

          API_KEY = "${{ secrets.API_SPORTS_KEY }}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Iraq Stars League": 290
          }

          season = 2026

          output = {
              "updated": "",
              "leagues": {}
          }

          for name, league_id in leagues.items():

              url = (
                  "https://v3.football.api-sports.io/standings?"
                  + urllib.parse.urlencode({
                      "league": league_id,
                      "season": season
                  })
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.load(response)

                  errors = data.get("errors", {})

                  if errors:

                      print(
                          name,
                          "ERROR:",
                          errors
                      )

                      continue

                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          name,
                          "NO DATA"
                      )
                      continue

                  league_data = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league_data.get(
                      "standings",
                      []
                  )

                  if standings:

                      output["leagues"][name] = {
                          "logo": league_data.get(
                              "logo",
                              ""
                          ),
                          "standings": standings[0]
                      }

                      print(
                          name,
                          "OK:",
                          len(standings[0])
                      )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          from datetime import datetime, timezone

          output["updated"] = datetime.now(
              timezone.utc
          ).isoformat()

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(output["leagues"])
          )

          PY


      # =========================
      # FINAL CHECK
      # =========================

      - name: Check final data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:
              matches = json.load(f)

          with open(
              "results.json",
              encoding="utf-8"
          ) as f:
              results = json.load(f)

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:
              transfers = json.load(f)

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )

          print(
              "FINAL RESULTS:",
              len(results.get("matches", []))
          )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )

          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          echo "Changed files:"
          git status --short

          git commit \
            -m "Update football data" \
            || true

          git push
