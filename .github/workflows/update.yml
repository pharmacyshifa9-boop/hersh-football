name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # DATE
      # ==========================================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "TODAY: $TODAY"

      # ==========================================
      # ONLY 7 LEAGUES
      # ==========================================

      - name: Set leagues
        run: |
          echo "IMPORTANT_LEAGUES=39,140,135,78,61,2,3" >> "$GITHUB_ENV"

      # ==========================================
      # MATCHES - TODAY
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TODAY'S MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo '{"response":[],"results":0,"errors":{"local":"empty"}}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "MATCH API ERRORS:",
              data.get("errors", {})
          )

          print(
              "MATCH API RESULTS:",
              data.get("results", 0)
          )

          print(
              "MATCH API RESPONSE:",
              len(data.get("response", []))
          )
          PY

      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          errors = data.get(
              "errors",
              {}
          )

          # API هەڵەیەتی؟
          # داتای کۆن مەسڕەوە
          if errors:

              print(
                  "MATCH API ERROR:",
                  errors
              )

              print(
                  "KEEPING OLD matches.json"
              )

              if os.path.exists(
                  "matches.json"
              ):
                  raise SystemExit(0)

          # ==========================================
          # ONLY 7 LEAGUES
          # ==========================================

          IMPORTANT_LEAGUES = {
              39,   # Premier League
              140,  # La Liga
              135,  # Serie A
              78,   # Bundesliga
              61,   # Ligue 1
              2,    # Champions League
              3     # Europa League
          }

          matches = []

          for item in data.get(
              "response",
              []
          ):

              league = item.get(
                  "league",
                  {}
              ) or {}

              league_id = league.get(
                  "id"
              )

              if league_id not in IMPORTANT_LEAGUES:
                  continue

              league_name = str(
                  league.get(
                      "name",
                      ""
                  )
              ).lower()

              league_type = str(
                  league.get(
                      "type",
                      ""
                  )
              ).lower()

              # ژنان لابە
              if (
                  "women" in league_name
                  or "woman" in league_name
                  or "feminine" in league_name
                  or "female" in league_name
                  or "women" in league_type
              ):
                  continue

              teams = item.get(
                  "teams",
                  {}
              ) or {}

              matches.append({
                  "fixture": item.get(
                      "fixture",
                      {}
                  ),
                  "league": league,
                  "home": teams.get(
                      "home",
                      {}
                  ) or {},
                  "away": teams.get(
                      "away",
                      {}
                  ) or {},
                  "goals": item.get(
                      "goals",
                      {}
                  ) or {}
              })

          # دووبارەکان
          unique = {}

          for item in matches:

              fixture_id = (
                  item
                  .get("fixture", {})
                  .get("id")
              )

              if fixture_id:
                  unique[fixture_id] = item

          matches = list(
              unique.values()
          )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "results": len(matches),

              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL MATCHES:",
              len(matches)
          )
          PY

      # ==========================================
      # RESULTS - LAST 7 DAYS
      # ==========================================

      - name: Get results - last 7 days
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING RESULTS - LAST 7 DAYS"
          echo "================================"

          rm -f results_raw.jsonl
          touch results_raw.jsonl

          for i in 0 1 2 3 4 5 6
          do

            DATE=$(date -u -d "$i days ago" +"%Y-%m-%d")

            echo "Getting results for: $DATE"

            curl -sS \
              --retry 2 \
              --retry-delay 3 \
              --max-time 60 \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DATE" \
              >> results_raw.jsonl

            echo "" >> results_raw.jsonl

          done

      # ==========================================
      # RESULTS - LAST 7 DAYS
      # ONLY:
      # Premier League
      # La Liga
      # Serie A
      # Bundesliga
      # Ligue 1
      # Champions League
      # Europa League
      # ==========================================

      - name: Get results - last 7 days
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING RESULTS"
          echo "================================"

          rm -f results_raw.jsonl
          touch results_raw.jsonl

          for i in 0 1 2 3 4 5 6
          do

            DATE=$(date -u -d "$i days ago" +"%Y-%m-%d")

            echo "Getting: $DATE"

            RESPONSE=$(curl -sS \
              --retry 1 \
              --retry-delay 3 \
              --max-time 45 \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DATE")

            echo "$RESPONSE" >> results_raw.jsonl

          done


      # ==========================================
      # CREATE RESULTS
      # ==========================================

      - name: Create results.json
        run: |

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          IMPORTANT_LEAGUES = {
              39,    # Premier League
              140,   # La Liga
              135,   # Serie A
              78,    # Bundesliga
              61,    # Ligue 1
              2,     # Champions League
              3      # Europa League
          }

          results = []

          api_ok = 0
          api_errors = 0

          with open(
              "results_raw.jsonl",
              encoding="utf-8"
          ) as f:

              for line in f:

                  line = line.strip()

                  if not line:
                      continue

                  try:
                      data = json.loads(line)
                  except Exception:
                      continue

                  errors = data.get(
                      "errors",
                      {}
                  )

                  if errors:

                      api_errors += 1

                      print(
                          "RESULT API ERROR:",
                          errors
                      )

                      continue

                  api_ok += 1

                  for item in data.get(
                      "response",
                      []
                  ):

                      fixture = item.get(
                          "fixture",
                          {}
                      ) or {}

                      status = fixture.get(
                          "status",
                          {}
                      ) or {}

                      league = item.get(
                          "league",
                          {}
                      ) or {}

                      league_id = league.get(
                          "id"
                      )

                      # ==================================
                      # ONLY IMPORTANT LEAGUES
                      # ==================================

                      if league_id not in IMPORTANT_LEAGUES:
                          continue

                      # ==================================
                      # FINISHED
                      # ==================================

                      short_status = str(
                          status.get(
                              "short",
                              ""
                          )
                      ).upper()

                      if short_status not in {
                          "FT",
                          "AET",
                          "PEN"
                      }:
                          continue

                      # ==================================
                      # WOMEN FILTER
                      # ==================================

                      league_name = str(
                          league.get(
                              "name",
                              ""
                          )
                      ).lower()

                      league_type = str(
                          league.get(
                              "type",
                              ""
                          )
                      ).lower()

                      if (
                          "women" in league_name
                          or "woman" in league_name
                          or "feminine" in league_name
                          or "female" in league_name
                          or "women" in league_type
                      ):
                          continue

                      teams = item.get(
                          "teams",
                          {}
                      ) or {}

                      home = teams.get(
                          "home",
                          {}
                      ) or {}

                      away = teams.get(
                          "away",
                          {}
                      ) or {}

                      results.append({
                          "fixture": fixture,
                          "league": league,
                          "home": home,
                          "away": away,
                          "goals": item.get(
                              "goals",
                              {}
                          ) or {}
                      })

          # ==================================
          # REMOVE DUPLICATES
          # ==================================

          unique = {}

          for item in results:

              fixture_id = (
                  item
                  .get("fixture", {})
                  .get("id")
              )

              if fixture_id:
                  unique[fixture_id] = item

          results = list(
              unique.values()
          )

          # ==================================
          # SORT
          # ==================================

          results.sort(
              key=lambda x:
              x.get(
                  "fixture",
                  {}
              ).get(
                  "timestamp",
                  0
              ),
              reverse=True
          )

          # ==================================
          # IMPORTANT:
          # If ALL API requests failed,
          # KEEP OLD RESULTS
          # ==================================

          if (
              api_ok == 0
              and api_errors > 0
          ):

              print(
                  "ALL RESULT API REQUESTS FAILED"
              )

              if os.path.exists(
                  "results.json"
              ):

                  print(
                      "KEEPING OLD results.json"
                  )

                  raise SystemExit(0)

          # ==================================
          # SAVE
          # ==================================

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "results": len(results),

              "matches": results
          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print(
              "FINAL RESULTS:",
              len(results)
          )
          print("================================")

          PY

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "================================"
          echo "GETTING TRANSFERS"
          echo "================================"

          curl -sS \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo '{"response":[],"results":0,"errors":{"local":"empty"}}' > transfers_raw.json
          fi

      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          errors = data.get(
              "errors",
              {}
          )

          if errors:

              print(
                  "TRANSFER API ERROR:",
                  errors
              )

              print(
                  "KEEPING OLD transfers.json"
              )

              if os.path.exists(
                  "transfers.json"
              ):
                  raise SystemExit(0)

          today = datetime.now(
              timezone.utc
          ).date()

          start_date = (
              today -
              timedelta(days=30)
          )

          transfers = []

          for player_item in data.get(
              "response",
              []
          ):

              player = player_item.get(
                  "player",
                  {}
              ) or {}

              for transfer in player_item.get(
                  "transfers",
                  []
              ):

                  date_text = transfer.get(
                      "date",
                      ""
                  )

                  try:

                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()

                  except Exception:

                      continue

                  if not (
                      start_date
                      <= transfer_date
                      <= today
                  ):
                      continue

                  teams = transfer.get(
                      "teams",
                      {}
                  ) or {}

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get(
                          "type"
                      ),
                      "teams": {
                          "in": teams.get(
                              "in",
                              {}
                          ) or {},
                          "out": teams.get(
                              "out",
                              {}
                          ) or {}
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          PY

      # ==========================================
      # STANDINGS - ONLY 5 LEAGUES
      # ==========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ.get(
              "API_KEY",
              ""
          )

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          # ==========================================
          # LOAD OLD DATA
          # ==========================================

          try:

              with open(
                  "standings.json",
                  encoding="utf-8"
              ) as f:

                  output = json.load(f)

          except Exception:

              output = {
                  "updated": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "leagues": {}
              }

          # ==========================================
          # GET 5 STANDINGS
          # ==========================================

          for name, league_id in leagues.items():

              print(
                  "Getting standings:",
                  name
              )

              params = urllib.parse.urlencode({
                  "league": league_id,
                  "season": 2024
              })

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      api_data = json.load(
                          response
                      )

                  if api_data.get(
                      "errors"
                  ):

                      print(
                          name,
                          "ERROR:",
                          api_data.get(
                              "errors"
                          )
                      )

                      continue

                  response_data = api_data.get(
                      "response",
                      []
                  )

                  if not response_data:

                      print(
                          name,
                          "NO DATA"
                      )

                      continue

                  league = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league.get(
                      "standings",
                      []
                  )

                  if (
                      standings
                      and isinstance(
                          standings[0],
                          list
                      )
                  ):

                      standings = standings[0]

                  output[
                      "leagues"
                  ][name] = {
                      "logo": league.get(
                          "logo"
                      ),
                      "standings": standings
                  }

                  print(
                      name,
                      "OK:",
                      len(standings)
                  )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

                  # داتای کۆن دەمێنێتەوە

          output["updated"] = datetime.now(
              timezone.utc
          ).isoformat()

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "STANDING LEAGUES:",
              len(
                  output.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final football data
        run: |

          echo "================================"
          echo "FINAL FOOTBALL DATA"
          echo "================================"

          python3 - <<'PY'
          import json

          def load_json(
              filename,
              default
          ):

              try:

                  with open(
                      filename,
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except Exception:

                  return default

          matches = load_json(
              "matches.json",
              {"matches": []}
          )

          results = load_json(
              "results.json",
              {"matches": []}
          )

          transfers = load_json(
              "transfers.json",
              []
          )

          standings = load_json(
              "standings.json",
              {"leagues": {}}
          )

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL TRANSFERS:",
              len(
                  transfers
              )
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Update football data"

          git pull --rebase origin main

          git push origin HEAD:main
