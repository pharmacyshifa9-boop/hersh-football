name: Update Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # GET TODAY MATCHES
      # =========================

      - name: Get today's matches

        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "Getting matches for $TODAY"

          curl -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json


      # =========================
      # CREATE MATCHES.JSON
      # =========================

      - name: Create matches.json

        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone


          with open(
              "matches_raw.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          matches = []


          for item in data.get(
              "response",
              []
          ):

              matches.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      item.get(
                          "league",
                          {}
                      ),

                  "home":
                      item.get(
                          "teams",
                          {}
                      ).get(
                          "home",
                          {}
                      ),

                  "away":
                      item.get(
                          "teams",
                          {}
                      ).get(
                          "away",
                          {}
                      ),

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )

              })


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(matches),

              "matches":
                  matches

          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "MATCHES:",
              len(matches)
          )

          PY


      # =========================
      # TRANSFERS
      # =========================

      - name: Get important transfers

        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          mkdir -p transfer_data

          teams=(

            529
            541
            157

          )


          for team in "${teams[@]}"; do

            echo \
              "Getting transfers for $team"

            curl -sS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json" \
              -w " HTTP:%{http_code}\n" \
              || true

            sleep 5

          done


      # =========================
      # CREATE TRANSFERS.JSON
      # =========================

      - name: Create transfers.json

        run: |

          python3 - <<'PY'

          import json
          import glob


          transfers = []


          for filename in glob.glob(
              "transfer_data/*.json"
          ):

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)


                  for item in data.get(
                      "response",
                      []
                  ):

                      player = item.get(
                          "player",
                          {}
                      )


                      for transfer in item.get(
                          "transfers",
                          []
                      ):

                          transfers.append({

                              "player":
                                  player,

                              "date":
                                  transfer.get(
                                      "date"
                                  ),

                              "type":
                                  transfer.get(
                                      "type"
                                  ),

                              "teams":
                                  transfer.get(
                                      "teams"
                                  )

                          })

              except Exception as e:

                  print(
                      "Skipping",
                      filename,
                      e
                  )


          unique = []


          seen = set()


          for item in transfers:

              player =
                  item.get(
                      "player",
                      {}
                  )


              key = (

                  player.get("id"),

                  item.get("date"),

                  item.get("type")

              )


              if key in seen:
                  continue


              seen.add(key)

              unique.append(item)


          unique.sort(

              key=lambda x:
                  x.get(
                      "date"
                  ) or "",

              reverse=True

          )


          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  unique[:100],
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "TRANSFERS:",
              len(unique[:100])
          )

          PY


      # =========================
      # COMMIT
      # =========================

      - name: Save data

        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"


          git add \
            matches.json \
            transfers.json \
            transfer_data


          if git diff \
            --cached \
            --quiet; then

            echo "No changes"

            exit 0

          fi


          git commit \
            -m \
            "Update football data"


          git push
