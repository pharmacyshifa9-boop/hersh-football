name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # TODAY'S MATCHES + LIVE
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "Getting matches for $TODAY"

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json


      # =========================
      # CREATE matches.json
      # =========================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone


          with open(
              "matches_raw.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          matches = []


          for item in data.get(
              "response",
              []
          ):

              fixture = \
                  item.get(
                      "fixture",
                      {}
                  )

              league = \
                  item.get(
                      "league",
                      {}
                  )

              teams = \
                  item.get(
                      "teams",
                      {}
                  )

              goals = \
                  item.get(
                      "goals",
                      {}
                  )


              home = \
                  teams.get(
                      "home",
                      {}
                  )

              away = \
                  teams.get(
                      "away",
                      {}
                  )


              matches.append({

                  "fixture": fixture,

                  "league": league,

                  "home": home,

                  "away": away,

                  "goals": goals

              })


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(matches),

              "matches":
                  matches

          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Matches:",
              len(matches)
          )

          PY


      # =========================
      # TRANSFERS
      # =========================

      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}

        run: |

          mkdir -p transfer_data

          teams=(
            529
            541
            157
            42
            50
            33
            49
            530
            85
          )

          for team in "${teams[@]}"; do

            echo "Getting transfers for team $team..."

            curl -sS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json" \
              -w " HTTP:%{http_code}\n" || true

            sleep 3

          done

      # =========================
      # CREATE transfers.json
      # =========================

      - name: Create transfers.json

        run: |

          CUTOFF=$(date -u -d "7 days ago" +%Y-%m-%d)

          echo \
            "Showing transfers from $CUTOFF"


          jq -s --arg cutoff "$CUTOFF" '

            [

              .[]

              | .response[]

              | . as $playerData

              | .transfers[]

              | select(
                  .date >= $cutoff
                )

              | {

                  player:
                    $playerData.player,

                  date:
                    .date,

                  type:
                    .type,

                  teams:
                    .teams,

                  update:
                    $playerData.update

                }

            ]

            | unique_by([

                .player.id,
                .date,
                .type,
                .teams.in.id,
                .teams.out.id

            ])

            | sort_by(.date)

            | reverse

          ' transfer_data/*.json \
            > transfers.json


          echo "Transfers created"

          cat transfers.json


      # =========================
      # SAVE
      # =========================

      - name: Save changes

        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"


          git add \
            matches.json \
            transfers.json


          if git diff \
            --cached \
            --quiet; then

            echo \
              "No changes to commit"

            exit 0

          fi


          git commit \
            -m \
            "Update football data"


          git push
