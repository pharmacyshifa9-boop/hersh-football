name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          mkdir -p transfer_data

          teams=(
            529
            541
            157
            42
            50
            33
            49
            530
            85
          )

          for team in "${teams[@]}"; do
            echo "Getting transfers for team $team..."

            curl -f -sS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json"
          done

      - name: Filter last 7 days
        run: |
          CUTOFF=$(date -u -d "7 days ago" +%Y-%m-%d)

          jq -s --arg cutoff "$CUTOFF" '
            [
              .[]
              | .response[]
              | . as $playerData
              | .transfers[]
              | select(.date >= $cutoff)
              | {
                  player: $playerData.player,
                  date: .date,
                  type: .type,
                  teams: .teams,
                  update: $playerData.update
                }
            ]
            | unique_by([
                .player.id,
                .date,
                .type,
                .teams.in.id,
                .teams.out.id
              ])
            | sort_by(.date)
            | reverse
          ' transfer_data/*.json > transfers.json

      # =========================
      # TODAY'S MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo "Getting matches for $TODAY..."

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

            - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          # خولە بەهێزەکان
          strong_leagues = {
              39,    # Premier League
              140,   # La Liga
              135,   # Serie A
              78,    # Bundesliga
              61,    # Ligue 1
              40,    # Championship
              2,     # Champions League
              3,     # Europa League
              848,   # Conference League
              307,   # Saudi Pro League
              203,   # Süper Lig
              88,    # Eredivisie
              94,    # Primeira Liga
              144    # Belgian Pro League
          }

          matches = []

          for item in data.get("response", []):

              league = item.get("league", {})
              league_id = league.get("id")

              if league_id not in strong_leagues:
                  continue

              teams = item.get("teams", {})

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": teams.get("home", {}),
                  "away": teams.get("away", {}),
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Strong league matches:", len(matches))
          PY
      # =========================
      # SAVE EVERYTHING
      # =========================

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add transfers.json matches.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update football transfers and matches"
          git push
