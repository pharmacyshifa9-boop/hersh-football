name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          mkdir -p transfer_data

          for team in 529 541 157 42 50 33 49 530 85
          do
            echo "Getting transfers for team $team"

            curl -f -sS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json"
          done

      - name: Create transfers.json
        run: |
          CUTOFF=$(date -u -d "7 days ago" +%Y-%m-%d)

          jq -s --arg cutoff "$CUTOFF" '
            [
              .[]
              | .response[]
              | . as $p
              | .transfers[]
              | select(.date >= $cutoff)
              | {
                  player: $p.player,
                  date: .date,
                  type: .type,
                  teams: .teams,
                  update: $p.update
                }
            ]
            | unique_by([
                .player.id,
                .date,
                .type,
                .teams.in.id,
                .teams.out.id
              ])
            | sort_by(.date)
            | reverse
          ' transfer_data/*.json > transfers.json

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          strong_leagues = {
              39,
              140,
              135,
              78,
              61,
              40,
              2,
              3,
              848,
              307,
              203,
              88,
              94,
              144
          }

          matches = []

          for item in data.get("response", []):
              league = item.get("league", {})

              if league.get("id") not in strong_leagues:
                  continue

              teams = item.get("teams", {})

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": teams.get("home", {}),
                  "away": teams.get("away", {}),
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Strong league matches:", len(matches))
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add transfers.json matches.json

          git commit -m "Update football data" || true

          git push
