name: Update Football Transfers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone

          API_KEY = "${API_KEY}"

          teams = [
              529, 541, 157, 42, 50, 33, 49,
              530, 85, 40, 496, 505, 489, 165
          ]

          cutoff = datetime.now(timezone.utc).date() - timedelta(days=7)
          all_transfers = []

          for team in teams:
              url = f"https://v3.football.api-sports.io/transfers?team={team}"

              request = urllib.request.Request(
                  url,
                  headers={"x-apisports-key": API_KEY}
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      data = json.load(response)

                  for item in data.get("response", []):
                      player = item.get("player", {})

                      for transfer in item.get("transfers", []):
                          date_text = transfer.get("date", "")

                          try:
                              transfer_date = datetime.fromisoformat(
                                  date_text.replace("Z", "+00:00")
                              ).date()
                          except:
                              continue

                          if transfer_date >= cutoff:
                              all_transfers.append({
                                  "player": player,
                                  "date": date_text,
                                  "type": transfer.get("type"),
                                  "teams": transfer.get("teams")
                              })

              except Exception as error:
                  print(f"Team {team} error: {error}")

          # Remove duplicates
          unique = {}
          for transfer in all_transfers:
              key = (
                  transfer["player"].get("id"),
                  transfer["date"],
                  transfer["teams"]["in"].get("id"),
                  transfer["teams"]["out"].get("id")
              )
              unique[key] = transfer

          result = list(unique.values())

          result.sort(
              key=lambda x: x.get("date", ""),
              reverse=True
          )

          with open("transfers.json", "w", encoding="utf-8") as file:
              json.dump(
                  {
                      "updated": datetime.now(timezone.utc).isoformat(),
                      "days": 7,
                      "results": len(result),
                      "response": result
                  },
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Saved {len(result)} transfers from the last 7 days.")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add transfers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update football transfers"
          git push
