name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          if [ ! -s transfers_raw.json ]; then
            echo "transfers_raw.json is empty"
            echo '{"response":[],"results":0}' > transfers_raw.json
          fi

          echo "Transfers API response saved."


      # =========================
      # CREATE TRANSFERS.JSON
      # =========================

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              505,
              489,
              496
          }

          filtered = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in strong_teams
                      and out_id not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Transfers:", len(filtered))
          PY


      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          TODAY=$(date -u +"%Y-%m-%d")

          echo "⚽ Getting today's matches..."
          echo "Date: $TODAY"

          curl -sS --retry 3 --retry-delay 5 \
            --max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          if [ ! -s matches_raw.json ]; then
            echo "matches_raw.json is empty"
            echo '{"response":[],"results":0}' > matches_raw.json
          fi

          python3 - <<'PY'
          import json

          with open(
              "matches_raw.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("API errors:", data.get("errors", []))
          print("API results:", data.get("results", 0))
          print("API response:", len(data.get("response", [])))
          PY


      # =========================
      # FILTER MATCHES
      # =========================

      - name: Create filtered matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open(
              "matches_raw.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          response = data.get("response", [])

          print("API results:", data.get("results", 0))
          print("All matches:", len(response))


          # =========================
          # IMPORTANT LEAGUES
          # =========================

          IMPORTANT_LEAGUES = {
              39,   # Premier League
              140,  # La Liga
              135,  # Serie A
              78,   # Bundesliga
              61,   # Ligue 1
              2,    # Champions League
              3,    # Europa League
              290   # Iraq Stars League
          }


          # =========================
          # IMPORTANT TEAMS
          # =========================

          IMPORTANT_TEAMS = {
              529,  # Barcelona
              541,  # Real Madrid
              530,  # Atletico Madrid
              50,   # Manchester City
              33,   # Manchester United
              42,   # Arsenal
              49,   # Chelsea
              40,   # Liverpool
              157,  # Bayern
              85,   # PSG
              496,  # Juventus
              505,  # Inter
              489   # AC Milan
          }


          matches = []


          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league_id = league.get("id")

              home_id = home.get("id")

              away_id = away.get("id")


              # =========================
              # FILTER
              # =========================

              keep = False

              if league_id in IMPORTANT_LEAGUES:
                  keep = True

              if home_id in IMPORTANT_TEAMS:
                  keep = True

              if away_id in IMPORTANT_TEAMS:
                  keep = True


              if not keep:
                  continue


              fixture = item.get(
                  "fixture",
                  {}
              )

              goals = item.get(
                  "goals",
                  {}
              )


              matches.append({

                  "fixture": fixture,

                  "league": league,

                  "home": home,

                  "away": away,

                  "goals": goals

              })


          output = {

              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "results": len(matches),

              "matches": matches

          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "IMPORTANT MATCHES:",
              len(matches)
          )


          for match in matches:

              league = match.get(
                  "league",
                  {}
              )

              home = match.get(
                  "home",
                  {}
              )

              away = match.get(
                  "away",
                  {}
              )

              print(
                  league.get("name"),
                  "|",
                  home.get("name"),
                  "vs",
                  away.get("name")
              )

          PY


      # =========================
      # CHECK
      # =========================

      - name: Check matches data
        run: |

          echo "=============================="
          echo "FINAL FOOTBALL DATA"
          echo "=============================="

          python3 - <<'PY'
          import json

          with open(
              "matches.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          matches = data.get(
              "matches",
              []
          )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          for item in matches:

              league = item.get(
                  "league",
                  {}
              )

              home = item.get(
                  "home",
                  {}
              )

              away = item.get(
                  "away",
                  {}
              )

              print(
                  league.get("name"),
                  ":",
                  home.get("name"),
                  "-",
                  away.get("name")
              )
          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config \
            user.name "github-actions"

          git config \
            user.email "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json

          git status --short

          git commit \
            -m "Update filtered football data" \
            || true

          git push
