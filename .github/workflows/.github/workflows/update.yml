name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529, 541, 530, 157, 42, 50, 33, 49,
              40, 85, 211, 47, 228, 531, 536,
              645, 234, 520
          }

          filtered = []

          for player in data.get("response", []):
              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text, "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date or transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})
                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in strong_teams
                      and team_out.get("id") not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(filtered, f, ensure_ascii=False, indent=2)

          print(f"Transfers: {len(filtered)}")

      # =========================
      # TODAY'S MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          matches = []

          for item in data.get("response", []):

              fixture = item.get("fixture", {})
              league = item.get("league", {})
              teams = item.get("teams", {})
              goals = item.get("goals", {})

              home = teams.get("home", {})
              away = teams.get("away", {})

              matches.append({
                  "fixture": fixture,
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": goals
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Matches: {len(matches)}")
          PY

      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add transfers.json matches.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update football transfers and matches"
          git push
