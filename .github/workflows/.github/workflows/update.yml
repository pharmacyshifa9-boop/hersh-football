name: Update Football Transfers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers.json

      - name: Filter recent transfers
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529, 541, 530, 157, 42, 50, 33, 49,
              40, 85, 211, 47, 228, 531, 536,
              645, 234, 520
          }

          filtered = []

          for player in data.get("response", []):
              for transfer in player.get("transfers", []):
                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text, "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date or transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})
                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in strong_teams
                      and team_out.get("id") not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "in": team_in,
                      "out": team_out
                  })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(filtered),
              "transfers": filtered
          }

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Recent strong-team transfers: {len(filtered)}")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add transfers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update recent football transfers"
          git push
