name: Update Football Transfers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o raw.json

      - name: Filter latest 7 days and save
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          important = {
              "Barcelona",
              "Real Madrid",
              "Bayern Munich",
              "Arsenal",
              "Manchester City",
              "Manchester United",
              "Chelsea",
              "Atletico Madrid",
              "Atlético Madrid",
              "Paris Saint Germain",
              "PSG",
              "Hewlêr",
              "Erbil",
              "Zakho",
              "Zakho SC"
          }

          cutoff = datetime.now(timezone.utc).date() - timedelta(days=7)
          output = []

          for item in data.get("response", []):
              player = item.get("player", {})
              for tr in item.get("transfers", []):
                  date_text = tr.get("date")
                  if not date_text:
                      continue

                  try:
                      transfer_date = datetime.fromisoformat(date_text).date()
                  except:
                      continue

                  if transfer_date < cutoff:
                      continue

                  teams = tr.get("teams", {})
                  incoming = teams.get("in", {})
                  outgoing = teams.get("out", {})

                  in_name = incoming.get("name", "")
                  out_name = outgoing.get("name", "")

                  if in_name not in important and out_name not in important:
                      continue

                  output.append({
                      "player": player,
                      "date": date_text,
                      "type": tr.get("type", ""),
                      "teams": {
                          "in": incoming,
                          "out": outgoing
                      }
                  })

          output.sort(key=lambda x: x["date"], reverse=True)

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Saved transfers:", len(output))
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add transfers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update latest football transfers"
          git push
