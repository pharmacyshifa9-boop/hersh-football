name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # CHECK API KEY
      # ==========================================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"

      # ==========================================
      # TODAY
      # ==========================================

      - name: Set today's date
        run: |
          echo "TODAY=$(date -u +"%Y-%m-%d")" >> "$GITHUB_ENV"
          echo "TODAY=$(date -u +"%Y-%m-%d")"

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          rm -f transfers_raw.json
          echo "Getting transfers..."

          curl -f -sS \
            --retry 8 \
            --retry-delay 8 \
            --retry-max-time 180 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          echo "✅ Transfers downloaded"

      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=30)

          important_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489
          }

          transfers = []

          for player_data in data.get("response", []):

              player = player_data.get("player", {})

              for transfer in player_data.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in important_teams
                      and
                      team_out.get("id") not in important_teams
                  ):
                      continue

                  transfers.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get(
                          "type",
                          "Transfer"
                      ),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  transfers,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("==============================")
          print("TRANSFERS:", len(transfers))
          print("==============================")
          PY

      # ==========================================
      # MATCHES
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          echo "Getting matches for $TODAY"

          curl -f -sS \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 120 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          echo "✅ Matches downloaded"

      # ==========================================
      # IRAQ LEAGUES
      # ==========================================

      - name: Get Iraq leagues
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 120 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/leagues?country=Iraq" \
            -o iraq_leagues.json

          echo "✅ Iraq leagues downloaded"

      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          print("ALL API MATCHES:", len(response))

          BIG_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          important_teams = {
              529,
              541,
              530,
              50,
              33,
              42,
              49,
              40,
              157,
              85,
              496,
              505,
              489,

              # Iraq / Kurdistan
              542,
              543,
              544,
              545,
              546,
              547,
              548,
              549
          }

          iraq_ids = set()

          try:
              with open(
                  "iraq_leagues.json",
                  encoding="utf-8"
              ) as f:
                  iraq = json.load(f)

              for item in iraq.get("response", []):

                  league = item.get(
                      "league",
                      {}
                  )

                  league_id = league.get("id")

                  if league_id:
                      iraq_ids.add(league_id)

          except Exception as e:
              print("Iraq leagues error:", e)

          print(
              "IRAQ LEAGUE IDS:",
              sorted(iraq_ids)
          )

          matches = []

          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league_id = league.get("id")

              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              # Big leagues
              if league_id in BIG_LEAGUES:
                  keep = True

              # Iraq competitions
              if league_id in iraq_ids:
                  keep = True

              # Important clubs
              if (
                  home_id in important_teams
                  or
                  away_id in important_teams
              ):
                  keep = True

              if not keep:
                  continue

              matches.append({
                  "fixture": item.get(
                      "fixture",
                      {}
                  ),
                  "league": league,
                  "home": home,
                  "away": away,
                  "goals": item.get(
                      "goals",
                      {}
                  )
              })

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("==============================")
          print("FINAL MATCHES:", len(matches))
          print("==============================")

          for match in matches:

              league = match.get(
                  "league",
                  {}
              )

              home = match.get(
                  "home",
                  {}
              )

              away = match.get(
                  "away",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )

              print(
                  league.get("name"),
                  "=>",
                  home.get("name"),
                  "vs",
                  away.get("name"),
                  "|",
                  goals.get("home"),
                  "-",
                  goals.get("away")
              )

          PY

      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.error
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3
          }

          seasons = [
              2025,
              2024,
              2023
          ]

          result = {}

          for name, league_id in leagues.items():

              print("")
              print("==============================")
              print("League:", name)

              found = False

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings"
                      "?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "Accept": "application/json",
                          "User-Agent": "Hersh-Football"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.load(
                              response
                          )

                  except Exception as e:

                      print(
                          "Error:",
                          name,
                          season,
                          e
                      )

                      continue

                  if data.get("errors"):
                      continue

                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      continue

                  league_data = (
                      response_data[0].get(
                          "league",
                          {}
                      )
                  )

                  standings = (
                      league_data.get(
                          "standings",
                          []
                      )
                  )

                  if not standings:
                      continue

                  table = standings[0]

                  result[name] = {
                      "id": league_id,
                      "season": season,
                      "name": name,
                      "logo": league_data.get(
                          "logo"
                      ),
                      "standings": table
                  }

                  print(
                      "✅ SUCCESS:",
                      name,
                      "season:",
                      season,
                      "teams:",
                      len(table)
                  )

                  found = True
                  break

              if not found:
                  print(
                      "❌ FAILED:",
                      name
                  )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "leagues": result
          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==============================")
          print(
              "STANDING LEAGUES:",
              len(result)
          )
          print("==============================")

          PY

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Check generated files
        run: |

          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          echo ""

          python3 - <<'PY'

          import json

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:
              transfers = json.load(f)

          print(
              "TRANSFERS:",
              len(transfers)
          )

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:
              matches_data = json.load(f)

          matches = matches_data.get(
              "matches",
              []
          )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          for m in matches:

              print(
                  m.get("league", {}).get("name"),
                  "=>",
                  m.get("home", {}).get("name"),
                  "vs",
                  m.get("away", {}).get("name")
              )

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:
              standings_data = json.load(f)

          print(
              "STANDING LEAGUES:",
              len(
                  standings_data.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git status --short

          git diff --cached --stat

          git commit \
            -m "Update football data" \
            || echo "No changes to commit"

          git push
