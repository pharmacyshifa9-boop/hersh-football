name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # API KEY CHECK
      # =========================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API key is missing"
            exit 1
          fi

          echo "API key exists"

      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529, 541, 530, 157,
              42, 50, 33, 49,
              40, 85, 211, 47,
              228, 531, 536,
              645, 234, 520
          }

          filtered = []

          for player in data.get("response", []):

              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in strong_teams
                      and
                      team_out.get("id") not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Transfers:", len(filtered))
          PY

      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          matches = []

          for item in data.get("response", []):

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": item.get("league", {}),
                  "home": item.get("teams", {}).get("home", {}),
                  "away": item.get("teams", {}).get("away", {}),
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Matches:", len(matches))
          PY

      # =========================
      # STANDINGS
      # =========================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = "${API_KEY}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3
          }

          # API-Football uses competition seasons.
          # Try 2026 first, then 2025 if 2026 is unavailable.

          seasons = [2026, 2025]

          result = {}

          for league_name, league_id in leagues.items():

              found = False

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings"
                      "?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )

                  except Exception as error:

                      print(
                          league_name,
                          "ERROR",
                          str(error)
                      )

                      continue

                  api_errors = data.get(
                      "errors",
                      {}
                  )

                  if api_errors:
                      print(
                          league_name,
                          "API errors:",
                          api_errors
                      )

                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          league_name,
                          "No data for season",
                          season
                      )
                      continue

                  league_data = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league_data.get(
                      "standings",
                      []
                  )

                  if not standings:
                      print(
                          league_name,
                          "No standings for season",
                          season
                      )
                      continue

                  # Some competitions may return more
                  # than one group/table.
                  if isinstance(
                      standings[0],
                      list
                  ):
                      table = standings[0]
                  else:
                      table = standings[0]

                  result[league_name] = {
                      "id": league_id,
                      "season": season,
                      "name": league_name,
                      "standings": table
                  }

                  print(
                      league_name,
                      "OK",
                      "season:",
                      season,
                      "teams:",
                      len(table)
                  )

                  found = True
                  break

              if not found:
                  print(
                      league_name,
                      "FAILED"
                  )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "leagues": result
          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "TOTAL LEAGUES:",
              len(result)
          )
          PY

      # =========================
      # CHECK
      # =========================

      - name: Check generated data
        run: |
          echo "=============================="
          echo "FILES"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          echo ""
          echo "=============================="
          echo "STANDINGS"
          echo "=============================="

          python3 - <<'PY'
          import json

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          leagues = data.get(
              "leagues",
              {}
          )

          print(
              "Leagues found:",
              len(leagues)
          )

          for name, league in leagues.items():

              print(
                  name,
                  "=>",
                  len(
                      league.get(
                          "standings",
                          []
                      )
                  ),
                  "teams"
              )
          PY

      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git commit \
            -m "Update football data" || true

          git push
