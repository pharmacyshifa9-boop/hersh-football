name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # CHECK API KEY
      # =========================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"


      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          echo "✅ Transfers downloaded"


      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          important_teams = {
              529, 541, 530,
              42, 49, 40,
              50, 33,
              157,
              85,
              496, 505, 489
          }

          result = []

          for item in data.get("response", []):

              player = item.get("player", {})

              for transfer in item.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in important_teams
                      and
                      team_out.get("id") not in important_teams
                  ):
                      continue

                  result.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get("type", "Transfer"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Transfers:", len(result))
          PY


      # =========================
      # TODAY
      # =========================

      - name: Set today's date
        run: |
          echo "TODAY=$(date -u +"%Y-%m-%d")" >> "$GITHUB_ENV"
          echo "Today: $(date -u +"%Y-%m-%d")"


      # =========================
      # GET ALL TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          echo "✅ Matches downloaded"


      # =========================
      # CREATE FILTERED MATCHES
      # =========================

      - name: Create matches.json
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]


          # ==========================================
          # EXACT BIG LEAGUE IDS
          # ==========================================

          BIG_LEAGUES = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1",
              2: "Champions League",
              3: "Europa League"
          }


          # ==========================================
          # GET IRAQ LEAGUES FROM API
          # ==========================================

          iraq_league_ids = set()

          try:

              url = (
                  "https://v3.football.api-sports.io/"
                  "leagues?country=Iraq"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY,
                      "User-Agent": "Hersh-Football"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  iraq_data = json.load(response)


              print("IRAQ LEAGUES FOUND:")

              for item in iraq_data.get("response", []):

                  league = item.get("league", {})
                  league_id = league.get("id")
                  league_name = league.get("name", "")

                  print(
                      league_id,
                      "|",
                      league_name
                  )

                  # Keep Iraq football competitions.
                  # The country filter guarantees Iraq.
                  if league_id:
                      iraq_league_ids.add(league_id)

          except Exception as e:

              print(
                  "Iraq league lookup failed:",
                  e
              )


          # ==========================================
          # IMPORTANT TEAM NAMES
          # ==========================================

          IMPORTANT_TEAMS = {

              # England
              "Manchester City",
              "Manchester United",
              "Liverpool",
              "Arsenal",
              "Chelsea",
              "Tottenham",
              "Newcastle United",

              # Spain
              "Barcelona",
              "Real Madrid",
              "Atletico Madrid",
              "Atlético Madrid",

              # Germany
              "Bayern Munich",
              "Borussia Dortmund",
              "Bayer Leverkusen",

              # Italy
              "Juventus",
              "Inter",
              "Inter Milan",
              "AC Milan",
              "Milan",
              "Napoli",
              "Roma",

              # France
              "Paris Saint Germain",
              "Paris Saint-Germain",
              "PSG",
              "Marseille",
              "Monaco",

              # Iraq / Kurdistan
              "Zakho",
              "Zakho FC",
              "Duhok",
              "Duhok SC",
              "Duhok FC",

              "Erbil",
              "Erbil SC",
              "Erbil Sport Club",

              "Newroz",
              "Newroz SC",
              "Newroz FC",

              "Hawler",
              "Hawler FC",

              "Shaklawa",
              "Shaqlawa",
              "Shaklawa SC",
              "Shaqlawa SC",

              "Akre",
              "Akre SC",
              "Akre FC",

              "Ranya",
              "Ranya SC",
              "Ranya FC",

              "Handren",
              "Handren FC",
              "Handren SC",

              "Sirwani Nwe",
              "Sirwani Nwe FC",
              "Sirwani Nwe SC",

              "Sherwana",
              "Sherwana SC",
              "Sherwana FC",

              "Chwarqurna",
              "Chwarqurna SC",
              "Chwarqurna FC",

              "Rzgari",
              "Rzgari SC",
              "Rzgari FC",

              "Qaladze",
              "Qaladze SC",
              "Qaladze FC",

              "Darbandikhan",
              "Darbandikhan SC",
              "Darbandikhan FC"
          }


          # ==========================================
          # LOAD MATCHES
          # ==========================================

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          response = data.get(
              "response",
              []
          )


          print(
              "=============================="
          )

          print(
              "ALL API MATCHES:",
              len(response)
          )

          print(
              "=============================="
          )


          matches = []


          # ==========================================
          # FILTER
          # ==========================================

          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league_id = league.get(
                  "id"
              )

              home_id = home.get(
                  "id"
              )

              away_id = away.get(
                  "id"
              )

              home_name = home.get(
                  "name",
                  ""
              )

              away_name = away.get(
                  "name",
                  ""
              )


              keep = False


              # ------------------------------------------
              # BIG EUROPEAN LEAGUES BY ID
              # ------------------------------------------

              if league_id in BIG_LEAGUES:

                  keep = True


              # ------------------------------------------
              # IRAQ BY LEAGUE ID
              # ------------------------------------------

              if league_id in iraq_league_ids:

                  keep = True


              # ------------------------------------------
              # IMPORTANT CLUBS
              # ------------------------------------------

              if (
                  home_name in IMPORTANT_TEAMS
                  or
                  away_name in IMPORTANT_TEAMS
              ):

                  keep = True


              if not keep:

                  continue


              matches.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      league,

                  "home":
                      home,

                  "away":
                      away,

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )
              })


          # ==========================================
          # SAVE
          # ==========================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "matches":
                  matches
          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "=============================="
          )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          print(
              "=============================="
          )


          for match in matches:

              league = match.get(
                  "league",
                  {}
              )

              home = match.get(
                  "home",
                  {}
              )

              away = match.get(
                  "away",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )

              print(
                  league.get("id"),
                  "|",
                  league.get("name"),
                  "|",
                  home.get("name"),
                  "vs",
                  away.get("name"),
                  "|",
                  goals.get("home"),
                  "-",
                  goals.get("away")
              )

          PY


      # =========================
      # STANDINGS
      # =========================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.error
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]


          leagues = {

              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3

          }


          # Free-plan compatible seasons
          seasons = [
              2024,
              2023,
              2022
          ]


          result = {}


          for name, league_id in leagues.items():

              print("")
              print(
                  "=============================="
              )

              print(
                  "League:",
                  name
              )


              found = False


              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings"
                      "?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )


                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "Accept": "application/json",
                          "User-Agent": "Hersh-Football"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.load(
                              response
                          )


                  except urllib.error.HTTPError as e:

                      print(
                          "HTTP ERROR:",
                          e.code,
                          "season:",
                          season
                      )

                      continue


                  except Exception as e:

                      print(
                          "ERROR:",
                          str(e)
                      )

                      continue


                  if data.get("errors"):

                      print(
                          "API ERRORS:",
                          data.get("errors")
                      )

                      continue


                  response_data = data.get(
                      "response",
                      []
                  )


                  if not response_data:

                      continue


                  league_data = (
                      response_data[0].get(
                          "league",
                          {}
                      )
                  )


                  standings = (
                      league_data.get(
                          "standings",
                          []
                      )
                  )


                  if not standings:

                      continue


                  table = standings[0]


                  result[name] = {

                      "id":
                          league_id,

                      "season":
                          season,

                      "name":
                          name,

                      "logo":
                          league_data.get(
                              "logo"
                          ),

                      "standings":
                          table

                  }


                  print(
                      "✅ SUCCESS:",
                      name,
                      "season:",
                      season,
                      "teams:",
                      len(table)
                  )


                  found = True

                  break


              if not found:

                  print(
                      "❌ FAILED:",
                      name
                  )


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues":
                  result

          }


          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "=============================="
          )

          print(
              "TOTAL LEAGUES:",
              len(result)
          )

          print(
              "=============================="
          )

          PY


      # =========================
      # CHECK EVERYTHING
      # =========================

      - name: Check generated files
        run: |

          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          echo ""

          python3 - <<'PY'

          import json


          # MATCHES

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches_data = json.load(f)


          matches = matches_data.get(
              "matches",
              []
          )


          print(
              "FINAL MATCHES:",
              len(matches)
          )


          for item in matches:

              league = item.get(
                  "league",
                  {}
              )

              home = item.get(
                  "home",
                  {}
              )

              away = item.get(
                  "away",
                  {}
              )

              print(
                  league.get("id"),
                  "|",
                  league.get("name"),
                  "=>",
                  home.get("name"),
                  "vs",
                  away.get("name")
              )


          # STANDINGS

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings_data = json.load(f)


          print(
              "STANDING LEAGUES:",
              len(
                  standings_data.get(
                      "leagues",
                      {}
                  )
              )
          )


          # TRANSFERS

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:

              transfers = json.load(f)


          print(
              "TRANSFERS:",
              len(transfers)
          )

          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git status --short

          git commit \
            -m "Update football data" \
            || true

          git push
