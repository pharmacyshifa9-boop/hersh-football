name: Update Football Data 2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "DATE: $TODAY"

      # ==========================================
      # MATCHES
      # 7 BIG LEAGUES + IRAQ/KURDISTAN
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          echo "================================"
          echo "GETTING MATCHES"
          echo "DATE: $TODAY"
          echo "================================"

          curl -f -sS \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 120 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("================================")
          print("API MATCH RESPONSE")
          print("================================")
          print("Errors:", data.get("errors"))
          print("Results:", data.get("results"))
          print("Response:", len(data.get("response", [])))
          print("================================")
          PY

      - name: Get Iraq leagues
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 60 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/leagues?country=Iraq" \
            -o iraq_leagues.json

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          BIG_LEAGUES = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1",
              2: "Champions League",
              3: "Europa League"
          }

          iraq_ids = set()

          try:
              with open("iraq_leagues.json", encoding="utf-8") as f:
                  iraq_data = json.load(f)

              print("IRAQ API ERRORS:", iraq_data.get("errors"))

              for item in iraq_data.get("response", []):
                  league = item.get("league", {})
                  league_id = league.get("id")

                  if league_id:
                      iraq_ids.add(league_id)

          except Exception as e:
              print("Iraq leagues error:", e)

          print("IRAQ LEAGUE IDS:", sorted(iraq_ids))

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          matches = []

          for item in response:
              league = item.get("league", {})
              league_id = league.get("id")

              if (
                  league_id not in BIG_LEAGUES
                  and league_id not in iraq_ids
              ):
                  continue

              teams = item.get("teams", {})

              matches.append({
                  "fixture": item.get("fixture", {}),
                  "league": league,
                  "home": teams.get("home", {}),
                  "away": teams.get("away", {}),
                  "goals": item.get("goals", {})
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("ALL API MATCHES:", len(response))
          print("FINAL MATCHES:", len(matches))
          print("================================")
          PY

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          rm -rf transfer_data
          mkdir -p transfer_data

          teams=(
            529
            541
            530
            50
            33
            42
            49
            40
            157
            85
            496
            505
            489
          )

          for team in "${teams[@]}"; do
            echo "Getting transfers for $team"

            curl -f -sS \
              --retry 3 \
              --retry-delay 5 \
              --retry-max-time 60 \
              -H "x-apisports-key: $API_KEY" \
              -H "Accept: application/json" \
              -A "Hersh-Football" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json" \
              || true

            sleep 3
          done

          echo "✅ Transfers downloaded"

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          import glob

          transfers = []

          for filename in glob.glob("transfer_data/*.json"):

              try:
                  with open(filename, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print("Skipping:", filename, e)
                  continue

              if data.get("errors"):
                  print("API ERROR:", filename, data.get("errors"))
                  continue

              for item in data.get("response", []):

                  player = item.get("player", {})

                  for transfer in item.get("transfers", []):

                      teams = transfer.get("teams", {})

                      transfers.append({
                          "player": player,
                          "date": transfer.get("date"),
                          "type": transfer.get("type", "Transfer"),
                          "teams": {
                              "in": teams.get("in", {}) or {},
                              "out": teams.get("out", {}) or {}
                          }
                      })

          unique = []
          seen = set()

          for item in transfers:

              player = item.get("player", {})
              teams = item.get("teams", {})

              team_in = teams.get("in", {})
              team_out = teams.get("out", {})

              key = (
                  player.get("id"),
                  item.get("date"),
                  team_in.get("id"),
                  team_out.get("id")
              )

              if key in seen:
                  continue

              seen.add(key)
              unique.append(item)

          unique.sort(
              key=lambda x: x.get("date") or "",
              reverse=True
          )

          unique = unique[:300]

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(
                  unique,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("TRANSFERS:", len(unique))
          print("================================")
          PY

      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]

          LEAGUES = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3
          }

          result = {}

          # Free plan commonly supports older seasons.
          # Try newest first, then older seasons.

          seasons = [
              2026,
              2025,
              2024,
              2023,
              2022
          ]

          for name, league_id in LEAGUES.items():

              print("")
              print("================================")
              print("League:", name)
              print("================================")

              found = False

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "Accept": "application/json",
                          "User-Agent": "Hersh-Football"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.load(response)

                  except Exception as e:
                      print(
                          "❌ REQUEST ERROR:",
                          season,
                          e
                      )
                      continue

                  if data.get("errors"):
                      print(
                          "❌ API ERROR:",
                          season,
                          data.get("errors")
                      )
                      continue

                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      print(
                          "❌ No data:",
                          season
                      )
                      continue

                  league_data = response_data[0].get(
                      "league",
                      {}
                  )

                  standings = league_data.get(
                      "standings",
                      []
                  )

                  if not standings:
                      print(
                          "❌ No standings:",
                          season
                      )
                      continue

                  result[name] = {
                      "id": league_id,
                      "season": season,
                      "name": name,
                      "logo": league_data.get("logo"),
                      "standings": standings[0]
                  }

                  print(
                      "✅ SUCCESS:",
                      name,
                      "season:",
                      season,
                      "teams:",
                      len(standings[0])
                  )

                  found = True
                  break

              if not found:
                  print(
                      "❌ FAILED:",
                      name
                  )

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "leagues": result
          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print(
              "STANDING LEAGUES:",
              len(result)
          )
          print("================================")
          PY

      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Final check
        run: |
          python3 - <<'PY'
          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers = json.load(f)

          with open("standings.json", encoding="utf-8") as f:
              standings = json.load(f)

          print("================================")
          print("FINAL DATA")
          print("================================")
          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )
          print(
              "TRANSFERS:",
              len(transfers)
          )
          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )
          print("================================")

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            matches.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update football data"
          git push
