name: Update Football Data 2

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API Key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi
          echo "✅ API key found"

      - name: Set Date
        run: |
          echo "TODAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Today: $(date -u +%Y-%m-%d)"

      # ==========================================
      # MATCHES
      # ==========================================

      - name: Download Matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -sS --retry 5 --retry-delay 5 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("API errors:", data.get("errors"))
          print("API results:", data.get("results", 0))
          print("API response:", len(data.get("response", [])))
          PY

      - name: Create Matches
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_TEAMS = {
              529, 541, 530, 50, 33, 49,
              40, 42, 157, 85, 496, 505, 489
          }

          BIG_LEAGUES = {
              39, 140, 135, 78, 61, 2, 3
          }

          matches = []

          for item in response:
              league = item.get("league") or {}
              teams = item.get("teams") or {}
              home = teams.get("home") or {}
              away = teams.get("away") or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in BIG_LEAGUES:
                  if (
                      home_id in IMPORTANT_TEAMS
                      or away_id in IMPORTANT_TEAMS
                  ):
                      keep = True

              if (
                  home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              ):
                  keep = True

              if keep:
                  matches.append({
                      "fixture": item.get("fixture") or {},
                      "league": league,
                      "home": home,
                      "away": away,
                      "goals": item.get("goals") or {}
                  })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "date": __import__("datetime").date.today().isoformat(),
              "results": len(matches),
              "matches": matches
          }

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("FINAL MATCHES:", len(matches))
          PY

      # ==========================================
      # RESULTS
      # ==========================================

      - name: Create Results
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_TEAMS = {
              529, 541, 530, 50, 33, 49,
              40, 42, 157, 85, 496, 505, 489
          }

          BIG_LEAGUES = {
              39, 140, 135, 78, 61, 2, 3
          }

          results = []

          for item in response:
              fixture = item.get("fixture") or {}
              status = fixture.get("status") or {}
              short = status.get("short")

              if short not in {"FT", "AET", "PEN"}:
                  continue

              league = item.get("league") or {}
              teams = item.get("teams") or {}
              home = teams.get("home") or {}
              away = teams.get("away") or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in BIG_LEAGUES:
                  if (
                      home_id in IMPORTANT_TEAMS
                      or away_id in IMPORTANT_TEAMS
                  ):
                      keep = True

              if (
                  home_id in IMPORTANT_TEAMS
                  or away_id in IMPORTANT_TEAMS
              ):
                  keep = True

              if keep:
                  results.append({
                      "fixture": fixture,
                      "league": league,
                      "home": home,
                      "away": away,
                      "goals": item.get("goals") or {}
                  })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(results),
              "matches": results
          }

          with open("results.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("FINAL RESULTS:", len(results))
          PY

      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Download Transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          mkdir -p transfer_data

          teams="529 541 530 50 33 49 40 42 157 85 496 505 489"

          for team in $teams; do
            echo "Transfer team: $team"

            curl -sS --retry 3 --retry-delay 4 \
              -H "x-apisports-key: $API_KEY" \
              -H "Accept: application/json" \
              -A "Hersh-Football" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json"

            sleep 2
          done

      - name: Create Transfers
        run: |
          python3 - <<'PY'
          import json
          import glob
          from datetime import datetime, timezone

          all_transfers = []

          for filename in glob.glob("transfer_data/*.json"):
              try:
                  with open(filename, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception:
                  continue

              if data.get("errors"):
                  print("API error:", filename, data.get("errors"))
                  continue

              for item in data.get("response", []):
                  player = item.get("player") or {}

                  for transfer in item.get("transfers", []):
                      teams = transfer.get("teams") or {}

                      team_in = teams.get("in") or {}
                      team_out = teams.get("out") or {}

                      all_transfers.append({
                          "player": player,
                          "date": transfer.get("date"),
                          "type": transfer.get("type", "Transfer"),
                          "teams": {
                              "in": team_in,
                              "out": team_out
                          }
                      })

          unique = []
          seen = set()

          for item in all_transfers:
              player = item.get("player") or {}
              teams = item.get("teams") or {}
              team_in = teams.get("in") or {}
              team_out = teams.get("out") or {}

              key = (
                  player.get("id"),
                  item.get("date"),
                  team_in.get("id"),
                  team_out.get("id")
              )

              if key in seen:
                  continue

              seen.add(key)
              unique.append(item)

          unique.sort(
              key=lambda x: x.get("date") or "",
              reverse=True
          )

          unique = unique[:300]

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "results": len(unique),
              "transfers": unique
          }

          with open("transfers.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("FINAL TRANSFERS:", len(unique))
          PY

      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Create Standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          import os

          API_KEY = os.environ["API_KEY"]

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61
          }

          seasons = [2024, 2023, 2022]

          output_leagues = {}

          for name, league_id in leagues.items():

              print("Checking:", name)

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      f"standings?league={league_id}&season={season}"
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "Accept": "application/json",
                          "User-Agent": "Hersh-Football"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          data = json.load(response)
                  except Exception as e:
                      print("ERROR:", name, season, e)
                      continue

                  if data.get("errors"):
                      print("API ERROR:", data.get("errors"))
                      continue

                  response_data = data.get("response", [])

                  if not response_data:
                      continue

                  league_data = response_data[0].get("league") or {}
                  standings = league_data.get("standings") or []

                  if not standings:
                      continue

                  output_leagues[name] = {
                      "id": league_id,
                      "season": season,
                      "name": name,
                      "logo": league_data.get("logo"),
                      "standings": standings[0]
                  }

                  print(
                      "SUCCESS:",
                      name,
                      "season:",
                      season,
                      "teams:",
                      len(standings[0])
                  )

                  break

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "leagues": output_leagues
          }

          with open("standings.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("FINAL STANDING LEAGUES:", len(output_leagues))
          PY

      # ==========================================
      # CHECK
      # ==========================================

      - name: Check generated files
        run: |
          echo "=============================="
          echo "FINAL DATA"
          echo "=============================="

          python3 - <<'PY'
          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          with open("results.json", encoding="utf-8") as f:
              results = json.load(f)

          with open("transfers.json", encoding="utf-8") as f:
              transfers = json.load(f)

          with open("standings.json", encoding="utf-8") as f:
              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(matches.get("matches", []))
          )

          print(
              "FINAL RESULTS:",
              len(results.get("matches", []))
          )

          print(
              "TRANSFERS:",
              len(transfers.get("transfers", []))
          )

          print(
              "STANDING LEAGUES:",
              len(standings.get("leagues", {}))
          )
          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update football data"
            git push origin HEAD:main
          fi
