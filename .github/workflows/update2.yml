name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # CHECK API KEY
      # ==========================================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"


      # ==========================================
      # IMPORTANT TEAM IDS
      # ==========================================

      - name: Set important teams
        run: |
          cat > important_teams.txt <<'EOF'
          529
          541
          530
          50
          33
          42
          49
          40
          157
          85
          496
          505
          489
          EOF

          echo "Important teams:"
          cat important_teams.txt


      # ==========================================
      # TRANSFERS
      # ==========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          rm -f transfers_raw.json

          FIRST=1

          while read TEAM_ID
          do

            echo "Getting transfers for team $TEAM_ID"

            curl -f -sS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$TEAM_ID" \
              -o "transfer_$TEAM_ID.json"

            if [ "$FIRST" -eq 1 ]; then
              cp "transfer_$TEAM_ID.json" transfers_raw.json
              FIRST=0
            fi

          done < important_teams.txt

          echo "✅ Transfer requests completed"


      # ==========================================
      # CREATE TRANSFERS
      # ==========================================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          import glob
          from datetime import datetime, timedelta, timezone

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=30)

          result = []
          seen = set()

          for filename in glob.glob("transfer_*.json"):

              try:

                  with open(
                      filename,
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

              except:
                  continue

              for player_data in data.get(
                  "response",
                  []
              ):

                  player = player_data.get(
                      "player",
                      {}
                  )

                  for transfer in player_data.get(
                      "transfers",
                      []
                  ):

                      date_text = transfer.get(
                          "date",
                          ""
                      )

                      try:

                          transfer_date = datetime.strptime(
                              date_text,
                              "%Y-%m-%d"
                          ).date()

                      except:

                          continue

                      if transfer_date < start_date:
                          continue

                      if transfer_date > today:
                          continue

                      teams = transfer.get(
                          "teams",
                          {}
                      )

                      team_in = teams.get(
                          "in",
                          {}
                      )

                      team_out = teams.get(
                          "out",
                          {}
                      )

                      key = (
                          player.get("id"),
                          date_text,
                          team_in.get("id"),
                          team_out.get("id")
                      )

                      if key in seen:
                          continue

                      seen.add(key)

                      result.append({

                          "player": player,

                          "date": date_text,

                          "type": transfer.get(
                              "type",
                              "Transfer"
                          ),

                          "teams": {

                              "in": team_in,

                              "out": team_out

                          }

                      })

          result.sort(
              key=lambda x: x.get(
                  "date",
                  ""
              ),
              reverse=True
          )

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "TRANSFERS:",
              len(result)
          )

          PY


      # ==========================================
      # TODAY
      # ==========================================

      - name: Set today's date
        run: |
          echo "TODAY=$(date -u +"%Y-%m-%d")" >> "$GITHUB_ENV"
          echo "TODAY: $(date -u +"%Y-%m-%d")"


      # ==========================================
      # GET TODAY MATCHES
      # ==========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          echo "✅ Matches downloaded"


      # ==========================================
      # GET IRAQ LEAGUES
      # ==========================================

      - name: Get Iraq competitions
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/leagues?country=Iraq" \
            -o iraq_leagues.json

          echo "✅ Iraq competitions downloaded"


      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          # ==========================================
          # BIG LEAGUE IDS
          # ==========================================

          BIG_LEAGUES = {

              39,
              140,
              135,
              78,
              61,
              2,
              3

          }


          # ==========================================
          # IRAQ LEAGUE IDS
          # ==========================================

          iraq_ids = set()

          try:

              with open(
                  "iraq_leagues.json",
                  encoding="utf-8"
              ) as f:

                  iraq = json.load(f)

              for item in iraq.get(
                  "response",
                  []
              ):

                  league = item.get(
                      "league",
                      {}
                  )

                  league_id = league.get(
                      "id"
                  )

                  league_type = league.get(
                      "type",
                      ""
                  )

                  if (
                      league_id
                      and
                      league_type == "League"
                  ):

                      iraq_ids.add(
                          league_id
                      )

          except Exception as e:

              print(
                  "Iraq leagues error:",
                  e
              )


          print(
              "IRAQ LEAGUE IDS:",
              sorted(iraq_ids)
          )


          # ==========================================
          # IMPORTANT TEAM IDS
          # ==========================================

          IMPORTANT_TEAMS = {

              # Europe

              529,
              541,
              530,

              50,
              33,
              42,
              49,
              40,

              157,
              85,

              496,
              505,
              489,

              # Iraq / Kurdistan
              # Known IDs can be added here later.
          }


          # ==========================================
          # LOAD MATCHES
          # ==========================================

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          response = data.get(
              "response",
              []
          )


          print(
              "ALL API MATCHES:",
              len(response)
          )


          matches = []


          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league_id = league.get(
                  "id"
              )

              home_id = home.get(
                  "id"
              )

              away_id = away.get(
                  "id"
              )


              keep = False


              # ------------------------------------------
              # BIG LEAGUES
              # ------------------------------------------

              if league_id in BIG_LEAGUES:

                  keep = True


              # ------------------------------------------
              # IRAQ
              # ------------------------------------------

              if league_id in iraq_ids:

                  keep = True


              # ------------------------------------------
              # IMPORTANT TEAMS
              # ------------------------------------------

              if (
                  home_id in IMPORTANT_TEAMS
                  or
                  away_id in IMPORTANT_TEAMS
              ):

                  keep = True


              if not keep:

                  continue


              matches.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      league,

                  "home":
                      home,

                  "away":
                      away,

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )

              })


          # ==========================================
          # SAVE
          # ==========================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "matches":
                  matches

          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "=============================="
          )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          print(
              "=============================="
          )


          for match in matches:

              league = match.get(
                  "league",
                  {}
              )

              home = match.get(
                  "home",
                  {}
              )

              away = match.get(
                  "away",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )

              print(

                  league.get("id"),
                  "|",

                  league.get("name"),
                  "|",

                  home.get("name"),
                  "vs",

                  away.get("name"),

                  "|",

                  goals.get("home"),
                  "-",

                  goals.get("away")

              )

          PY


      # ==========================================
      # STANDINGS
      # ==========================================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]


          leagues = {

              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3

          }


          seasons = [
              2025,
              2024,
              2023
          ]


          result = {}


          for name, league_id in leagues.items():

              found = False

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings"
                      "?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "User-Agent": "Hersh-Football"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.load(
                              response
                          )

                  except:

                      continue


                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      continue


                  league_data = (
                      response_data[0].get(
                          "league",
                          {}
                      )
                  )

                  standings = (
                      league_data.get(
                          "standings",
                          []
                      )
                  )

                  if not standings:
                      continue


                  result[name] = {

                      "id":
                          league_id,

                      "season":
                          season,

                      "name":
                          name,

                      "logo":
                          league_data.get(
                              "logo"
                          ),

                      "standings":
                          standings[0]

                  }

                  print(
                      "✅",
                      name,
                      season,
                      len(
                          standings[0]
                      ),
                      "teams"
                  )

                  found = True
                  break


              if not found:

                  print(
                      "❌",
                      name
                  )


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues":
                  result

          }


          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "STANDING LEAGUES:",
              len(result)
          )

          PY


      # ==========================================
      # FINAL CHECK
      # ==========================================

      - name: Check generated files
        run: |

          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches = json.load(f).get(
                  "matches",
                  []
              )


          print(
              "FINAL MATCHES:",
              len(matches)
          )


          for m in matches:

              print(
                  m["league"].get("name"),
                  "=>",
                  m["home"].get("name"),
                  "vs",
                  m["away"].get("name")
              )


          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings = json.load(f).get(
                  "leagues",
                  {}
              )


          print(
              "STANDING LEAGUES:",
              len(standings)
          )


          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:

              transfers = json.load(f)


          print(
              "TRANSFERS:",
              len(transfers)
          )

          PY


      # ==========================================
      # SAVE
      # ==========================================

      - name: Save changes
        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git status --short

          git commit \
            -m "Update football data" \
            || true

          git push
