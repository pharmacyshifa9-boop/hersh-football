name: Update Football Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          echo "Checking API..."

          curl -sS \
            -D headers.txt \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            "https://v3.football.api-sports.io/fixtures?date=$(date -u +%Y-%m-%d)" \
            -o response.json

          echo "=============================="
          echo "API RESPONSE"
          echo "=============================="

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Errors:", data.get("errors"))
          print("Results:", data.get("results"))
          print("Response:", len(data.get("response", [])))

          if data.get("response"):
              print("✅ API DATA IS WORKING")
          else:
              print("❌ API RETURNED NO DATA")
          PY

          echo "=============================="
          echo "RATE LIMIT"
          echo "=============================="

          grep -i "ratelimit" headers.txt || true

      - name: Save test
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add response.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Test API Football"
          git push
