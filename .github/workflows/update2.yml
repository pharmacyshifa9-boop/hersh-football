name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # TRANSFERS
      # ========================================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          strong_teams = {
              529, 541, 530, 157,
              42, 50, 33, 49,
              40, 85, 211, 47,
              228, 531, 536,
              645, 234, 520
          }

          filtered = []

          for player in data.get("response", []):
              for transfer in player.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  if (
                      team_in.get("id") not in strong_teams
                      and
                      team_out.get("id") not in strong_teams
                  ):
                      continue

                  filtered.append({
                      "player": player.get("player", {}),
                      "date": date_text,
                      "type": transfer.get("type"),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Transfers saved:",
              len(filtered)
          )
          PY

      # ========================================
      # TODAY'S MATCHES
      # ========================================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo "Getting matches for $TODAY"

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open(
              "matches_raw.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          matches = []

          for item in data.get("response", []):

              matches.append({
                  "fixture": item.get(
                      "fixture",
                      {}
                  ),

                  "league": item.get(
                      "league",
                      {}
                  ),

                  "home": item.get(
                      "teams",
                      {}
                  ).get(
                      "home",
                      {}
                  ),

                  "away": item.get(
                      "teams",
                      {}
                  ).get(
                      "away",
                      {}
                  ),

                  "goals": item.get(
                      "goals",
                      {}
                  )
              })

          output = {
              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "matches": matches
          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Matches saved:",
              len(matches)
          )
          PY

      # ========================================
      # STANDINGS
      # ========================================

      - name: Get standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import json

          api_key = "${API_KEY}"

          leagues = {
              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3
          }

          seasons = 2025

          all_standings = {}

          for name, league_id in leagues.items():

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings"
                  "?league="
                  + str(league_id)
                  + "&season="
                  + str(seasons)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key":
                          api_key
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      raw = response.read()

                      data = json.loads(
                          raw.decode("utf-8")
                      )

                  response_data = data.get(
                      "response",
                      []
                  )

                  if response_data:

                      league_data = response_data[0]

                      league_info = league_data.get(
                          "league",
                          {}
                      )

                      standings = (
                          league_info.get(
                              "standings",
                              []
                          )
                      )

                      if standings:

                          all_standings[name] = {
                              "id": league_id,
                              "name": name,
                              "standings":
                                  standings[0]
                          }

                          print(
                              name,
                              "OK:",
                              len(
                                  standings[0]
                              )
                          )

                      else:

                          print(
                              name,
                              "No standings"
                          )

                  else:

                      print(
                          name,
                          "No response"
                      )

              except Exception as e:

                  print(
                      name,
                      "ERROR:",
                      str(e)
                  )

          output = {
              "updated":
                  __import__(
                      "datetime"
                  ).datetime.now(
                      __import__(
                          "datetime"
                      ).timezone.utc
                  ).isoformat(),

              "leagues":
                  all_standings
          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Standings saved:",
              len(all_standings)
          )
          PY

      # ========================================
      # CHECK DATA
      # ========================================

      - name: Check generated files
        run: |
          echo "=============================="
          echo "Football data files"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          echo ""
          echo "Transfers:"
          python3 - <<'PY'
          import json

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(len(data))
          PY

          echo ""
          echo "Matches:"
          python3 - <<'PY'
          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              len(
                  data.get(
                      "matches",
                      []
                  )
              )
          )
          PY

          echo ""
          echo "Standings:"
          python3 - <<'PY'
          import json

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              list(
                  data.get(
                      "leagues",
                      {}
                  ).keys()
              )
          )
          PY

      # ========================================
      # SAVE
      # ========================================

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git commit \
            -m "Update football data" || true

          git push
