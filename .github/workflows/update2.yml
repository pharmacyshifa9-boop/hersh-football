name: Update Football Data 2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # API KEY
      # ==============================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"

      # ==============================
      # DATE
      # ==============================

      - name: Set date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          FROM_DATE=$(date -u -d "7 days ago" +"%Y-%m-%d")

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "FROM_DATE=$FROM_DATE" >> "$GITHUB_ENV"

          echo "TODAY: $TODAY"
          echo "FROM: $FROM_DATE"

      # ==============================
      # TODAY MATCHES
      # 7 BIG LEAGUES
      # ==============================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -f -sS \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 120 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          echo "✅ Matches downloaded"

      # ==============================
      # CREATE MATCHES
      # ==============================

      - name: Create matches.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          BIG_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          response = data.get(
              "response",
              []
          )

          matches = []

          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              if league.get("id") not in BIG_LEAGUES:
                  continue

              teams = item.get(
                  "teams",
                  {}
              )

              matches.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      league,

                  "home":
                      teams.get(
                          "home",
                          {}
                      ),

                  "away":
                      teams.get(
                          "away",
                          {}
                      ),

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )

              })

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(matches),

              "matches":
                  matches

          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          PY

      # ==============================
      # RECENT RESULTS
      # ==============================

      - name: Get recent results
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          curl -f -sS \
            --retry 5 \
            --retry-delay 5 \
            --retry-max-time 120 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?from=$FROM_DATE&to=$TODAY&status=FT" \
            -o results_raw.json

          echo "✅ Results downloaded"

      # ==============================
      # CREATE RESULTS
      # ==============================

      - name: Create results.json
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          BIG_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          with open(
              "results_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          response = data.get(
              "response",
              []
          )

          results = []

          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              if league.get("id") not in BIG_LEAGUES:
                  continue

              teams = item.get(
                  "teams",
                  {}
              )

              results.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      league,

                  "home":
                      teams.get(
                          "home",
                          {}
                      ),

                  "away":
                      teams.get(
                          "away",
                          {}
                      ),

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )

              })

          results.sort(
              key=lambda x:
                  x.get(
                      "fixture",
                      {}
                  ).get(
                      "date",
                      ""
                  ),
              reverse=True
          )

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(results),

              "matches":
                  results

          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL RESULTS:",
              len(results)
          )

          PY

      # ==============================
      # TRANSFERS
      # ==============================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          rm -rf transfer_data
          mkdir -p transfer_data

          teams=(
            529
            541
            530
            50
            33
            42
            49
            40
            157
            85
            496
            505
            489
          )

          for team in "${teams[@]}"; do

            echo "Getting transfers for $team"

            curl -f -sS \
              --retry 3 \
              --retry-delay 5 \
              --retry-max-time 60 \
              -H "x-apisports-key: $API_KEY" \
              -H "Accept: application/json" \
              -A "Hersh-Football" \
              "https://v3.football.api-sports.io/transfers?team=$team" \
              -o "transfer_data/$team.json" \
              || true

            sleep 3

          done

          echo "✅ Transfers downloaded"

      # ==============================
      # CREATE TRANSFERS
      # ==============================

      - name: Create transfers.json
        run: |

          python3 - <<'PY'

          import json
          import glob

          transfers = []

          for filename in glob.glob(
              "transfer_data/*.json"
          ):

              try:

                  with open(
                      filename,
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

              except Exception as e:

                  print(
                      "Skipping",
                      filename,
                      e
                  )

                  continue

              if data.get("errors"):
                  continue

              for item in data.get(
                  "response",
                  []
              ):

                  player = item.get(
                      "player",
                      {}
                  )

                  for transfer in item.get(
                      "transfers",
                      []
                  ):

                      teams = transfer.get(
                          "teams",
                          {}
                      )

                      transfers.append({

                          "player":
                              player,

                          "date":
                              transfer.get(
                                  "date"
                              ),

                          "type":
                              transfer.get(
                                  "type",
                                  "Transfer"
                              ),

                          "teams": {

                              "in":
                                  teams.get(
                                      "in",
                                      {}
                                  ) or {},

                              "out":
                                  teams.get(
                                      "out",
                                      {}
                                  ) or {}

                          }

                      })

          unique = []

          seen = set()

          for item in transfers:

              player = item.get(
                  "player",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              key = (

                  player.get("id"),

                  item.get("date"),

                  teams.get(
                      "in",
                      {}
                  ).get("id"),

                  teams.get(
                      "out",
                      {}
                  ).get("id")

              )

              if key in seen:
                  continue

              seen.add(key)

              unique.append(item)

          unique.sort(
              key=lambda x:
                  x.get("date") or "",
              reverse=True
          )

          unique = unique[:300]

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  unique,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "TRANSFERS:",
              len(unique)
          )

          PY

      # ==============================
      # STANDINGS
      # ==============================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]

          leagues = {

              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3

          }

          seasons = [
              2026,
              2025,
              2024,
              2023,
              2022
          ]

          result = {}

          for name, league_id in leagues.items():

              print("")
              print(
                  "=============================="
              )

              print(
                  "League:",
                  name
              )

              found = False

              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(

                      url,

                      headers={

                          "x-apisports-key":
                              API_KEY,

                          "Accept":
                              "application/json",

                          "User-Agent":
                              "Hersh-Football"

                      }

                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.load(
                              response
                          )

                  except Exception as e:

                      print(
                          "REQUEST ERROR:",
                          season,
                          e
                      )

                      continue

                  if data.get("errors"):

                      print(
                          "API ERROR:",
                          season,
                          data.get(
                              "errors"
                          )
                      )

                      continue

                  response_data = data.get(
                      "response",
                      []
                  )

                  if not response_data:
                      continue

                  league_data = (
                      response_data[0]
                      .get(
                          "league",
                          {}
                      )
                  )

                  standings = (
                      league_data
                      .get(
                          "standings",
                          []
                      )
                  )

                  if not standings:
                      continue

                  result[name] = {

                      "id":
                          league_id,

                      "season":
                          season,

                      "name":
                          name,

                      "logo":
                          league_data.get(
                              "logo"
                          ),

                      "standings":
                          standings[0]

                  }

                  print(
                      "✅ SUCCESS:",
                      name,
                      "season:",
                      season
                  )

                  found = True

                  break

              if not found:

                  print(
                      "❌ FAILED:",
                      name
                  )

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues":
                  result

          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "STANDING LEAGUES:",
              len(result)
          )

          PY

      # ==============================
      # SAVE
      # ==============================

      - name: Save data
        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"

          git add \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff \
            --cached \
            --quiet; then

            echo "No changes"

            exit 0

          fi

          git commit \
            -m \
            "Update football data"

          git push
