name: Update Football Data 2

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # API KEY
      # ==========================================

      - name: Check API Key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"

      # ==========================================
      # TODAY
      # ==========================================

      - name: Set Date
        run: |
          echo "TODAY=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "TODAY: $(date -u +%Y-%m-%d)"

      # ==========================================
      # 1 REQUEST ONLY
      # TODAY MATCHES
      # ==========================================

      - name: Get Today Matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "⚽ Getting today's matches..."

          curl -sS \
            --max-time 30 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          python3 - <<'PY'
          import json

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          print("API errors:", data.get("errors"))
          print("API results:", data.get("results", 0))
          print("API response:", len(data.get("response", [])))
          PY

      # ==========================================
      # CREATE MATCHES
      # ==========================================

      - name: Create Matches
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open("matches_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          response = data.get("response", [])

          IMPORTANT_TEAMS = {
              529,
              541,
              530,
              50,
              33,
              49,
              40,
              42,
              157,
              85
          }

          BIG_LEAGUES = {
              39,
              140,
              135,
              78,
              61,
              2,
              3
          }

          matches = []

          for item in response:

              league = item.get("league") or {}
              teams = item.get("teams") or {}

              home = teams.get("home") or {}
              away = teams.get("away") or {}

              league_id = league.get("id")

              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              if league_id in BIG_LEAGUES:

                  if (
                      home_id in IMPORTANT_TEAMS
                      or
                      away_id in IMPORTANT_TEAMS
                  ):
                      keep = True

              if (
                  home_id in IMPORTANT_TEAMS
                  or
                  away_id in IMPORTANT_TEAMS
              ):
                  keep = True

              if keep:

                  matches.append({

                      "fixture":
                          item.get("fixture") or {},

                      "league":
                          league,

                      "home":
                          home,

                      "away":
                          away,

                      "goals":
                          item.get("goals") or {}

                  })

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(matches),

              "matches":
                  matches

          }

          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL MATCHES:",
              len(matches)
          )

          PY

      
# ==========================================
      # RESULTS
      # ==========================================

      - name: Create Results
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          try:
              with open(
                  "matches_raw.json",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

          except Exception as e:
              print("❌ Cannot read matches_raw.json:", e)
              data = {}

          response = data.get("response", [])

          IMPORTANT_TEAMS = {
              529, 541, 530, 50, 33,
              49, 40, 42, 157, 85
          }

          BIG_LEAGUES = {
              39, 140, 135, 78, 61, 2, 3
          }

          results = []

          for item in response:

              fixture = item.get("fixture") or {}
              status = fixture.get("status") or {}
              short = status.get("short")

              if short not in {"FT", "AET", "PEN"}:
                  continue

              league = item.get("league") or {}
              teams = item.get("teams") or {}

              home = teams.get("home") or {}
              away = teams.get("away") or {}

              league_id = league.get("id")
              home_id = home.get("id")
              away_id = away.get("id")

              keep = False

              # یارییەکانی یانە گرنگەکان
              if (
                  home_id in IMPORTANT_TEAMS
                  or
                  away_id in IMPORTANT_TEAMS
              ):
                  keep = True

              # لیگە بەهێزەکان
              if league_id in BIG_LEAGUES:
                  keep = True

              if keep:

                  results.append({

                      "fixture": fixture,

                      "league": league,

                      "home": home,

                      "away": away,

                      "goals":
                          item.get("goals") or {}

                  })

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(results),

              "matches":
                  results

          }

          with open(
              "results.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("==============================")
          print("ALL RESULTS FROM API:", len(response))
          print("FINAL RESULTS:", len(results))
          print("==============================")

          PY
      # ==========================================
      # TRANSFERS
      # ONLY 1 REQUEST
      # BARCELONA
      # ==========================================

      - name: Get Transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          echo "🔄 Getting transfers..."

          curl -sS \
            --max-time 30 \
            -H "x-apisports-key: $API_KEY" \
            -H "Accept: application/json" \
            -A "Hersh-Football" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

      - name: Create Transfers
        run: |

          python3 - <<'PY'

          import json
          from datetime import datetime, timezone

          with open(
              "transfers_raw.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          transfers = []

          for item in data.get(
              "response",
              []
          ):

              player = item.get(
                  "player"
              ) or {}

              for transfer in item.get(
                  "transfers",
                  []
              ):

                  teams = transfer.get(
                      "teams"
                  ) or {}

                  transfers.append({

                      "player":
                          player,

                      "date":
                          transfer.get(
                              "date"
                          ),

                      "type":
                          transfer.get(
                              "type",
                              "Transfer"
                          ),

                      "teams": {

                          "in":
                              teams.get(
                                  "in"
                              ) or {},

                          "out":
                              teams.get(
                                  "out"
                              ) or {}

                      }

                  })

          transfers.sort(
              key=lambda x:
                  x.get("date") or "",
              reverse=True
          )

          transfers = transfers[:100]

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "results":
                  len(transfers),

              "transfers":
                  transfers

          }

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL TRANSFERS:",
              len(transfers)
          )

          PY

      # ==========================================
      # STANDINGS
      # 5 REQUESTS
      # ONE FOR EACH LEAGUE
      # ==========================================

      - name: Create Standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ["API_KEY"]

          leagues = {

              "Premier League": 39,

              "La Liga": 140,

              "Serie A": 135,

              "Bundesliga": 78,

              "Ligue 1": 61

          }

          season = 2024

          output = {}

          for name, league_id in leagues.items():

              print("")
              print(
                  "🏆",
                  name
              )

              url = (
                  "https://v3.football.api-sports.io/"
                  "standings"
                  "?league="
                  + str(league_id)
                  + "&season="
                  + str(season)
              )

              request = urllib.request.Request(

                  url,

                  headers={

                      "x-apisports-key":
                          API_KEY,

                      "Accept":
                          "application/json",

                      "User-Agent":
                          "Hersh-Football"

                  }

              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.load(
                          response
                      )

              except Exception as e:

                  print(
                      "ERROR:",
                      e
                  )

                  continue

              if data.get("errors"):

                  print(
                      "API ERROR:",
                      data.get("errors")
                  )

                  continue

              response_data = data.get(
                  "response",
                  []
              )

              if not response_data:

                  print(
                      "NO DATA"
                  )

                  continue

              league_data = (
                  response_data[0].get(
                      "league"
                  ) or {}
              )

              standings = (
                  league_data.get(
                      "standings"
                  ) or []
              )

              if not standings:

                  print(
                      "NO STANDINGS"
                  )

                  continue

              output[name] = {

                  "id":
                      league_id,

                  "season":
                      season,

                  "name":
                      name,

                  "logo":
                      league_data.get(
                          "logo"
                      ),

                  "standings":
                      standings[0]

              }

              print(
                  "✅",
                  name,
                  "OK"
              )

          final = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues":
                  output

          }

          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "FINAL STANDING LEAGUES:",
              len(output)
          )

          PY

      # ==========================================
      # CHECK
      # ==========================================

      - name: Check Data
        run: |

          echo "=============================="
          echo "HERSH FOOTBALL DATA"
          echo "=============================="

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches = json.load(f)

          with open(
              "results.json",
              encoding="utf-8"
          ) as f:

              results = json.load(f)

          with open(
              "transfers.json",
              encoding="utf-8"
          ) as f:

              transfers = json.load(f)

          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings = json.load(f)

          print(
              "FINAL MATCHES:",
              len(
                  matches.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "FINAL RESULTS:",
              len(
                  results.get(
                      "matches",
                      []
                  )
              )
          )

          print(
              "TRANSFERS:",
              len(
                  transfers.get(
                      "transfers",
                      []
                  )
              )
          )

          print(
              "STANDING LEAGUES:",
              len(
                  standings.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY

      # ==========================================
      # SAVE
      # ==========================================

      - name: Save Data
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            matches.json \
            results.json \
            transfers.json \
            standings.json

          if git diff --cached --quiet; then

            echo "No changes"

          else

            git commit \
              -m "Update football data"

            git push origin HEAD:main

          fi
