name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # CHECK API KEY
      # =========================

      - name: Check API key
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API_SPORTS_KEY is missing"
            exit 1
          fi

          echo "✅ API key found"


      # =========================
      # TRANSFERS
      # =========================

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/transfers?team=529" \
            -o transfers_raw.json

          echo "✅ Transfers downloaded"


      - name: Create transfers.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("transfers_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=7)

          important_teams = {
              # Barcelona
              529,

              # Real Madrid
              541,

              # Atletico Madrid
              530,

              # Manchester City
              50,

              # Manchester United
              33,

              # Arsenal
              42,

              # Chelsea
              49,

              # Liverpool
              40,

              # Bayern Munich
              157,

              # PSG
              85,

              # Juventus
              496,

              # Inter
              505,

              # AC Milan
              489
          }

          filtered = []

          for player_data in data.get("response", []):

              player = player_data.get("player", {})

              for transfer in player_data.get("transfers", []):

                  date_text = transfer.get("date", "")

                  try:
                      transfer_date = datetime.strptime(
                          date_text,
                          "%Y-%m-%d"
                      ).date()
                  except:
                      continue

                  if transfer_date < start_date:
                      continue

                  if transfer_date > today:
                      continue

                  teams = transfer.get("teams", {})

                  team_in = teams.get("in", {})
                  team_out = teams.get("out", {})

                  in_id = team_in.get("id")
                  out_id = team_out.get("id")

                  if (
                      in_id not in important_teams
                      and out_id not in important_teams
                  ):
                      continue

                  filtered.append({
                      "player": player,
                      "date": date_text,
                      "type": transfer.get(
                          "type",
                          "Transfer"
                      ),
                      "teams": {
                          "in": team_in,
                          "out": team_out
                      }
                  })

          with open(
              "transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  filtered,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Transfers:",
              len(filtered)
          )
          PY


      # =========================
      # TODAY MATCHES
      # =========================

      - name: Get today's matches
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          echo "Getting matches for $TODAY"

          curl -f -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o matches_raw.json

          echo "✅ Matches downloaded"


      # =========================
      # FILTER IMPORTANT MATCHES
      # =========================

      - name: Create matches.json
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open(
              "matches_raw.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          response = data.get(
              "response",
              []
          )

          print(
              "ALL API MATCHES:",
              len(response)
          )


          # ==========================================
          # IMPORTANT LEAGUES
          # ==========================================

          important_leagues = {
              "Premier League",
              "La Liga",
              "Serie A",
              "Bundesliga",
              "Ligue 1",
              "UEFA Champions League",
              "Champions League",
              "UEFA Europa League",
              "Europa League",

              # Iraq
              "Iraq Stars League",

              # Kurdistan
              "Kurdistan Premier League",
              "Kurdistan Premier League"
          }


          # ==========================================
          # IMPORTANT BIG CLUBS
          # ==========================================

          important_teams = {

              # England
              "Manchester City",
              "Manchester United",
              "Liverpool",
              "Arsenal",
              "Chelsea",
              "Tottenham",
              "Newcastle United",

              # Spain
              "Barcelona",
              "Real Madrid",
              "Atletico Madrid",
              "Atlético Madrid",

              # Germany
              "Bayern Munich",
              "Borussia Dortmund",
              "Bayer Leverkusen",

              # Italy
              "Juventus",
              "Inter",
              "Inter Milan",
              "AC Milan",
              "Milan",
              "Napoli",
              "Roma",

              # France
              "Paris Saint Germain",
              "Paris Saint-Germain",
              "PSG",
              "Marseille",
              "Monaco",

              # Iraq / Kurdistan
              "Zakho",
              "Zakho FC",
              "Duhok",
              "Duhok SC",
              "Erbil",
              "Erbil SC",
              "Newroz",
              "Newroz SC",
              "Hawler",
              "Hawler FC",

              # Kurdistan Premier League
              "Shaklawa",
              "Shaqlawa",
              "Shaklawa SC",

              "Handren",
              "Handren FC",

              "Sirwani Nwe",
              "Sirwani Nwe FC",

              "Akre",
              "Akre SC",

              "Hawlar Peshmarga",
              "Hawler Peshmarga",

              "Ranya",
              "Ranya SC",

              "Sherwana",
              "Sherwana SC",

              "Chwarqurna",
              "Chwarqurna SC",

              "Rzgari",
              "Rzgari SC",

              "Qaladze",
              "Qaladze SC",

              "Pishasazy",
              "Pishasazy SC",

              "Darbandikhan",
              "Darbandikhan SC",

              "Briati",
              "Briati SC",

              "Said Sadiq",
              "Said Sadiq SC"
          }


          matches = []


          for item in response:

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              home = teams.get(
                  "home",
                  {}
              )

              away = teams.get(
                  "away",
                  {}
              )

              league_name = league.get(
                  "name",
                  ""
              )

              home_name = home.get(
                  "name",
                  ""
              )

              away_name = away.get(
                  "name",
                  ""
              )


              keep = False


              # ==========================================
              # KEEP IMPORTANT LEAGUES
              # ==========================================

              if league_name in important_leagues:
                  keep = True


              # ==========================================
              # KEEP IMPORTANT CLUBS
              # ==========================================

              if (
                  home_name in important_teams
                  or
                  away_name in important_teams
              ):
                  keep = True


              if not keep:
                  continue


              matches.append({

                  "fixture":
                      item.get(
                          "fixture",
                          {}
                      ),

                  "league":
                      league,

                  "home":
                      home,

                  "away":
                      away,

                  "goals":
                      item.get(
                          "goals",
                          {}
                      )
              })


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "matches":
                  matches
          }


          with open(
              "matches.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "=============================="
          )

          print(
              "IMPORTANT MATCHES:",
              len(matches)
          )

          print(
              "=============================="
          )


          for match in matches:

              league = match.get(
                  "league",
                  {}
              )

              home = match.get(
                  "home",
                  {}
              )

              away = match.get(
                  "away",
                  {}
              )

              goals = match.get(
                  "goals",
                  {}
              )

              print(
                  league.get("name"),
                  "|",
                  home.get("name"),
                  "-",
                  away.get("name"),
                  "|",
                  goals.get("home"),
                  "-",
                  goals.get("away")
              )

          PY


      # =========================
      # STANDINGS
      # =========================

      - name: Create standings
        env:
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |

          python3 - <<'PY'

          import json
          import urllib.request
          import urllib.error
          import os
          from datetime import datetime, timezone

          API_KEY = os.environ.get(
              "API_KEY",
              ""
          )

          leagues = {

              "Premier League": 39,
              "La Liga": 140,
              "Serie A": 135,
              "Bundesliga": 78,
              "Ligue 1": 61,
              "Champions League": 2,
              "Europa League": 3

          }

          # Free plan seasons
          seasons = [
              2024,
              2023,
              2022
          ]

          result = {}


          for name, league_id in leagues.items():

              print("")
              print(
                  "=============================="
              )

              print(
                  "League:",
                  name
              )

              found = False


              for season in seasons:

                  url = (
                      "https://v3.football.api-sports.io/"
                      "standings"
                      "?league="
                      + str(league_id)
                      + "&season="
                      + str(season)
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "x-apisports-key": API_KEY,
                          "Accept": "application/json",
                          "User-Agent": "Mozilla/5.0"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          raw = response.read()

                          data = json.loads(
                              raw.decode("utf-8")
                          )


                  except urllib.error.HTTPError as e:

                      print(
                          "HTTP ERROR:",
                          e.code,
                          "season:",
                          season
                      )

                      continue


                  except Exception as e:

                      print(
                          "ERROR:",
                          str(e)
                      )

                      continue


                  if data.get("errors"):

                      print(
                          "API ERRORS:",
                          data.get("errors")
                      )

                      continue


                  response_data = data.get(
                      "response",
                      []
                  )


                  if not response_data:
                      continue


                  league_data = (
                      response_data[0].get(
                          "league",
                          {}
                      )
                  )


                  standings = (
                      league_data.get(
                          "standings",
                          []
                      )
                  )


                  if not standings:
                      continue


                  table = standings[0]


                  result[name] = {

                      "id": league_id,

                      "season": season,

                      "name": name,

                      "logo":
                          league_data.get(
                              "logo"
                          ),

                      "standings": table
                  }


                  print(
                      "✅ SUCCESS:",
                      name,
                      "season:",
                      season,
                      "teams:",
                      len(table)
                  )


                  found = True
                  break


              if not found:

                  print(
                      "❌ FAILED:",
                      name
                  )


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues":
                  result
          }


          with open(
              "standings.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "=============================="
          )

          print(
              "TOTAL LEAGUES:",
              len(result)
          )

          print(
              "=============================="
          )

          PY


      # =========================
      # CHECK DATA
      # =========================

      - name: Check generated files
        run: |

          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="

          ls -lh \
            transfers.json \
            matches.json \
            standings.json

          echo ""

          python3 - <<'PY'

          import json

          with open(
              "matches.json",
              encoding="utf-8"
          ) as f:

              matches_data = json.load(f)


          matches = matches_data.get(
              "matches",
              []
          )


          print(
              "FINAL MATCHES:",
              len(matches)
          )


          for item in matches:

              league = item.get(
                  "league",
                  {}
              )

              home = item.get(
                  "home",
                  {}
              )

              away = item.get(
                  "away",
                  {}
              )

              print(
                  league.get("name"),
                  "=>",
                  home.get("name"),
                  "vs",
                  away.get("name")
              )


          with open(
              "standings.json",
              encoding="utf-8"
          ) as f:

              standings_data = json.load(f)


          print(
              "STANDING LEAGUES:",
              len(
                  standings_data.get(
                      "leagues",
                      {}
                  )
              )
          )

          PY


      # =========================
      # SAVE
      # =========================

      - name: Save changes
        run: |

          git config \
            user.name \
            "github-actions"

          git config \
            user.email \
            "github-actions@github.com"

          git add -f \
            transfers.json \
            matches.json \
            standings.json

          git status --short

          git commit \
            -m "Update filtered football data" \
            || true

          git push
